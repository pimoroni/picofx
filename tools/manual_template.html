<style>
/* The palette, header and panels match the picker's and the editor's */
:root {
  color-scheme: light;

  --bg: #f5f3ef;
  --panel: #fff;
  --ink: #26221e;
  --dim: #8a8378;
  --line: #e2ddd4;
  --accent: #00857d;
  --code-ink: #1d4f5c;
  --entry: #0a7f78;

  /* Three roles, matching the shape at the top of the manual: what is being
     driven, what drives it, and the values given to either. The editor uses the same colours */
  --target: #1f6feb;
  --effect: #0a7f78;
  --value: #a8500a;
  --scene: #7b3fb8;
  --faint: #5d656e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.62 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.8rem 1.4rem;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 5;
  flex-wrap: wrap;
}

header h1 { font-size: 1.1rem; line-height: 1.5; margin: 0 auto 0 0; }
header h1 .version { font-size: 0.8rem; font-weight: 400; color: var(--dim); }

header a {
  font-size: 0.88rem;
  padding: 0.42rem 0.85rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}

header a:hover { border-color: var(--accent); color: var(--accent); }

.page {
  max-width: 68rem;
  margin: 0 auto;
  padding: 1.5rem 1.4rem 4rem;
  display: grid;
  gap: 2.5rem;
  /* A plain 1fr grows to fit its widest table or example, so minmax(0, ...) keeps them scrolling
     in their own boxes */
  grid-template-columns: minmax(0, 1fr);
}

@media (min-width: 62rem) {
  .page { grid-template-columns: 15rem minmax(0, 1fr); }
  /* The sidebar stretches to the row so the box inside it has somewhere to travel;
     a sticky element in a start-aligned grid item cannot move at all. It sits below the
     header, which is sticky too. */
  .contents {
    position: sticky;
    top: 4.6rem;
    max-height: calc(100vh - 6rem);
    overflow-y: auto;
  }
}

.contents {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem 1.2rem;
  font-size: 0.9rem;
}

.contents h2 {
  margin: 0 0 0.6rem;
  font-size: 0.75rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--dim);
  border: 0;
}

.contents ul { list-style: none; margin: 0; padding: 0; }
.contents li { margin: 0.18rem 0; }
.contents a { color: var(--ink); text-decoration: none; }
.contents a:hover { color: var(--accent); text-decoration: underline; }

.contents summary {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  cursor: pointer;
  list-style: none;
}

.contents summary::-webkit-details-marker { display: none; }

/* The triangle is drawn rather than a glyph, so it turns with the section. */
.contents summary::before {
  content: "";
  flex: none;
  width: 0;
  height: 0;
  border-left: 0.32rem solid var(--dim);
  border-top: 0.26rem solid transparent;
  border-bottom: 0.26rem solid transparent;
  transition: transform 0.12s ease;
}

.contents details[open] > summary::before { transform: rotate(90deg); }

.contents details > ul {
  margin: 0.15rem 0 0.4rem 0.95rem;
  font-size: 0.85rem;
}

main { min-width: 0; }

h2 {
  font-size: 1.45rem;
  margin: 2.6rem 0 0.9rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--line);
}

main h2:first-child { margin-top: 0; }

h3 {
  font-size: 1.1rem;
  margin: 1.9rem 0 0.7rem;
  color: var(--dim);
}

/* A heading jumped to clears the sticky header */
h2:target, h3:target { scroll-margin-top: 5rem; }

p { margin: 0 0 1rem; }

a { color: var(--accent); }

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.9em;
  color: var(--code-ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0.25rem;
  padding: 0.05rem 0.3rem;
}

pre {
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  margin: 0 0 1.15rem;
  overflow-x: auto;
}

pre.entry { border-left-color: var(--entry); }

pre code {
  background: none;
  border: 0;
  padding: 0;
  color: inherit;
  font-size: 0.875rem;
  line-height: 1.55;
}

.s-target { color: var(--target); }
.s-effect { color: var(--effect); font-weight: 600; }
.s-value { color: var(--value); }
.s-scene { color: var(--scene); font-weight: 600; }
.s-name { color: var(--ink); }
.s-punc { color: var(--faint); }
/* The colon is the one division the format has, so it carries weight the '=' does not */
.s-colon { color: var(--ink); font-weight: 700; }

.scroll { overflow-x: auto; margin: 0 0 1.3rem; }

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.94rem;
}

th, td {
  text-align: left;
  vertical-align: top;
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid var(--line);
}

th {
  font-size: 0.75rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--dim);
  border-bottom-width: 2px;
}

tbody tr:last-child td { border-bottom: 0; }
td:first-child { white-space: nowrap; }

footer {
  grid-column: 1 / -1;
  margin-top: 1rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--line);
  font-size: 0.92rem;
  color: var(--dim);
}

footer h2 {
  font-size: 0.75rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--dim);
  margin: 0 0 0.5rem;
  padding: 0;
  border: 0;
}

main ul { margin: 0 0 1.2rem; padding-left: 1.2rem; }
main li { margin: 0.25rem 0; }

footer p { margin: 0; }
</style>
