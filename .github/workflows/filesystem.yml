name: Zip Files

on:
  push:
  pull_request:
  release:
    types: [published]

env:
  PIMORONI_AYE_ARR_VERSION: v1.0.0

jobs:
  build:
    name: Build ${{matrix.name}}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: TinyFX
            basename: tiny_fx
            shortname: tiny_fx
            board: PIMORONI_TINYFX
          - name: TinyFX W
            basename: tiny_fx
            shortname: tiny_fx_w
            board: PIMORONI_TINYFX
          - name: MightyFX
            basename: mighty_fx
            shortname: mighty_fx
            board: PIMORONI_MIGHTYFX

    env:
      RELEASE_FILE: ${{matrix.shortname}}-${{github.event.release.tag_name || github.sha}}
      ROOT_DIR: "picofx"
      BOARD_DIR: "picofx/boards/${{matrix.board}}"
      LIBS_DIR: "picofx/lib_temp"
      EX_DIR: "picofx/ex_temp"

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        path: picofx

    # Check out Pimoroni Aye Arr
    - uses: actions/checkout@v6
      with:
        repository: pimoroni/aye_arr
        ref: ${{env.PIMORONI_AYE_ARR_VERSION}}
        submodules: false
        path: aye_arr

    - name: "Assemble lib content"
      shell: bash
      run: |
        mkdir -p ${{env.LIBS_DIR}}/lib
        cp -v -r ${{env.ROOT_DIR}}/picofx ${{env.LIBS_DIR}}/lib
        cp -v -r ${{env.BOARD_DIR}}/visible_libs/. ${{env.LIBS_DIR}}/lib
        cp -v -r ${{env.BOARD_DIR}}/../visible_libs/. ${{env.LIBS_DIR}}/lib
        cp -v -r ${{env.ROOT_DIR}}/../aye_arr/aye_arr ${{env.LIBS_DIR}}/lib
        find ${{env.LIBS_DIR}} -type f -name '*.md' -exec rm -v {} \;

    # autofx plays the FX drive, which only the drive variants carry, frozen into their firmware
    - name: "Leave autofx out of the libraries"
      shell: bash
      run: rm -v ${{env.LIBS_DIR}}/lib/autofx.py

    - name: "Assemble example content"
      shell: bash
      run: |
        mkdir -p ${{env.EX_DIR}}
        cp -v -r picofx/examples/${{matrix.basename}}/. ${{env.EX_DIR}}
        rm -v -f ${{env.EX_DIR}}/README.md
        rm -v -r -f ${{env.EX_DIR}}/examples/python/audio/photon_sword
        rm -v -f ${{env.EX_DIR}}/examples/python/audio/photon_sword.py

    - name: "Append W example content"
      if: matrix.shortname == 'tiny_fx_w'
      shell: bash
      run: |
        cp -v -r picofx/examples/tiny_fx_w/. ${{env.EX_DIR}}
        rm -v -f ${{env.EX_DIR}}/README.md

    - name: Libs .zip artifact
      if: matrix.shortname != 'tiny_fx_w'
      uses: actions/upload-artifact@v7
      with:
        name: ${{env.RELEASE_FILE}}-libraries-only
        path: picofx/lib_temp

    - name: Examples .zip artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{env.RELEASE_FILE}}-examples-only
        path: "picofx/ex_temp"

    # A release takes files, so each folder is zipped first, its contents at the zip's top level
    - name: "Release: Zip the libraries and examples"
      if: github.event_name == 'release'
      shell: bash
      run: |
        (cd picofx/lib_temp && zip -r "$GITHUB_WORKSPACE/${{env.RELEASE_FILE}}-libraries-only.zip" .)
        (cd picofx/ex_temp && zip -r "$GITHUB_WORKSPACE/${{env.RELEASE_FILE}}-examples-only.zip" .)

    - name: "Release: Upload the libraries .zip"
      if: github.event_name == 'release' && matrix.shortname != 'tiny_fx_w'
      uses: softprops/action-gh-release@v3
      with:
        files: ${{env.RELEASE_FILE}}-libraries-only.zip

    - name: "Release: Upload the examples .zip"
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: ${{env.RELEASE_FILE}}-examples-only.zip
