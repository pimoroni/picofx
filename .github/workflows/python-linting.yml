name: Python Linting

on:
  push:
  pull_request:

jobs:
  build:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Install Python
      uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
      with:
        python-version: '3.13'

    - name: Install Python Deps
      run: source ci/python.sh && qa_prepare_all

    - name: Lint MicroPython Frozen Libs
      shell: bash
      run: source ci/python.sh && qa_libs_check

    - name: Lint MicroPython Examples
      shell: bash
      run: source ci/python.sh && qa_examples_check

    - name: Check Example Args Lines
      shell: bash
      run: python3 tools/check_example_args.py examples

    - name: Lint MicroPython PicoFX
      shell: bash
      run: source ci/python.sh && qa_picofx_check

    - name: Check Each Board's Manual Is Rebuilt
      shell: bash
      run: |
        for manual in boards/*/manual/manual.json; do
          board="${manual%/manual/manual.json}"
          python3 tools/build_manual.py "$board"
          git diff --exit-code -- "$board/manual/MANUAL.md" "$board/fx_libs/fx_manual.py"
        done

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'

    # The picker's parts are bundled, and the drive's pages minified, by the esbuild pinned in
    # tools/picker, beside the parsers the module check reads the parts with
    - name: Install the Picker's Build Tools
      shell: bash
      run: npm ci --prefix tools/picker

    - name: Check the Picker's Imports and Exports
      shell: bash
      run: node tools/picker/check_modules.js

    - name: Check Each Board's Editor Is Rebuilt
      shell: bash
      run: |
        for description in boards/*/editor/fx_board.json; do
          python3 tools/build_editor.py --check "${description%/editor/fx_board.json}"
        done
