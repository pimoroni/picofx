name: Picker

on:
  push:
  pull_request:

jobs:
  test:
    name: Picker modules and round trips
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Check The Picker's Modules
      run: |
        npm ci --prefix tools/picker
        node tools/picker/check_modules.js

    - name: Install Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install Playwright
      run: |
        pip install playwright pytest
        playwright install --with-deps chromium

    - name: Check Each Board's Picker Is Rebuilt
      run: |
        for description in boards/*/editor/fx_board.json; do
          python3 tools/build_editor.py --check "${description%/editor/fx_board.json}"
        done

    - name: Test Each Board's Picker
      run: pytest -v tests/picker

    - name: Test Each Board's Picker With Independent Parts Loaded In Reverse
      env:
        PICKER_REVERSE_TIES: 1
      run: |
        for description in boards/*/editor/fx_board.json; do
          python3 tools/build_editor.py "${description%/editor/fx_board.json}"
        done
        pytest -q tests/picker
