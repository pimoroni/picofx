// ---- blinking through several colours -----------------------------------------------------
// Blink takes one colour or several. With several it blinks through them in turn, one a beat,
// which is picofx's rgb_blink. The list is the stretch's blinks, {colours, at}, at being the
// one the picker above is changing; a stretch with no list has the one colour it always had.
// A list is written with the words and hexes at full and the stretch's brightness as level=,
// rgb_blink taking one level for all of them.

var BLINK = "Blink";

// The colours a stretch blinks through, where it has more than one and plays them in colour
function blinkList(run, section) {
  var first = run && run.lamps[section.from];
  if (section.look !== BLINK || !section.blinks || section.blinks.colours.length < 2 ||
      !first || !first.colour) return null;
  return section.blinks.colours;
}

// A colour's word, black included, which a set of colours to blink through may hold
function blinkNamed(hex) {
  return hex.replace("#", "").toLowerCase() === "000000" ? "black" : wordFor(hex);
}

function blinkWord(hex) {
  return blinkNamed(hex) || hex.replace("#", "").toLowerCase();
}

// Above the swatches, the colours it blinks through, each a chip that the picker changes
// while it is chosen, with a way to add another and to take one away
chosenSteps.push(function (where, run) {
  var box = document.getElementById(where);
  var section = run && run.sections[run.picked];
  var pick = box && box.querySelector(".chosen .colourpick");
  var first = section && run.lamps[section.from];
  if (!pick || section.look !== BLINK || !first || !first.colour) return;
  function live() { return run.sections[run.picked]; }
  var blinks = section.blinks || {colours: [section.colour || "#ff0000"], at: 0};
  blinks.colours[blinks.at] = section.colour;
  section.blinks = blinks;

  function choose(at) {
    var mine = live();
    mine.blinks.at = at;
    mine.colour = mine.blinks.colours[at];
    mine.custom = !blinkNamed(mine.colour);
    draw();
  }

  var row = document.createElement("div");
  row.className = "blinklist";
  var said = document.createElement("span");
  said.className = "blinksay";
  said.textContent = blinks.colours.length > 1 ? "Blinks through" : "Blinks in";
  row.appendChild(said);
  blinks.colours.forEach(function (hex, at) {
    var chip = document.createElement("button");
    chip.type = "button";
    chip.className = "blinkchip" + (at === blinks.at ? " on" : "");
    chip.style.setProperty("--chip", hex);
    chip.title = (at === blinks.at ? "the colour the picker below is changing, " : "change ") +
                 (blinkNamed(hex) || hex);
    chip.onclick = function () { choose(at); };
    row.appendChild(chip);
    if (blinks.colours.length > 1) {
      var drop = document.createElement("button");
      drop.type = "button";
      drop.className = "blinkdrop";
      drop.textContent = "\u00d7";
      drop.title = "stop blinking in " + (blinkNamed(hex) || hex);
      drop.onclick = function () {
        var mine = live();
        mine.blinks.colours.splice(at, 1);
        var left = mine.blinks.colours;
        mine.blinks.at = Math.min(mine.blinks.at, left.length - 1);
        mine.colour = left[mine.blinks.at];
        mine.custom = !blinkNamed(mine.colour);
        if (left.length === 1) mine.blinks = undefined;
        draw();
      };
      row.appendChild(drop);
    }
  });
  var more = document.createElement("button");
  more.type = "button";
  more.className = "blinkmore";
  more.textContent = "+ another colour";
  more.title = "blink through several colours in turn, one a beat";
  // The colour added is a copy of the last, a custom one included, to be changed from there
  more.onclick = function () {
    var mine = live();
    if (!mine.blinks) mine.blinks = {colours: [mine.colour], at: 0};
    var colours = mine.blinks.colours;
    colours.push(colours[colours.length - 1]);
    choose(colours.length - 1);
  };
  row.appendChild(more);
  pick.insertBefore(row, pick.firstChild);
});

// ---- the board, the same in every scene ------------------------------------------------
// How the board is built is the same in every scene: which outputs have an adapter
// fitted, how long each strip is, and which screen is plugged into each port. The pages
// built on this one differ only in where those are shown and when they can be changed.

// Which panel is plugged into each screen port, or none. Only the size is the board's:
// which way up it is mounted is left for when screens are settled
var SCREEN_PORTS = BOARD.screens ? BOARD.screens.ports : [];
// The catalogue is the board's own, so a board that finds it has no screen ports offers none
SCREEN_PORTS = SCREEN_PORTS.filter(function (port) {
  return CATALOGUE.screen_ports.indexOf(port.id) >= 0;
});
// The sizes a panel can be, as the firmware takes them, the catalogue's hub being no panel size
var SCREEN_SIZES = (SCREEN_PORTS.length ? CATALOGUE.board_settings[SCREEN_PORTS[0].id] : [])
  .filter(function (inches) { return inches !== "hub"; });
var screensFitted = {};
SCREEN_PORTS.forEach(function (port) { screensFitted[port.id] = ""; });

// Breaking an output out, or putting it back, is done to every scene in turn, each carrying
// its own looks across. A scene's steps to undo end there, being about
// lamps that have since moved: putting the output back is the way to undo it
function acrossScenes(change) {
  return function (out) {
    store();
    var editing = state.at;
    var before = {wiring: JSON.stringify(wiring), order: JSON.stringify(order)};
    // Each scene is changed with the page held still, since drawing would store what is
    // being changed into the scene being edited
    drawHeld = true;
    try {
      [state.always].concat(state.scenes).forEach(function (slot) {
        wiring = JSON.parse(before.wiring);
        order = JSON.parse(before.order);
        apply(slot.body);
        change(out);
        runs.forEach(function (run) {
          run.was = [];
          run.undone = [];
        });
        slot.body = capture();
      });
    } finally {
      drawHeld = false;
    }
    state.at = editing;
    apply(slotAt(editing).body);
    draw();
  };
}

var breakOutInScenes = acrossScenes(changeWiring(breakOutWiring, false));
var rejoinInScenes = acrossScenes(changeWiring(rejoinWiring, true));

// Where a lamp sits is the build's as well. Moving one keeps every scene's looks on the
// lamps they were on, the way breaking out does, so a stretch the move takes apart
// becomes two playing the same
var moveLampInScenes = acrossScenes(function (move) {
  acrossWiring(function () { placeLamp(move); });
});

// Whether a lamp can be dragged to where it sits just now. Where a lamp sits is changed with
// the wiring, so only where that can be
function lampsMovable() { return canEdit("outPanel"); }

// The colour outputs that break out, by place
function breakingOutputs() {
  var found = [];
  OUTPUTS.forEach(function (output, out) { if (!output.mono && output.breaks) found.push(out); });
  return found;
}

// The outputs broken out, as a person would say it
function brokenSaid() {
  var breaking = breakingOutputs();
  var broken = breaking.filter(function (out) { return wiring[out].broken; });
  if (!broken.length) {
    return breaking.length === 1 ? outputSaid(breaking[0]) + " is one colour light"
                                 : "every output is one colour light";
  }
  // Three or more in a row close up into a range, as the file writes them, so the box is
  // never much longer than it is with nothing broken out and the setup hint keeps its room
  var numbers = broken.filter(function (out) { return OUTPUTS[out].number !== null; })
    .map(function (out) { return OUTPUTS[out].number; });
  var parts = [];
  for (var at = 0; at < numbers.length;) {
    var end = at;
    while (end + 1 < numbers.length && numbers[end + 1] === numbers[end] + 1) end++;
    if (end - at >= 2) parts.push(numbers[at] + "-" + numbers[end]);
    else for (var one = at; one <= end; one++) parts.push(String(numbers[one]));
    at = end + 1;
  }
  var said = parts.length ? [(numbers.length === 1 ? "output " : "outputs ") + parts.join(", ")]
                          : [];
  broken.forEach(function (out) { if (OUTPUTS[out].number === null) said.push(outputSaid(out)); });
  return said.join(" and ") + (broken.length === 1 ? " is" : " are") + " broken out";
}

// ---- what the file says about the board -------------------------------------------------
// The parts below add their own steps to the board line: what each readies before it is
// written, and what each makes of the line written so far, both in the order the parts come

var boardLineSteps = {before: [], after: []};

function boardLine() {
  boardLineSteps.before.forEach(function (step) { step(); });
  var tokens = [];
  SCREEN_PORTS.forEach(function (port) {
    if (screensFitted[port.id]) tokens.push(port.id + "=" + screensFitted[port.id]);
  });
  // A strip's length brings its connector up, so it is given only where some scene plays on it
  var bodies = [state.always.body].concat(state.scenes.map(function (scene) {
    return scene.body;
  }));
  runs.filter(function (run) { return run.strip; }).forEach(function (run) {
    var used = bodies.some(function (body) {
      var held = body && body.runs && body.runs[run.name];
      return held && held.sections.some(function (section) { return section.look; });
    });
    if (used) tokens.push(run.name + "=" + run.leds + stripLengthTail(run));
  });
  var line = tokens.length ? "board: " + tokens.join(" ") : "";
  boardLineSteps.after.forEach(function (step) { line = step(line); });
  return line;
}

// ---- where the board is set up ----------------------------------------------------------
// Every fact about the board stays beside what it is about: the wiring on the outputs, a
// strip's length on the strip, a screen's type on the screen. Each reads as a box in its
// section's own colour, and the whole board is set up at once in a setup mode.

// Whether the whole page is in its setup mode
var setupOn = false;

// The panels that hold a board fact, and the colour each one's box takes
var SECTIONS = {outPanel: "outs"};
STRIPS.forEach(function (strip) { SECTIONS[strip.id + "Panel"] = strip.id; });

// Whether the board facts in this panel can be changed just now
function canEdit(panel) { return setupOn; }

// ---- selection waits while the board is set up ------------------------------------------------
// A stretch is picked to give it a look, which setup does not do, so a tap there picks
// nothing and nothing looks picked. What was picked is held by its lamp, the wiring
// being free to move it, and is picked again when setup ends; an output broken out or
// put back meanwhile is picked instead, as it would have been outside setup

var heldPick = null;
var heldOutput = null;

function setSetup(on) {
  if (on && !setupOn) {
    var section = active.sections[active.picked];
    heldPick = section ? lampKey(active.lamps[section.from]) : null;
    heldOutput = null;
  }
  setupOn = on;
  if (!on) {
    if (heldOutput !== null) {
      pickOutput(heldOutput);
    } else if (heldPick) {
      runs.some(function (run) {
        var at = run.lamps.map(lampKey).indexOf(heldPick);
        if (at >= 0) pick(run, sectionAt(run, at));
        return at >= 0;
      });
    }
    heldPick = null;
    heldOutput = null;
  }
  showChosen();
}

// Nothing looks picked while setup is on: the marks are drawn by the pages below, so they
// are taken off once drawn
function unmark() {
  document.querySelectorAll(".lamp.ringed, .sec.picked, .card.picked").forEach(function (one) {
    one.classList.remove("ringed", "picked");
  });
  document.querySelectorAll(".run svg rect.ringed").forEach(function (ring) {
    ring.parentNode.removeChild(ring);
  });
}

// A section's coloured box, the chip icon inside it with whatever the fact says
function boardBox(panel, parts) {
  var box = document.createElement("span");
  box.className = "chip boardchip " + SECTIONS[panel];
  box.title = "How the board is built, which is the same in every scene";
  box.appendChild(boardIcon());
  parts.forEach(function (part) {
    box.appendChild(typeof part === "string" ? document.createTextNode(part) : part);
  });
  return box;
}

function small(words) {
  var said = document.createElement("small");
  said.textContent = words;
  return said;
}

// The board's chip, three legs a side, set three apart as the smallest spacing that still
// reads as legs at 16px
function boardIcon() {
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 14 14");
  svg.setAttribute("width", "13");
  svg.setAttribute("height", "13");
  svg.setAttribute("class", "boardicon");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = "<rect x='3' y='3' width='8' height='8' rx='1' fill='none' " +
                  "stroke='currentColor' stroke-width='1.3'/>" +
                  "<path d='M4 0.8V3M7 0.8V3M10 0.8V3M4 11v2.2M7 11v2.2M10 11v2.2" +
                  "M0.8 4H3M0.8 7H3M0.8 10H3M11 4h2.2M11 7h2.2M11 10h2.2' " +
                  "stroke='currentColor' stroke-width='1.3' stroke-linecap='round'/>";
  return svg;
}

// ---- the facts, in place --------------------------------------------------------------------

// Where the wiring cannot be changed an output's arrow is left out. What stands in its place
// takes no room, as the arrow does, or each output's lamps would sit further apart outside setup
function noArrow() {
  var none = document.createElement("span");
  none.style.position = "absolute";
  return none;
}

function renderOutFacts() {
  var box = document.getElementById("outFacts");
  box.textContent = "";
  box.appendChild(boardBox("outPanel", ["Wiring", small(brokenSaid())]));
  if (canEdit("outPanel")) {
    var hint = document.createElement("span");
    hint.className = "hint";
    var breaking = breakingOutputs();
    hint.textContent = "Drag a light to where it sits in your build." +
      (breaking.length > 1 ? " Arrows split an output into three mono lights, or rejoin them."
       : breaking.length ? " The arrow on " + outputSaid(breaking[0]) + " splits it into three " +
                           "mono lights, or rejoins them." : "");
    hint.title = hint.textContent;
    box.appendChild(hint);
  }
}

// What a strip is built as, its length and what follows it on the board line
function stripBuilt(run) {
  return run.leds + " LEDs, " + stripChipShown(run);
}

// Whether a strip is there, on the run and on the entry a fresh run is made from
function stripThere(run, there) { stripSet(run, {there: there}); }

function capitalised(text) { return text.charAt(0).toUpperCase() + text.slice(1); }

// Why a strip cannot be fitted just now, or nothing where it can: a strip taking other strips'
// terminals cannot be fitted beside them, nor they beside it
function stripBlockedBy(run) {
  if (run.there) return "";
  var fitted = runs.filter(function (one) {
    return one.strip && one.there && run.takes.indexOf(one.name) >= 0;
  });
  if (fitted.length) {
    return capitalised(run.label) + " takes " + run.connector + ", so it cannot be fitted beside " +
           fitted.map(function (one) { return one.label; }).join(" and ") + ". Remove " +
           (fitted.length > 1 ? "them" : "it") + " to fit one here.";
  }
  var taking = runs.filter(function (one) {
    return one.strip && one.there && one.takes.indexOf(run.name) >= 0;
  })[0];
  return taking ? capitalised(taking.label) + " uses " + taking.connector +
                  ". Remove it to fit a strip here." : "";
}

// Taking a strip out clears what it plays in every scene, the lines kept from a file
// included, which leaves its length unwritten and its connector off
function dropStrip(run) {
  forgetKeptFor(run);
  store();
  allBodies().forEach(function (held) {
    var kept = held.runs[run.name];
    if (!kept) return;
    kept.sections = [blank(0, run.leds - 1, run)];
    kept.picked = 0;
    kept.was = [];
    kept.undone = [];
  });
  stripThere(run, false);
  apply(slotAt(state.at).body);
  draw();
}

// The cross on a strip's chip while the board is edited, as a screen has on its own
function stripDrop(run) {
  var drop = document.createElement("button");
  drop.type = "button";
  drop.className = "drop";
  drop.textContent = "\u00d7";
  drop.title = "Take this strip out of every scene";
  drop.onclick = function () { dropStrip(run); };
  return drop;
}

// A strip not fitted offers to be added, which only editing the board can take up, or says
// why it cannot be
function renderStripOut(box, run, panel) {
  box.textContent = "";
  box.appendChild(boardBox(panel, ["Strip", small("not fitted")]));
  var blocked = stripBlockedBy(run);
  if (blocked) {
    var why = document.createElement("span");
    why.className = "stripblocked says";
    why.textContent = blocked;
    box.appendChild(why);
    return;
  }
  var add = document.createElement("button");
  add.type = "button";
  add.className = "addstrip";
  add.textContent = "add this strip";
  add.disabled = !canEdit(panel);
  add.onclick = function () {
    stripThere(run, true);
    workOn(panel);
    draw();
  };
  box.appendChild(add);
}

function renderLeds(where, run) {
  var box = document.getElementById(where);
  var panel = run.id + "Panel";
  document.getElementById(panel).classList.toggle("stripout", !run.there);
  if (!run.there) {
    renderStripOut(box, run, panel);
    return;
  }
  // The strip's own count box is already the board's, so the icon goes inside it and it
  // takes the strip's colour
  if (canEdit(panel)) {
    renderStripChip(where, run);
    var says = box.querySelector(".says");
    if (says) box.removeChild(says);
    var chip = box.querySelector(".chip");
    chip.className = "chip boardchip " + SECTIONS[panel];
    chip.title = "How the board is built, which is the same in every scene";
    chip.insertBefore(boardIcon(), chip.firstChild);
    chip.appendChild(stripDrop(run));
  } else {
    box.textContent = "";
    box.appendChild(boardBox(panel, ["Strip", small(stripBuilt(run))]));
  }
}

// ---- turning setup on ------------------------------------------------------------------------

function setupButton(label, on, act) {
  var button = document.createElement("button");
  button.type = "button";
  button.className = "setupbutton" + (on ? " on" : "");
  // The board's chip, as every board setting wears it, since this is where they open
  button.appendChild(boardIcon());
  button.appendChild(document.createTextNode(label));
  button.addEventListener("click", act);
  return button;
}

drawSteps.after.push(function () {
  renderOutFacts();
  // What is not the board stands back while it is set up
  document.body.classList.toggle("setupall", setupOn);
  if (setupOn) unmark();
  paintAll();
});

// ---- the wiring, while the board is set up ------------------------------------------------
// In the outputs' own panel and only while the board is set up, the board's seven connectors along the bottom, each colour output one pin and
// each broken-out one three, a faint line from every pin to the lamp it feeds, brought
// forward by pointing at the lamp or the connector, a moved lamp sliding to its new place,
// and the lamps out of the order they are wired in with their numbers in bold.

var SLIDE_MS = 420;

// The connectors sit under both sides of the outputs, before their tools and settings
(function () {
  var row = document.createElement("div");
  row.id = "wiringRow";
  var sides = document.getElementById("sides");
  sides.parentNode.insertBefore(row, sides.nextSibling);
}());

// Every lamp in the order the board wires them: an output's own lamp, or its three channels
function wiredLamps() {
  var lamps = [];
  wiring.forEach(function (one, out) { lamps = lamps.concat(placesOf(out)); });
  lamps.forEach(function (lamp) { lamp.key = lampKey(lamp); });
  return lamps;
}

// The board as the out-of-order rule reads it, a side of the same lamps
// in wired order and in build order
function wiredSide() {
  var wired = wiredLamps();
  var byKey = {};
  wired.forEach(function (lamp) { byKey[lamp.key] = lamp; });
  return {wiring: wired, order: order.map(function (place) { return byKey[lampKey(place)]; })};
}

// The lamps on show
function lampsShown() {
  return Array.prototype.slice.call(document.querySelectorAll(
    "#outRun .lamp[data-key], #monoRun .lamp[data-key]"));
}

function lampNode(key) {
  return lampsShown().filter(function (node) { return node.dataset.key === key; })[0] || null;
}

// A line, its lamp and its pin brought forward, or let go
function bringForward(keys, on) {
  keys.forEach(function (key) {
    document.querySelectorAll("#outPanel [data-key='" + key + "']").forEach(function (node) {
      node.classList.toggle("wirehot", on);
    });
  });
}

// How far the sides and what follows them run outside setup, the cutting and the bar
// included, so the connectors can take up the same room while setting up
var unwiredSpan = null;

function sidesSpan() {
  return document.getElementById("outTools").getBoundingClientRect().top -
         document.getElementById("sides").getBoundingClientRect().top;
}

function renderConnectors() {
  var box = document.getElementById("wiringRow");
  box.textContent = "";
  var old = document.getElementById("wiringLines");
  if (old) old.parentNode.removeChild(old);
  // A board whose outputs are its own LEDs has no wiring to show
  document.getElementById("outPanel").classList.toggle("wired", setupOn && BOARD.wiring_order);
  if (!setupOn || !BOARD.wiring_order) {
    unwiredSpan = sidesSpan();
    return;
  }

  var row = document.createElement("div");
  row.className = "wireconnectors";
  wiring.forEach(function (one, out) {
    var block = document.createElement("div");
    block.className = "wireconnector";
    var pins = document.createElement("div");
    pins.className = "wirepins";
    var keys = [];
    // A mono output is one light on one pin, with no channel to mark
    var single = OUTPUTS[out].mono;
    placesOf(out).forEach(function (place) {
      var pin = document.createElement("span");
      var key = lampKey(place);
      pin.className = "wirepin" + (place.channel === null ? " whole" : single ? " single" : "");
      pin.dataset.key = key;
      if (place.channel !== null && !single) pin.style.background = CHANNEL_INKS[place.channel];
      pins.appendChild(pin);
      keys.push(key);
    });
    block.appendChild(pins);
    var name = document.createElement("b");
    name.textContent = shortName({out: out, colour: true});
    block.appendChild(name);
    block.title = outputSaid(out) + (one.broken && !single ? ", broken out into three" : "");
    // A pin is too small to aim at, so the connector is what is pointed at
    block.addEventListener("mouseenter", function () { bringForward(keys, true); });
    block.addEventListener("mouseleave", function () { bringForward(keys, false); });
    row.appendChild(block);
  });
  box.appendChild(row);

  var side = wiredSide();
  var astray = astrayOf(side);
  astray.forEach(function (lamp) {
    var node = lampNode(lamp.key);
    if (node) node.classList.add("astray");
  });
  var said = document.createElement("p");
  said.className = "wiresay";
  said.innerHTML = astray.length
    ? "<b>" + astray.length + " of " + side.order.length + "</b> lights are out of the order " +
      "they are wired in, their numbers in bold. Hover over a light or a connector to " +
      "highlight its wire."
    : "Every light is in the order it is wired. Hover over a light or a connector to " +
      "highlight its wire.";
  box.appendChild(said);
  // The connectors sit lower by whatever the cutting and the bar took beyond them, the
  // lines running on down, so setting up leaves the section its size
  row.style.marginTop = "";
  var short = unwiredSpan === null ? 0 : unwiredSpan - sidesSpan();
  if (short > 0) row.style.marginTop = (parseFloat(getComputedStyle(row).marginTop) + short) + "px";
  drawLines();
}

// Faint lines, never none: with no line at all, the lamps over a connector read as the ones
// it feeds, which a rearranged build is not
function drawLines() {
  var panel = document.getElementById("outPanel");
  var from = panel.getBoundingClientRect();
  var lines = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  lines.id = "wiringLines";
  lines.setAttribute("class", "wirelines");
  wiredLamps().forEach(function (lamp) {
    var node = lampNode(lamp.key);
    var pin = panel.querySelector(".wirepin[data-key='" + lamp.key + "']");
    if (!node || !pin) return;
    var top = node.getBoundingClientRect();
    var bottom = pin.getBoundingClientRect();
    var start = {x: bottom.left + bottom.width / 2 - from.left, y: bottom.top - from.top};
    var end = {x: top.left + top.width / 2 - from.left, y: top.bottom - from.top};
    var rise = (start.y - end.y) / 2;
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M" + start.x + " " + start.y + " C" + start.x + " " +
                      (start.y - rise) + " " + end.x + " " + (end.y + rise) + " " + end.x +
                      " " + end.y);
    path.dataset.key = lamp.key;
    path.style.stroke = lamp.channel === null || OUTPUTS[lamp.out].mono ? "var(--boardOuts)"
                                                                        : CHANNEL_INKS[lamp.channel];
    lines.appendChild(path);
  });
  panel.appendChild(lines);
}

// ---- the move shown ------------------------------------------------------------------------
// Every lamp measured before a move and played back from its old place to its new one, the
// one carried lifted above the rest. The drag ending draws the page again straight after
// the drop, which would replace the lamps mid-slide, so every draw until the page is next
// idle plays the slide from the same starting places

var sliding = null;

function moveLamp(move) {
  slideFrom(lampKey(move.from));
  moveLampInScenes(move);
}

// Where a lamp is within the outputs' panel. The page may scroll straight after a draw to
// hold a section still, and a place measured within the panel moves with it
function placeInPanel(node) {
  var box = node.getBoundingClientRect();
  var panel = document.getElementById("outPanel").getBoundingClientRect();
  return {left: box.left - panel.left, top: box.top - panel.top};
}

// Every lamp's place now, for the next draw to slide each from, the one carried lifted
function slideFrom(carried) {
  var was = {};
  lampsShown().forEach(function (node) { was[node.dataset.key] = placeInPanel(node); });
  sliding = {was: was, carried: carried};
  window.setTimeout(function () { sliding = null; }, 0);
}

function playSlide() {
  if (!sliding) return;
  var was = sliding.was;
  var carried = sliding.carried;
  lampsShown().forEach(function (node) {
    var from = was[node.dataset.key];
    if (!from) return;
    var to = placeInPanel(node);
    var dx = from.left - to.left;
    var dy = from.top - to.top;
    if (!dx && !dy) return;
    if (node.dataset.key === carried) node.classList.add("moving");
    node.style.transition = "none";
    node.style.transform = "translate(" + dx + "px," + dy + "px)";
    node.getBoundingClientRect();
    node.style.transition = "transform " + SLIDE_MS + "ms cubic-bezier(.2,.7,.2,1)";
    node.style.transform = "";
    window.setTimeout(function () {
      node.classList.remove("moving");
      node.style.transition = "";
    }, SLIDE_MS + 40);
  });
}

// Breaking an output out, its three lamps open out of where its one stood, each sliding
// from there to its own place; putting one back, the lamp it becomes closes in from the
// middle of the three. The other lamps make way as they do for a move
function breakOut(out) {
  slideFrom(null);
  var whole = sliding.was[lampKey({out: out, channel: null})];
  if (whole) {
    [0, 1, 2].forEach(function (channel) {
      sliding.was[lampKey({out: out, channel: channel})] = whole;
    });
  }
  breakOutInScenes(out);
}

function rejoin(out) {
  slideFrom(null);
  var three = [0, 1, 2].map(function (channel) {
    return sliding.was[lampKey({out: out, channel: channel})];
  }).filter(Boolean);
  if (three.length) {
    sliding.was[lampKey({out: out, channel: null})] = {
      left: three.reduce(function (sum, one) { return sum + one.left; }, 0) / three.length,
      top: three.reduce(function (sum, one) { return sum + one.top; }, 0) / three.length
    };
  }
  rejoinInScenes(out);
}

drawSteps.after.push(function () {
  renderConnectors();
  playSlide();
});

// The lines run between things the page has laid out, so they follow the layout
window.addEventListener("resize", function () { if (setupOn) draw(); });

// ---- the LED sections, for a page that shows one at a time ----------------------------------
// The outputs and each strip, which the gallery can give a look to, as against the screens,
// which it cannot. A page showing one at a time makes the one shown the one worked on, so
// the gallery is for it, and says of the others in a small swatch what they play.

var LED_PANELS = ["outPanel"].concat(STRIPS.map(function (strip) { return strip.id + "Panel"; }));

function runsOfPanel(panel) {
  if (panel === "outPanel") return MONO_FIRST ? [mono, outs] : [outs, mono];
  return runs.filter(function (run) { return run.strip && run.id + "Panel" === panel; });
}

// The section shown becomes the run worked on, keeping its own picked stretch
function workOn(panel) {
  var mine = runsOfPanel(panel);
  if (mine.indexOf(active) >= 0) return;
  var run = mine[0];
  if (run) pick(run, run.picked);
}

// ---- the LED sections as tabs -----------------------------------------------------------
// Outputs, the left strip and the right strip as tabs just under the gallery, one section
// shown at a time, so the one being worked on is never a scroll away. Choosing a tab makes
// it the one worked on, so the gallery is for it, and each tab says in a small swatch what
// its section plays. Screens stay below as sections, the gallery meaning nothing for them.
//
// The tabs sit under the gallery and not with the scene tabs, and are drawn as a row of
// names with a line under the chosen one, so they read as parts of one board and not as
// another row of scenes. Setting up the board is one button at the end of the tabs, and
// keeps to them: the whole board is being set up, a section at a time, and the tabs stay
// live to move between sections while it is.

var TAB_NAMES = {outPanel: "Outputs"};
BOARD.strips.forEach(function (strip) { TAB_NAMES[strip.name + "Panel"] = strip.tab; });

// The sections with a tab, the LED ones and any other a page adds. A board whose strips are what it
// is for has their tabs first and opens on the first one fitted
var TAB_PANELS = LED_PANELS.slice();
if (BOARD.strips_first) TAB_PANELS.push(TAB_PANELS.shift());

var chosenTab = "outPanel";
if (BOARD.strips_first) {
  var firstFitted = STRIPS.filter(function (strip) { return strip.there; })[0];
  if (firstFitted) chosenTab = firstFitted.id + "Panel";
}

// Whether the section shown is one the gallery can give a look to, which a strip not fitted is not
function chosenTakesLooks() {
  return LED_PANELS.indexOf(chosenTab) >= 0 &&
         runsOfPanel(chosenTab).every(function (run) { return run.there !== false; });
}

// Every tab's section stays laid out in one shared place, only the chosen one seen, so the
// place is as tall as the tallest and choosing a tab never moves what is below it
function showChosen() {
  TAB_PANELS.forEach(function (panel) {
    var node = document.getElementById(panel);
    node.open = true;
    node.hidden = false;

function svgTag(name, attrs, inner) {
  var out = "<" + name;
  Object.keys(attrs).forEach(function (key) { out += " " + key + "='" + attrs[key] + "'"; });
  return inner === undefined ? out + "/>" : out + ">" + inner + "</" + name + ">";
}

function tabPath(x0, x1, near, far, radius) {
  var edge = far < near ? far + radius : far - radius;
  return "M" + x0 + " " + near +
         " L" + x0 + " " + edge +
         " Q" + x0 + " " + far + " " + (x0 + radius) + " " + far +
         " L" + (x1 - radius) + " " + far +
         " Q" + x1 + " " + far + " " + x1 + " " + edge +
         " L" + x1 + " " + near + " Z";

// A screen module drawn with the picture it shows as it stands. panelPreview draws the picture
// composed with its look
function panelDrawing(screen) {
  var made = MODULE[screen.size] || MODULE["2.8"];
  var turn = Number(screen.turn || 0);
  var quarter = turn % 180 === 90;

  var boardW = made.board[0];
  var boardH = made.board[1];
  var extent = Math.max(boardW, boardH);
  var left = (extent - boardW) / 2;
  var bottom = (extent - boardH) / 2;
  function up(y) { return extent - bottom - y; }

  var parts = [];

  parts.push(svgTag("rect", {x: left, y: up(made.body[1]), width: boardW,
                             height: made.body[1] - made.body[0], fill: BOARD_INK}));
  parts.push(svgTag("path", {d: tabPath(left + made.tab[0], left + made.tab[1],
                                        up(made.body[1]), up(made.tab[2]), made.tabRadius),
                             fill: BOARD_INK}));
  parts.push(svgTag("path", {d: tabPath(left + made.tab[0], left + made.tab[1],
                                        up(made.body[0]), up(boardH - made.tab[2]),
                                        made.tabRadius), fill: BOARD_INK}));

  [[8, 5], [16, 3.2], [24, 5], [32, 3.2], [40, 5]].forEach(function (hole) {
    if (hole[0] > boardW - 4) return;      // the small panel has three, not five
    [4, boardH - 4].forEach(function (y) {
      parts.push(svgTag("circle", {cx: left + hole[0], cy: up(y), r: hole[1] / 2,
                                   fill: HOLE_INK, stroke: HOLE_EDGE,
                                   "stroke-width": 0.3}));
    });
  });

  parts.push(svgTag("rect", {x: left + made.panel[0], y: up(made.panel[3]),
                             width: made.panel[2] - made.panel[0],
                             height: made.panel[3] - made.panel[1], fill: PANEL_INK,
                             stroke: FRAME_INK, "stroke-width": FRAME_WIDE}));

  var litW = made.lit[0];
  var litH = made.lit[1];
  var litX = left + boardW / 2 - litW / 2;
  var litY = up(boardH / 2) - litH / 2;
  // A screen may be handed its picture outright, as the program page's preview is
  var art = screen.art || (screen.shows && screen.shows !== "keep" ? mediaArt(screen.shows) : null);

  parts.push(svgTag("rect", {x: litX, y: litY, width: litW, height: litH,
                             fill: art ? GROUND_INK : EMPTY_INK}));
  parts.push(svgTag("rect", {x: litX - 0.4, y: litY + litH, width: litW + 0.8,
                             height: Math.max(0, up(made.panel[1]) - (litY + litH) - 0.4),
                             fill: CHIN_INK}));

  if (screen.shows === "keep") {
    parts.push(svgTag("text", {x: litX + litW / 2, y: litY + litH / 2 + 1.4,
                               "text-anchor": "middle", fill: "#8b959b",
                               "font-size": 4, "font-family": "system-ui"}, "as it is"));
  } else if (art) {
    // Drawn over the module as a plain img, since the browser plays every kind of
    // gif properly there where an image inside svg drops delta frames
  } else if (screen.shows) {
    parts.push(svgTag("text", {x: litX + litW / 2, y: litY + litH / 2 + 1.4,
                               "text-anchor": "middle", fill: "#8b959b",
                               "font-size": 4, "font-family": "system-ui"},
                      "on the board"));
  } else {
    parts.push(svgTag("text", {x: litX + litW / 2, y: litY + litH / 2 + 1.4,
                               "text-anchor": "middle", fill: "#8b959b",
                               "font-size": 4, "font-family": "system-ui"}, "no picture"));
  }

  var name = PRINTED[screen.size] || PRINTED["2.8"];
  parts.push("<g transform='translate(" + (left - name.x / PER_MM) + " " +
             (extent - bottom - name.y / PER_MM) + ") scale(" + (1 / PER_MM) + ")' " +
             "fill='" + NAME_INK + "'>" + svgTag("path", {d: name.d}) + "</g>");

  var holder = document.createElement("div");
  holder.className = "holder";
  holder.innerHTML =
    "<svg width='" + DRAWN + "' height='" + DRAWN + "' viewBox='0 0 " + extent + " " + extent +
    "'><g transform='rotate(" + turn + " " + (extent / 2) + " " + (extent / 2) + ")'>" +
    parts.join("") + "</g></svg>";

  // The picture as the board will draw it: its own pixels, centred, cropped by the
  // lit window, black around it. The window sits on the drawing's exact centre, so
  // a turned module swaps its width and height and nothing else moves; the picture
  // itself stays upright, which is what a viewer of a mounted screen sees
  if (art) {
    var px = PANEL_PX[screen.size] || PANEL_PX["2.8"];
    var scale = (DRAWN / extent) * (litW / px[0]);
    var windowW = (quarter ? litH : litW) * (DRAWN / extent);
    var windowH = (quarter ? litW : litH) * (DRAWN / extent);
    var pane = document.createElement("div");
    pane.style.cssText = "position:absolute;overflow:hidden;" +
      "left:" + ((DRAWN - windowW) / 2) + "px;top:" + ((DRAWN - windowH) / 2) + "px;" +
      "width:" + windowW + "px;height:" + windowH + "px;" +
      "display:flex;align-items:center;justify-content:center";
    var img = document.createElement("img");
    img.src = art.url;
    img.style.cssText = "flex:none;width:" + (art.w * scale) + "px;height:" +
                        (art.h * scale) + "px" + (art.pixelated ? ";image-rendering:pixelated" : "");
    pane.appendChild(img);
    holder.style.position = "relative";
    holder.appendChild(pane);
  }
  return holder;
}

// A box for each screen port. A screen's box has the backlight across its top, what it shows
// straight under the module, and its look's sections under that
function renderScreenBoxes() {
  var box = document.getElementById("screensHead");
  box.textContent = "";
  SCREENS.forEach(function (letter) {
    var screen = state.screens[letter];
    var side = document.createElement("div");
    side.className = "screen-box " + letter.toLowerCase();
    var head = document.createElement("h3");
    head.appendChild(document.createTextNode(screenShown(letter)));
    side.appendChild(head);

    var body = document.createElement("div");
    body.className = "body";
    side.appendChild(body);

    if (!screen.there) {
      body.className = "body adding";
      var add = document.createElement("button");
      add.textContent = "add this screen";
      add.onclick = function () {
        screen.there = true;
        screen.shows = null;
        screen.kept = null;
        draw();
      };
      body.appendChild(add);
      box.appendChild(side);
      return;
    }

    // Taking the screen out is the only way to have none: a screen showing
    // nothing says the same thing twice
    var drop = document.createElement("button");
    drop.className = "drop";
    drop.textContent = "\u00d7";
    drop.title = "Take this screen out of every scene";
    drop.onclick = function () {
      screen.there = false;
      // Every scene's choice for it goes too, since nothing is left to show them
      store();
      allBodies().forEach(function (held) {
        held.screens[letter].shows = null;
        held.screens[letter].kept = null;
      });
      apply(slotAt(state.at).body);
      draw();
    };
    head.appendChild(drop);

    var size = document.createElement("select");
    // The sizes a panel can be, the catalogue's hub being no panel size
    var offered = (CATALOGUE.board_settings[SCREEN_NAMES[letter].toLowerCase()] || ["2.8", "1.54"])
      .filter(function (inches) { return inches !== "hub"; });
    if (!screen.size) {
      var quiet = document.createElement("option");
      quiet.value = "";
      quiet.textContent = "size as fitted";
      quiet.selected = true;
      size.appendChild(quiet);
    }
    offered.forEach(function (inches) {
      var option = document.createElement("option");
      option.value = inches;
      option.textContent = inches + " inch";
      if (screen.size === inches) option.selected = true;
      size.appendChild(option);
    });
    size.onchange = function () {
      if (size.value) screen.size = size.value;
      draw();
    };
    size.className = "inband";
    size.title = "Which panel is plugged in, which is the same for every scene";
    head.insertBefore(size, drop);

    body.appendChild(panelPreview(screen));

    // The look's sections, what it shows above them, and its backlight across the top
    body.appendChild(lookSections("screen" + letter, screen, screen.size));
    body.insertBefore(showingLine(screen, letter), body.querySelector(".looksettings"));
    body.insertBefore(lightRow(screen.look.backlight, function (value) {
      screen.look.backlight = value;
    }, "backlight", "How brightly " + screenShown(letter).replace("Screen", "screen") + " is lit, in this scene"), body.firstChild);

    // What the file already says for this screen, where the picker did not write it
    // and no picture can stand for it. It is a line of its own under the settings
    if (screen.kept) {
      var keep = document.createElement("button");
      keep.className = "keep" + (screen.shows === "keep" ? " picked" : "");
      keep.title = screen.kept;
      keep.innerHTML = "<b>Leave it as it is</b><code>" + screen.kept + "</code>";
      keep.onclick = function () { screen.shows = "keep"; draw(); };
      side.appendChild(keep);
    }
    box.appendChild(side);
  });
}

      kind.className = "kind";
      kind.textContent = media.kind === "folder" ? "slideshow"
                       : media.kind === "drawing" ? "drawing" : "gif";
      face.appendChild(kind);
    }
    cell.appendChild(face);
    cell.title = name;
    var label = document.createElement("div");
    label.className = "label";
    label.textContent = name;
    face.appendChild(label);
    var pick = document.createElement("div");
    pick.className = "pick";
    SCREENS.forEach(function (letter) {
      var button = document.createElement("button");
      button.textContent = screenButton(letter);
      var lit = on[letter];
      button.className = lit ? "lit" + (letter === "B" ? " b" : "") : "";
      button.disabled = !state.screens[letter].there;
      if (button.disabled) button.style.opacity = ".3";
      button.onclick = function () {
        // Tapping the lit one again takes the picture off this scene's screen,
        // falling back to what the file said where there is something to go back
        // to. A scene showing nothing on a screen leaves it as the scene before
        // left it, which the cross in the header cannot say for one scene alone
        var screen = state.screens[letter];
        screen.shows = screen.shows !== name ? name
                     : screen.kept ? "keep" : null;
        draw();
      };
      pick.appendChild(button);
    });
    cell.appendChild(pick);
    cell.appendChild(binButton(name, media.kind));
    box.appendChild(cell);
  });
  if (state.fileHandle)
    box.appendChild(adderTile("add pictures or drawings",
      {description: "Pictures and drawings the board plays",
       accept: {"image/png": [".gif", ".png", ".jpg", ".jpeg"], "text/x-python": [".py"]}},
      "pictures", /\.(gif|png|jpe?g|py)$/i));
  assetSteps.forEach(function (step) { step(); });
}

function mediaNamed(name) {
  return state.media.filter(function (m) { return m.name === name; })[0] || null;
}

// A picture's kind, from the drive or its name
function kindOf(shows) {
  var media = mediaNamed(shows);
  return media ? media.kind
       : /\.gif$/i.test(shows) ? "gif"
       : /\.(png|jpe?g)$/i.test(shows) ? "image" : "folder";
}

// What a screen's entry says in a scene: its look, or the line kept as the file had it. A hub
// writes its positions' entries in place of the screens'
function screenEntry(letter, body) {
  if (state.hub.on) return null;
  var screen = state.screens[letter];
  var playing = body.screens[letter];
  if (!screen.there || !playing.shows) return null;
  if (playing.shows === "keep") return playing.kept;
  var look = playing.look || freshLook();
  return lookEntry(SCREEN_NAMES[letter], playing, look, look.backlight, screen.size);
}

// ---- each scene keeps what its screens show ---------------------------------------------------

bodyParts.push({
  capture: function (body) {
    body.screens = {};
    SCREENS.forEach(function (letter) {
      var screen = state.screens[letter];
      body.screens[letter] = {shows: screen.shows, kept: screen.kept, pingpong: screen.pingpong,
                              hold: screen.hold, fps: screen.fps, turn: screen.turn};
    });
  },
  apply: function (body) {
    if (!body.screens) return;
    SCREENS.forEach(function (letter) {
      var screen = state.screens[letter];
      Object.assign(screen, body.screens[letter]);
      screen.turn = body.screens[letter].turn || 0;
      screen.lastShows = screen.shows;
    });
  },
  blank: function (body) {
    SCREENS.forEach(function (letter) { body.screens[letter].shows = null; });
  },
  hasContent: function (body) {
    return SCREENS.some(function (letter) { return !!(body.screens && body.screens[letter].shows); });
  },
  // A scene's screens are written after its lamps
  entries: function (body, lines) {
    SCREENS.forEach(function (letter) {
      var entry = body.screens && screenEntry(letter, body);
      if (entry) lines.push(entry);
    });
    return lines;
  },
  read: readScreens
});

// The board line gives a screen's size only where some scene shows something on it. The board
// reserves for a pair wherever two screens are named, which
// slows the one in use
boardLineSteps.before.push(function () {
  var bodies = [state.always.body].concat(state.scenes.map(function (scene) {
    return scene.body;
  }));
  SCREENS.forEach(function (letter) {
    var screen = state.screens[letter];
    var used = screen.there && bodies.some(function (body) {
      return body && body.screens && body.screens[letter].shows;
    });
    screensFitted[SCREEN_NAMES[letter].toLowerCase()] = used ? screen.size : "";
  });
});

// ---- reading the file back ----------------------------------------------------------------------

// A screen's line as the settings of the screen it names, or null where one is not understood
function screenPlaying(parts, body, letter) {
  var playing = Object.assign({}, body.screens[letter]);
  var look = playing.look = freshLook();
  var source = {gif: "file", image: "file", graphics: "file", sequence: "folder"}[parts.effect];
  if (!source || !parts.right[source]) return null;
  playing.shows = unquoted(parts.right[source]);

  var understood = true;
  Object.keys(parts.left).forEach(function (key) {
    var value = parts.left[key];
    if (key === "rotation") playing.turn = Number(value);
    else if (key === "backlight") look.backlight = /%$/.test(value) ? parseFloat(value) / 100 : Number(value);
    else if (key === "mirror" && value === "true") look.mirror = true;
    else if (key === "pixel_double" && value === "true") look.double = true;
    else if (key === "bg") look.bg = "#" + (WORDS[value] ? hexOf(WORDS[value]) : value);
    else if (key === "offset") {
      var sides = value.split("|");
      look.anchor = null;
      look.x = sides[0] === "*" ? "" : sides[0];
      look.y = sides[1] === "*" ? "" : sides[1];
    } else if (key === "tile") {
      var ways = value.split("|");
      look.tile = ways[0];
      look.tileDown = ways[1] || ways[0];
    } else understood = false;
  });
  Object.keys(parts.right).forEach(function (key) {
    var value = parts.right[key];
    if (key === source) return;
    if (key === "fps" || key === "interval") {
      look.pace = key;
      look.every = Number(value);
    } else if (key === "loop" && value === "false") look.loop = false;
    else if (key === "ping_pong" && value === "true") playing.pingpong = true;
    else if (key === "first_as_last" && value === "true") look.whole = true;
    else if (key === "hold") {
      var ends = value.split("|");
      playing.hold = ends[0];
      look.holdBack = ends[1] || "";
    } else if (key === "width" || key === "height") {
      look.canvas = "set";
      look[key === "width" ? "canvasW" : "canvasH"] = Number(value);
    } else understood = false;
  });
  return understood ? playing : null;
}

// Try each kept line of each body as a screen, moving those that write back exactly
function readScreens(bodies) {
  var sizes = {};
  boardResidue.forEach(function (token) {
    var named = token.match(/^(screen[ab]?)=(2\.8|1\.54)$/i);
    var letter = named && screenLetter(named[1]);
    if (letter) sizes[letter] = {token: token, size: named[2]};
  });
  var readOn = {};

  bodies.forEach(function (body) {
    body.kept = body.kept.filter(function (one) {
      var parts = entryParts(one.text);
      var letter = parts && screenLetter(parts.selector);
      if (!letter || !sizes[letter] || body.screens[letter].shows) return true;
      var playing = screenPlaying(parts, body, letter);
      if (!playing) return true;

      var fitted = state.screens[letter];
      var was = {there: fitted.there, size: fitted.size};
      fitted.there = true;
      fitted.size = sizes[letter].size;
      var trial = {screens: Object.assign({}, body.screens)};
      trial.screens[letter] = playing;
      if (screenEntry(letter, trial) !== one.text) {
        fitted.there = was.there;
        fitted.size = was.size;
        return true;
      }
      body.screens[letter] = playing;
      readOn[letter] = true;
      if (one.comments.length) body.notes[one.text] = one.comments;
      return false;
    });
  });

  // A screen read is fitted at its size, which the page writes itself from here
  Object.keys(readOn).forEach(function (letter) {
    boardResidue.splice(boardResidue.indexOf(sizes[letter].token), 1);
  });
}

// ---- the pictures on the drive ------------------------------------------------------------------
// What a screen can show: gifs and stills, PNG or JPEG, folders of them, which play as a
// slideshow, and drawings

var mediaFound = [];

driveParts.push({
  begin: function () { mediaFound = []; },
  file: async function (name, handle) {
    if (/\.gif$/i.test(name)) mediaFound.push({ name: name, kind: "gif", handle: handle });
    else if (/\.(png|jpe?g)$/i.test(name)) mediaFound.push({ name: name, kind: "image", handle: handle });
    else if (/\.py$/i.test(name)) {
      // A Python file is a drawing only where its opening string says so
      var drawing = null;
      try {
        drawing = drawingSaid(openingString(await (await handle.getFile()).text()));
      } catch (e) {
        drawing = null;
      }
      if (drawing) mediaFound.push({name: name, kind: "drawing", drawing: drawing});
    } else return false;
    return true;
  },
  folder: async function (name, handle) {
    for await (var inner of handle.entries()) {
      if (inner[1].kind === "file" && /\.(gif|png|jpe?g)$/i.test(inner[0])) {
        mediaFound.push({ name: name, kind: "folder", thumbHandle: inner[1] });
        return true;
      }
    }
    return false;
  },
  land: function () {
    mediaFound.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
    state.media = mediaFound;
    // A drawing cannot run in the page, so it is shown by a face made from its opening string
    mediaFound.forEach(function (one) { if (one.kind === "drawing") madeDrawing(one.name); });
  },
  said: function () {
    return JSON.stringify(state.media.map(function (m) { return m.name + m.kind; }));
  },
  forget: function (name) {
    allBodies().forEach(function (body) {
      SCREENS.forEach(function (letter) {
        if (body.screens[letter].shows === name) body.screens[letter].shows = null;
      });
    });
    delete state.art[name];
  }
});

// ---- pictures, read off the drive in turn ------------------------------------------------------
// The drive is slow to read, so pictures come off it one at a time, those a screen or hub position
// shows in any scene first and the rest of the gallery after them

var pictureQueue = [];
var pictureReading = null;

// The pictures any scene puts on a screen or a hub position, worked out once a draw
var shownThisDraw = null;

drawSteps.before.push(function () { shownThisDraw = null; });

function picturesShown() {
  if (shownThisDraw) return shownThisDraw;
  var shown = shownThisDraw = [];
  var bodies = [capture(), state.always.body].concat(state.scenes.map(function (scene) {
    return scene.body;
  }));
  bodies.forEach(function (body) {
    if (!body) return;
    Object.keys(body.screens || {}).forEach(function (letter) {
      if (body.screens[letter].shows) shown.push(body.screens[letter].shows);
    });
    Object.keys(body.places || {}).forEach(function (place) {
      if (body.places[place].shows) shown.push(body.places[place].shows);
    });
  });
  return shown;
}

function readNextPicture() {
  if (pictureReading || !pictureQueue.length) return;
  shownThisDraw = null;
  var shown = picturesShown();
  pictureQueue.sort(function (a, b) {
    return (shown.indexOf(b.name) >= 0) - (shown.indexOf(a.name) >= 0);
  });
  var next = pictureReading = pictureQueue.shift();
  next.handle.getFile().then(function (file) {
    return new Promise(function (settle) {
      var url = URL.createObjectURL(file);
      var probe = new Image();
      probe.onload = function () {
        state.art[next.name] = {url: url, w: probe.naturalWidth, h: probe.naturalHeight,
                                ratio: probe.naturalWidth / probe.naturalHeight};
        settle();
      };
      // One that will not load stays held empty, so it is not asked for again
      probe.onerror = function () { settle(); };
      probe.src = url;
    });
  }, function () {}).then(function () {
    pictureReading = null;
    draw();
    readNextPicture();
  });
}

function mediaArt(name) {
  var held = state.art[name];
  if (held) return held.ratio ? held : null;
  var media = mediaNamed(name);
  var handle = media && (media.kind === "folder" ? media.thumbHandle : media.handle);
  if (!handle) return null;
  // Held empty while it waits, so each is asked for once
  state.art[name] = {url: null, ratio: 0};
  pictureQueue.push({name: name, handle: handle});
  setTimeout(readNextPicture, 0);
  return null;
}

// ---- drawing the tab -------------------------------------------------------------------------

// The tab's head and its pictures. renderScreensTab puts the board's chips beside what is the

// Under the tab's name, where the others have their swatch, the size fitted to each screen,

// ---- the LED tabs' swatches, live ------------------------------------------------------------
// Each LED tab's swatch a small copy of its section's lamps, painted every frame from the
