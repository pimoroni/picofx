 font:inherit;line-height:1.3;padding:.3rem .55rem;cursor:pointer}
.hubswitch button.on{background:#1f6feb;color:#fff}
.hubswitch:not(.locked) button:not(.on):hover{background:rgba(31,111,235,.1)}
/* Locked, the choice made reads as a fact, a filled chip like the other tabs' boxes, and the
   other is only a grey mention with no outline of its own to press */
.hubswitch.locked{box-shadow:inset 0 0 0 1px var(--line)}
.hubswitch.locked button{cursor:default;color:var(--dim);opacity:.7}
.hubswitch.locked button.on{color:#fff;opacity:1}
.hubswitch.locked .hublead:not(.on) .boardicon{color:var(--dim);opacity:.7}
.hubbox{grid-column:1/-1;--hub:#1f6feb;--hubwash:rgba(31,111,235,.06)}
.hubbox.b{--hub:#a44ad0;--hubwash:rgba(164,74,208,.06)}
.hubbox h3 .hubcount{font-weight:400;opacity:.85;margin-left:.3rem}
.places{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem;width:100%}
.place{position:relative;display:flex;flex-direction:column;align-items:center;gap:.25rem;
 border:2px solid transparent;border-radius:9px;padding:.3rem .2rem .35rem;cursor:pointer}
.place:hover{background:var(--hubwash)}
.place.picked{border-color:var(--hub)}
.place .holder{zoom:.55}
/* The letter sits in the position's corner, as on the silk, and its panel size in the middle */
.placetop{display:flex;align-items:center;justify-content:center;min-height:1.5rem;
 width:100%}
.placename{position:absolute;top:.35rem;left:.5rem;font-size:.85rem;line-height:1.3rem;
 color:var(--hub)}
.placesize{font-size:.72rem;padding:.05rem .15rem;border-radius:5px}
.placetop .placechip{color:var(--hub);margin-right:.2rem}
.placesize:disabled{opacity:.75;color:var(--ink);background:transparent;border-color:transparent;
 appearance:none;-webkit-appearance:none;padding:.05rem 0}
.placesays{font-size:.7rem;color:var(--dim);max-width:100%;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.place.empty{cursor:default}
.place.empty:hover{background:none}
.placenone{display:flex;align-items:center;justify-content:center;width:100%;
 aspect-ratio:1;border-radius:6px;font-size:.72rem;color:var(--dim);
 background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 5px,#e0dbd2 5px,#e0dbd2 10px)}
.placedrop{position:absolute;top:.3rem;right:.2rem;width:1.3rem;height:1.3rem;padding:0;
 border:0;border-radius:5px;background:var(--hub);color:#fff;font-size:.95rem;line-height:1}
.placefit{position:absolute;bottom:2.1rem;border:1.5px solid var(--hub);border-radius:7px;
 background:var(--panel);color:var(--hub);font:600 .74rem system-ui,sans-serif;
 padding:.15rem .5rem}
.hubsettings{width:100%;display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;
 min-height:2rem}
.hubsettings .showing{margin:0}
.hubsettings .opt{display:flex;align-items:center;gap:.35rem;font-size:.85rem;color:var(--dim);
 cursor:pointer}
.hubsettings .opt input[type=number]{font:inherit;font-size:.85rem;width:4rem;
 padding:.2rem .3rem;border:1px solid var(--line);border-radius:6px}
.placeat{font-size:.85rem;color:var(--hub)}
.hubpace{margin:0;width:100%;font-size:.8rem;color:var(--dim);min-height:1.1rem}
body.setupall .hubsettings{opacity:.35;pointer-events:none}
/* Every screen setting: what is showing under the module, then sections that fold, each a row
   of named choices drawn as buttons, and toggles for anything on or off */
.screen-box .settings.looksettings,.hubsettings .looksettings{display:flex;flex-direction:column;
 align-items:stretch;width:100%}
.sshowing{width:100%;text-align:center;font-size:.85rem;color:var(--dim);margin:-.2rem 0 .1rem}
.sshowing b{color:var(--ink)}
.sshowing small{display:block;font-size:.72rem}
.hubsettings .sshowing{text-align:left;margin:0 0 .2rem}
.sfold{border-top:1px solid var(--line);padding:.5rem 0 .55rem;margin:0}
.sfold>summary{list-style:none;display:flex;align-items:baseline;gap:.45rem;cursor:pointer;
 font-size:.84rem;font-weight:600;color:var(--ink)}
.sfold>summary::-webkit-details-marker{display:none}
/* The fold's mark is a boxed plus, a minus while open */
.sfold>summary::before{content:"";width:.9rem;height:.9rem;border-radius:4px;flex:0 0 auto;
 box-sizing:border-box;border:1.5px solid var(--dim);align-self:center;background:
 linear-gradient(var(--ink),var(--ink)) center/.45rem 1.5px no-repeat,
 linear-gradient(var(--ink),var(--ink)) center/1.5px .45rem no-repeat}
.sfold[open]>summary::before{background:
 linear-gradient(var(--ink),var(--ink)) center/.45rem 1.5px no-repeat}
.sfold>summary small{font-weight:400;color:var(--dim);font-size:.78rem}
.sfold[open]>summary small.closedonly{display:none}
.sline{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .5rem;margin-top:.45rem}
.snamed{font-size:.8rem;color:var(--dim);margin-right:.1rem}
.sunit{font-size:.78rem;color:var(--dim)}
.looksettings input[type=number]{font:inherit;font-size:.82rem;width:3.6rem;padding:.2rem .3rem;
 border:1px solid var(--line);border-radius:6px}
.sseg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.sseg button{border:0;border-right:1px solid var(--line);border-radius:0;background:var(--panel);
 padding:.28rem .5rem;font:600 .76rem system-ui,sans-serif;color:var(--ink);display:flex;
 align-items:center;gap:.3rem;cursor:pointer}
.sseg button:last-child{border-right:0}
.sseg button.on{background:var(--hub,#1f6feb);color:#fff}
.sseg button:disabled{opacity:.4;cursor:default}
.sseg svg{display:block}
.stoggle{border:1.5px solid var(--line);border-radius:8px;background:var(--panel);
 padding:.28rem .55rem;font:600 .76rem system-ui,sans-serif;color:var(--ink);display:inline-flex;
 align-items:center;gap:.35rem;cursor:pointer}
.stoggle.on{border-color:var(--hub,#1f6feb);color:var(--hub,#1f6feb);
 background:color-mix(in srgb,var(--hub,#1f6feb) 8%,transparent)}
.stoggle:disabled{opacity:.4;cursor:default}
.screen-box.a{--hub:#1f6feb}
.screen-box.b{--hub:#a44ad0}
.sanchor{display:inline-grid;grid-template-columns:repeat(3,1rem);gap:2px;margin-right:.3rem}
.sanchor button{width:1rem;height:1rem;padding:0;border:0;border-radius:3px;background:var(--line);
 cursor:pointer}
.sanchor button:hover{background:#cfc8bc}
.sanchor button.on{background:var(--hub,#1f6feb)}
.shold{display:inline-flex;align-items:center;gap:.35rem}
.shold.off{opacity:.4}
.shold input{width:3.2rem}
.lightopt input[type=range]{width:6.5rem;accent-color:var(--hub,#1f6feb)}
.lightfigure{min-width:2.4rem;font-variant-numeric:tabular-nums;color:var(--ink)}
/* The colour picker's own rules are under choosing a colour, shared with a stretch's colour */
.groundbright{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--dim);
 margin-top:.5rem}
.groundbright input[type=range]{flex:1;accent-color:var(--ink)}
.groundbright input:disabled{opacity:.35}
/* In a screen's band only the size is the board's, the chip beside it. Taking a screen out is
   editing the board, so its cross shows only then, and the backlight, being the scene's, stands
   back with the rest while the board is edited */
.screen-box h3 .bandfact{display:inline-flex;align-items:center;gap:.3rem;margin-left:.4rem}
.screen-box h3 .bandfact select.inband{margin-left:0}
body:not(.setupall) .screen-box h3 .drop{visibility:hidden}
body.setupall .lightrow{opacity:.35;pointer-events:none}
.sshowing.empty{color:var(--dim)}
/* Where the sections have the room, as the hub's strip has, placement and playback are two
   equal halves with a line between */
.looksettings{container-type:inline-size}
@container (min-width:40rem){
 .ssplit{display:grid;grid-template-columns:1fr 1fr;column-gap:1rem;align-items:start}
 .ssplit>:last-child{border-left:1px solid var(--line);padding-left:1rem;align-self:stretch}
}
/* The speed stays on one line, its figure narrower and its buttons and words a little tighter */
.sline.speedline{flex-wrap:nowrap;gap:.3rem}
.speedline .sseg button{padding:.28rem .38rem}
.looksettings .speedline input[type=number]{width:2.9rem;padding:.2rem .25rem}
.speedline .sunit{font-size:.72rem;white-space:nowrap}
/* Wide enough to say "centre" beside the spinner */
.looksettings input.sxy{width:4.9rem}
/* The hub's backlight lights all six, so it is a row across the box above the positions, apart
   from the group being set below them */
.lightrow{width:100%;display:flex;align-items:center;padding:.1rem .2rem .45rem;
 border-bottom:1px solid var(--line)}
.lightrow .opt{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--dim);
 flex:1}
.lightrow .lightopt input[type=range]{flex:1;width:auto}
/* A group's members are outlined in its colour, the picked group filled with a tint of it; under
   every position are the three group numbers, the one it is in lit in its colour */
.place.grouped{border-color:var(--group)}
.place.picked{border-color:var(--group,var(--hub));
 background:color-mix(in srgb,var(--group,var(--hub)) 13%,transparent)}
.place.picked:hover{background:color-mix(in srgb,var(--group,var(--hub)) 18%,transparent)}
.groupseg{display:inline-flex;border:1.5px solid var(--line);border-radius:7px;overflow:hidden;
 margin-top:.1rem}
.groupseg button{border:0;border-right:1px solid var(--line);border-radius:0;background:var(--panel);
 padding:.16rem .5rem;font:700 .74rem system-ui,sans-serif;color:var(--ink);cursor:pointer}
.groupseg button:last-child{border-right:0}
.groupseg button.on{color:#fff}
.groupseg button:disabled{opacity:.35;cursor:default}
/* One line under the numbers, cut short where a tile is too narrow, its whole in the tooltip */
.groupsaid{font-size:.7rem;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;max-width:100%}
/* How fast the hub plays, in a box of its own under the positions */
.hubbox .hubpace:not(.quiet){margin:.1rem 0 .2rem;padding:.45rem .7rem;border-radius:8px;
 border-left:3px solid var(--hub);background:color-mix(in srgb,var(--hub) 7%,transparent);
 color:var(--ink);font-size:.82rem}
/* Each picture whole in its tile, the tile as tall as the picture needs, the rows lined up at
   the bottom; small pictures at their true size, their pixels kept square */
.assets{align-items:end}
/* The tile adding pictures is as tall as the row it ends */
.assets .adder{align-self:stretch}
.asset .face.wholeface{height:auto}
.asset .face.wholeface img{position:relative;inset:auto;object-fit:fill;flex:none;
 image-rendering:pixelated}
.asset .face.wholeface .label{white-space:normal;line-height:1.3}
.asset .face.wholeface .label b{font-weight:600}
/* A drawing's tile: its icon, asked for in its flat text form so it is white as the initial
   is, or its initial, on its colour, its name along the foot */
.asset .face.drawingface{flex-direction:column;justify-content:center}
.drawingicon{font-size:2.9rem;line-height:1;color:#fff;font-variant-emoji:text;margin-bottom:.9rem}
.drawingletter{font:800 3rem/1 system-ui;color:#fff;margin-bottom:.9rem}
.drawingtitle{position:absolute;left:0;right:0;bottom:0;color:#fff;font:700 .8rem system-ui;
 padding:.3rem .45rem;text-shadow:0 1px 3px rgba(0,0,0,.6);
 background:linear-gradient(to top,rgba(0,0,0,.5),transparent)}
.asset .face.drawingface .label{white-space:normal;line-height:1.3;z-index:3}
/* One tile size for two screens and the hub alike, wide enough for a hub's pick row at its
   longest, six positions on their own and all */
.assets.wholeassets,.assets.wholeassets.hubbed{
 grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr))}
/* Six positions and "all" under every picture, so the pictures are wider for them */
.assets.hubbed{grid-template-columns:repeat(auto-fill,minmax(9rem,1fr))}
.assets.hubbed .asset .pick button{padding:.2rem 0;border-right:1px solid var(--line)}
.assets.hubbed .asset .pick button:last-child{border-right:0;flex:1.6}
.assets.hubbed .asset .pick button.lit{background:#1f6feb;color:#fff}
.assets.hubbed .asset.hubb .pick button.lit{background:#a44ad0}
.ledtab[data-panel=screensPanel] .accswatch.hubswatch{display:grid;
 grid-template-columns:repeat(3,1rem);grid-auto-rows:1rem;gap:.15rem;height:2.15rem}
.ledtab[data-panel=screensPanel] .hubswatch .screencell{width:1rem;height:1rem;
 border-radius:2px}
/* The looks stand back where the tab shown is one they mean nothing for, staying where
   they are so the tabs do not move */
body.nolooks #looks{opacity:.3;pointer-events:none}
/* The gallery inside the tabs: the looks, the pictures and the sounds in one place, only
   the chosen tab's seen, the place as tall as the tallest */
.galleryslot{display:grid;margin-bottom:1.2rem}
.galleryslot>*{grid-area:1/1;align-self:start;margin:0}
.galleryslot .gallery,.galleryslot .assets,.galleryslot .shelf{margin-top:0}
.galleryslot #looks>.tabs:empty{display:none}
.galleryslot>.slothidden{visibility:hidden;pointer-events:none}
body.setupall .galleryslot{opacity:.35;pointer-events:none}
/* The tabs as the top edge of one box, the chosen tab's cards and its section
   inside it, the sections losing boxes of their own */
.tabbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
 padding:0 1.4rem 1.1rem;margin:1.2rem 0}
.tabbox .ledtabs{margin:0 -1.4rem 1rem;padding:0 1.4rem;gap:1.1rem}
.tabbox .tabstack>.panel{border:0;border-radius:0;background:none;padding:0}
/* Pictures and sounds on the looks' grid, each a card of a face over a name */
body.boxedgallery #assets,body.boxedgallery .sounds{display:grid;
 grid-template-columns:repeat(auto-fill,minmax(9.4rem,1fr));gap:.7rem}
body.boxedgallery .asset,body.boxedgallery .sound{border-radius:11px}
body.boxedgallery .asset .face{height:2.9rem}
body.boxedgallery .asset .label{display:none}
body.boxedgallery .asset .name,body.boxedgallery .sound b{display:block;
 padding:.42rem .65rem .52rem;font:600 .85rem system-ui,sans-serif;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;text-align:left}
body.boxedgallery .asset{padding-right:0}
/* A picture's A and B sit at the end of its name's row, where a look's mark does */
body.boxedgallery .asset .pick{position:absolute;right:.4rem;bottom:.38rem;border:0;gap:.2rem}
body.boxedgallery .asset .pick button{flex:0 0 auto;border:1px solid var(--line);
 border-radius:6px;padding:.05rem .4rem;font-size:.72rem}
body.boxedgallery .asset .pick button:first-child{border-right:1px solid var(--line)}
body.boxedgallery .asset .name{padding-right:4.2rem}
body.boxedgallery .sound{width:auto;padding:0;display:grid;grid-template-columns:1fr auto;
 align-items:center;overflow:hidden;background:var(--panel)}
body.boxedgallery .sound svg{grid-column:1/-1;display:block;width:100%;height:2.9rem;
 background:var(--dark);padding:.5rem .6rem;box-sizing:border-box}
body.boxedgallery .sound small{padding:0 .65rem .1rem 0;color:var(--dim);font-size:.72rem}
/* Setting up is the last thing on the tabs' row, at its far end */
.ledtabs .gap{flex:1}
.ledtabs .setupbutton{align-self:center}
</style>

<body>
<header>
 <h1>Plasma 2350 Picker</h1>
 <span class="setuphead" id="setupHead"></span>
 <span id="status"></span>
 <button id="open" class="primary">Open FX drive</button>
 <button id="save" disabled>Save to board</button>
 <button id="check" disabled>Check board</button>
</header>
<main>

<div id="banner"></div>
<div class="tabbar" id="tabs"></div>
<div class="scenebody" id="sceneBody">
 <div id="sceneSettings"></div>


 <div id="looks"></div>

 <details class="panel" id="outPanel" open>
  <summary>The outputs<span class="says">seven of them, each one light or three</span></summary>
  <div class="facts" id="outFacts"></div>
  <div class="sides" id="sides">
   <div class="side" id="sideA">
    <div class="sidehead" id="headA"></div>
    <div class="run" id="outRun"></div>
    <div class="head" id="outCut"></div>
    <div id="outBar"></div>
   </div>
   <div class="side" id="sideB">
    <div class="sidehead" id="headB"></div>
    <div class="run" id="monoRun"></div>
    <div class="head" id="monoCut"></div>
    <div id="monoBar"></div>
   </div>
  </div>
  <div id="outTools"></div>
  <div id="outChosen"></div>
 </details>

</div>

<details open>
 <summary>The file this writes</summary>
 <p class="previewnote" id="previewNote" hidden></p>
 <pre class="file" id="preview"></pre>
</details>

</main>
<script>
// The FX picker, a page for choosing what the board plays and saving it as effects.txt. It is
// the numbered parts in this folder and any of the board's own, joined in number order, those in
// the screens, hub and sound folders only for a board that has them. This first part holds the
// looks.

// The board the page is for, from its editor/fx_board.json: its outputs, strips, screen ports,
// whether it has a hub, sound and the network looks, and the examples it offers
var BOARD = {
 "name": "Plasma 2350",
 "examples": null,
 "example_variable": "plasma",
 "outputs": [
  {
   "name": "rgb",
   "kind": "colour",
   "breaks_out": false
  }
 ],
 "output_words": {
  "panel": "the board's own RGB LED",
  "colour": "RGB LED",
  "colour_says": "any colour",
  "mono": "Mono lights",
  "mono_says": ""
 },
 "opening": {
  "colour": "Rainbow"
 },
 "wiring_order": false,
 "strips_first": true,
 "strips": [
  {
   "name": "stripdat",
   "label": "the strip on DAT",
   "tab": "DAT strip",
   "connector": "DAT",
   "says": "the strip on the data terminal",
   "colour": "#c2570f",
   "leds": 66,
   "fitted": true
  },
  {
   "name": "stripclk",
   "label": "the strip on CLK",
   "tab": "CLK strip",
   "connector": "CLK",
   "says": "a second strip, on the clock terminal",
   "colour": "#8a1f6d",
   "leds": 30,
   "fitted": false
  },
  {
   "name": "stripapa",
   "label": "the APA102 strip",
   "tab": "APA102 strip",
   "connector": "both terminals, DAT and CLK",
   "says": "one strip across both terminals, with a brightness of its own",
   "colour": "#1f6feb",
   "leds": 60,
   "fitted": false,
   "brightness": 0.5,
   "takes": [
    "stripdat",
    "stripclk"
   ]
  }
 ],
 "screens": {
  "ports": [
   {
    "id": "screen",
    "label": "Screen",
    "connector": "SP/CE"
   }
  ],
  "hub": false
 },
 "sound": false,
 "wireless": false
};

// The catalogue is generated beside this page; without it the screen sizes and ports
// cannot be known, so say so instead of failing silently
if (typeof CATALOGUE === "undefined") {
  var assumedPorts = BOARD.screens ? BOARD.screens.ports.map(function (port) { return port.id; }) : [];
  window.CATALOGUE = {board_settings: {}, screen_ports: assumedPorts,
                      strips: BOARD.strips.map(function (strip) { return strip.name; })};
  assumedPorts.forEach(function (id) { CATALOGUE.board_settings[id] = ["2.8", "1.54"]; });
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("banner").innerHTML =
      "<div class='banner warn'>catalogue.js is missing from this folder, so the " +
      "board's ports are assumed. Run tools/build_editor.py to write it.</div>";
  });
}

var HEADER = "# Written by the FX picker. Everything here can be edited by hand;\n" +
             "# MANUAL.html on this drive explains every line.\n";

// ---- helpers -------------------------------------------------------------------

function r2(n) { return Math.round(n * 100) / 100; }
function lerp(a, b, t) { return r2(a + (b - a) * t); }

// Each look picks from a palette of its own, so the middle of the slider is the
// colour its card shows and moving it stays within what suits that look
function tone(palette, t) {
  return palette[Math.min(palette.length - 1, Math.floor(t * palette.length))];
}

// A travelling effect's length scales with the run so the wave keeps its
// proportion whatever the light count
function span(count, mood) {
  return Math.max(2, Math.round(count * lerp(2, 0.6, mood)));
}

function quoted(name) {
  return name.indexOf(" ") >= 0 ? '"' + name + '"' : name;
}

// A run of numbers as the file writes them: climbing or falling by one closes up
// into a range, a pair stays a pair, and anything else is listed
function rangify(list) {
  var parts = [];
  var i = 0;
  while (i < list.length) {
    var j = i;
    if (j + 1 < list.length && list[j + 1] === list[j] + 1) {
      while (j + 1 < list.length && list[j + 1] === list[j] + 1) j++;
    } else if (j + 1 < list.length && list[j + 1] === list[j] - 1) {
      while (j + 1 < list.length && list[j + 1] === list[j] - 1) j++;
    }
    var count = j - i + 1;
    if (count === 1) parts.push(String(list[i]));
    else if (count === 2) parts.push(list[i] + "," + list[j]);
    else parts.push(list[i] + "-" + list[j]);
    i = j + 1;
  }
  return parts.join(",");
}

// Some of a target's playing lamps as the file names them. A target whose lamps are not
// numbered outputs, such as mono channels, names its own sets
function nameSet(target, set) {
  return target.nameSet ? target.nameSet(set) : target.name + rangify(set);
}

// The playing outputs split round-robin into up to three groups, which is how a
// three-colour look lands one colour per light in turn
function roundRobin(playing, ways) {
  var groups = [];
  playing.forEach(function (which, i) {
    var at = i % ways;
    (groups[at] = groups[at] || []).push(which);
  });
  return groups;
}

// A run cut into up to three contiguous parts, as selectors, low end first or high
// end first to match how it is wired
function runThirds(name, count, reversed, ways, lights) {
  // Places along the stretch, numbered by the run's own lights where the stretch has them, so
  // a stretch partway along a strip names its own lights
  function light(place) { return lights ? lights[place - 1] : place; }
  var edges = [];
  for (var i = 0; i <= ways; i++) edges.push(Math.round(count * i / ways));
  var parts = [];
  for (var g = 0; g < ways; g++) {
    var from = edges[g] + 1;
    var to = edges[g + 1];
    if (to < from) continue;
    parts.push(reversed ? name + light(count - from + 1) + "-" + light(count - to + 1)
                        : name + light(from) + "-" + light(to));
  }
  return parts;
}

// A mono output has no colour to be given, so the setting comes back off the line
// before it is written. What is left is the same effect, in whatever the lamp is
function withoutColour(line) {
  return line.replace(/\s+colour=[^\s:]+/g, "");
}

// Anything on or off, as a toggle with its icon, greyed where playback would refuse it
function toggle(icon, words, on, flip, title, refused) {
  var button = document.createElement("button");
  button.type = "button";
  button.className = "stoggle" + (on && !refused ? " on" : "");
  button.dataset.words = words;
  button.innerHTML = "<span aria-hidden='true'>" + icon + "</span> " + words;
  button.title = title;
  button.disabled = !!refused;
  button.onclick = function () { flip(!on); draw(); };
  return button;
}

// ---- the looks -----------------------------------------------------------------
// Each look writes real entries for whatever target it is handed: a bank of outputs
// in the order they are to play, or a run of any length. alone() is the form it
// takes on a target of one light, and false where it has no such form.

var BREATHE_TONES = ["blue", "cool", "cyan", "green", "warm"];
var SPARKLE_TONES = ["cyan", "cool", "white", "warm", "yellow"];
var SCANNER_TONES = ["magenta", "blue", "red", "yellow", "white"];
var CHASE_TONES = ["magenta", "white", "yellow", "cyan", "green"];
var COUNTER_TONES = ["white", "cyan", "green", "yellow", "red"];
var PARTY_FIRST = ["red", "blue", "magenta", "cyan", "white"];
var PARTY_SECOND = ["green", "white", "yellow", "warm", "red"];
var PARTY_THIRD = ["blue", "green", "cyan", "white", "magenta"];

var LOOKS = [
  {
    // The one look with nothing moving in it. A scene that wants a lamp to sit at one
    // colour has no effect to reach for otherwise, and on a board whose only light of
    // its own is a single LED that is most of what it is for. The colour is chosen
    // rather than slid to, so this is the one look whose settings are not two sliders
    name: "Solid", mood: "Brightness", spans: true, onMono: true, solid: true,
    strip: ["#d94a3d", "#e0a03a", "#3fa672", "#3a7fd9", "#8a4ad0", "#d94a9e", "#e8e2d6"],
    entries: function (target, pace, mood, colour) {
      return [target.selector + " colour=" + (colour || "ffffff").replace("#", "") +
              ": static brightness=" + lerp(0.05, 1, mood)];
    },
    alone: function (target, pace, mood, colour) {
      return this.entries(target, pace, mood, colour);
    }
  },
  {
    name: "Rainbow", mood: "Colour spread", spans: true, onMono: false,
    strip: ["#e33", "#e73", "#ea3", "#3a5", "#36c", "#63c", "#a3c"],
    entries: function (target, pace, mood) {
      return [target.selector + ": rainbow_wave speed=" + lerp(0.05, 0.8, pace) +
              " length=" + span(target.count, mood)];
    },
    alone: function (target, pace) {
      return [target.selector + ": rainbow speed=" + lerp(0.05, 0.8, pace)];
    }
  },
  {
    name: "Campfire", mood: "Embers to blaze", spans: true, onMono: true,
    strip: ["#812200", "#c43a00", "#ff5a00", "#ff8c1a", "#ff5a00", "#c43a00", "#812200"],
    entries: function (target, pace, mood) {
      return [target.selector + " colour=ff5a00: flicker_each brightness=" + lerp(0.5, 1, mood) +
              " dimness=" + lerp(0.7, 0.35, mood) +
              " bright_min=" + lerp(0.1, 0.02, pace) + " bright_max=" + lerp(0.4, 0.1, pace) +
              " dim_min=" + lerp(0.08, 0.02, pace) + " dim_max=" + lerp(0.3, 0.08, pace)];
    }
  },
  {
    name: "Breathe", mood: "Colour", spans: true, onMono: true,
    strip: ["#2b7f8f", "#37a0b4", "#43c1d9", "#56d8f0", "#43c1d9", "#37a0b4", "#2b7f8f"],
    entries: function (target, pace, mood) {
      return [target.selector + " colour=" + tone(BREATHE_TONES, mood) +
              " ease=" + lerp(0.8, 0.2, pace) + ": pulse speed=" + lerp(0.08, 0.5, pace)];
    }
  },
  {
    name: "Wave", mood: "Wave length", spans: true, onMono: true,
    strip: ["#122438", "#2a4a6a", "#4a7fb5", "#7fb5e6", "#4a7fb5", "#2a4a6a", "#122438"],
    entries: function (target, pace, mood) {
      return [target.selector + " colour=cool: pulse_wave speed=" + lerp(0.1, 1, pace) +
              " length=" + span(target.count, mood)];
    },
    alone: function (target, pace) {
      return [target.selector + " colour=cool: pulse speed=" + lerp(0.1, 1, pace)];
    }
  },
  {
    name: "Sparkle", mood: "Colour", spans: true, onMono: true,
    strip: ["#ffffff", "#999999", "#ffffff", "#cccccc", "#eeeeee", "#888888", "#ffffff"],
    entries: function (target, pace, mood) {
      return [target.selector + " colour=" + tone(SPARKLE_TONES, mood) +
              ": random_each interval=" + lerp(0.25, 0.03, pace) +
              " brightness_min=0 brightness_max=1"];
    }
  },
  {
    name: "Scanner", mood: "Colour", spans: true, onMono: true,
    strip: ["#330000", "#660000", "#cc0000", "#ff3333", "#cc0000", "#660000", "#330000"],
    entries: function (target, pace, mood) {
      return [target.selector + " colour=" + tone(SCANNER_TONES, mood) +
              " fade=" + lerp(0.5, 0.15, pace) + ": sweep speed=" + lerp(0.3, 2, pace) +
              " length=" + target.count +
              " extent=" + Math.max(1, Math.round(target.count / 8))];
    },
    alone: function (target, pace, mood) {
      return [target.selector + " colour=" + tone(SCANNER_TONES, mood) +
              " ease=" + lerp(0.5, 0.15, pace) + ": pulse speed=" + lerp(0.3, 2, pace)];
    }
  },
  {
    name: "Chase", mood: "Colour", spans: true, onMono: true,
    strip: ["#111111", "#111111", "#ffff00", "#ffd24a", "#111111", "#111111", "#111111"],
    entries: function (target, pace, mood) {
      return [target.selector + " colour=" + tone(CHASE_TONES, mood) +
              " fade=" + lerp(0.4, 0.1, pace) + ": flash_sequence speed=" + lerp(0.3, 2, pace) +
              " length=" + target.count + " flashes=1 window=0.4"];
    },
    alone: function (target, pace, mood) {
      return [target.selector + " colour=" + tone(CHASE_TONES, mood) +
              " fade=" + lerp(0.4, 0.1, pace) + ": flash speed=" + lerp(0.3, 2, pace) +
              " flashes=1 window=0.4"];
    }
  },
  {
    name: "Counter", mood: "Colour", spans: true, onMono: true,
    strip: ["#00ff00", "#111111", "#00ff00", "#00ff00", "#111111", "#00ff00", "#111111"],
    entries: function (target, pace, mood) {
      return [target.selector + " colour=" + tone(COUNTER_TONES, mood) +
              ": binary_counter interval=" + lerp(1, 0.08, pace)];
    }
  },
  {
    // Two banks flashing against each other with a quiet gap between, landed on the
    // playing outputs in their order, so a lightbar of any width works
    name: "Emergency", mood: "Red and blue to amber", spans: false, onMono: true,
    strip: ["#dd2222", "#2222dd", "#dd2222", "#111111", "#2222dd", "#dd2222", "#2222dd"],
    entries: function (target, pace, mood) {
      var speed = lerp(0.6, 2.5, pace);
      var amber = mood > 0.75;
      var playing = target.playing;
      var half = playing.length === 1 ? 1 : Math.floor(playing.length / 2);
      var left = playing.slice(0, half);
      var right = playing.slice(playing.length - half);
      var gap = playing.slice(half, playing.length - half);
      var lines = [nameSet(target, left) + " colour=" + (amber ? "yellow" : "red") +
                   ": flash speed=" + speed + " flashes=3 window=0.5"];
      if (right.length && playing.length > 1)
        lines.push(nameSet(target, right) + " colour=" + (amber ? "yellow" : "blue") +
                   ": flash speed=" + speed + " flashes=3 window=0.5 phase=0.5");
      if (gap.length && playing.length > 1)
        lines.push(nameSet(target, gap) + ": none");
      return lines;
    },
    alone: function (target, pace, mood) {
      return [target.selector + " colour=" + (mood > 0.75 ? "yellow" : "red") +
              ": flash speed=" + lerp(0.6, 2.5, pace) + " flashes=3 window=0.5"];
    }
  },
  {
    // Five lamps in the crossing's own colours, landed on the first five playing
    // outputs; any beyond them are told to stay dark, and fewer take fewer lamps
    name: "Pelican crossing", mood: "How soft the change is", spans: false, onMono: true,
    strip: ["#ff0000", "#ff7800", "#00d28c", "#ff0000", "#00d28c", "#111111", "#111111"],
    entries: function (target, pace, mood) {
      var scale = lerp(2, 0.4, pace);
      var playing = target.playing;
      var lamps = playing.slice(0, 5);
      var rest = playing.slice(5);
      var colours = ["red", "ff7800", "00d28c", "red", "00d28c"].slice(0, lamps.length);
      var lines = [nameSet(target, lamps) + " colour=" + colours.join(",") +
                   " ease=" + lerp(0.05, 0.6, mood) +
                   ": pelican_crossing red_interval=" + r2(8 * scale) +
                   " flashing_interval=" + r2(6 * scale) +
                   " green_interval=" + r2(20 * scale) +
                   " amber_interval=" + r2(3 * scale)];
      if (rest.length) lines.push(nameSet(target, rest) + ": none");
      return lines;
    },
    alone: false
  },
  {
    // Three colours chase each other across whatever plays it: the lights split into
    // three sets, each flashing in its own colour a third of a beat apart
    name: "Party", mood: "Colour", spans: true, onMono: true,
    strip: ["#ff00ff", "#ffff00", "#00ffff", "#ff00ff", "#ffff00", "#00ffff", "#ff00ff"],

// The looks this board offers
function everyLook() {
  return LOOKS.concat(BOARD.wireless ? NET_LOOKS : []);
}

function lookNamed(id) {
  return everyLook().filter(function (l) { return (l.id || l.name) === id; })[0] || null;
}

// What a look is kept as, which is its own id where it has one and its name otherwise
function keyOf(look) { return look.id || look.name; }

function luminance(colour) {
  var hex = colour.replace("#", "");
  return (0.299 * parseInt(hex.slice(0, 2), 16) + 0.587 * parseInt(hex.slice(2, 4), 16) +
          0.114 * parseInt(hex.slice(4, 6), 16)) / 255;
}

// The brightest a look ever asks for, which is the lamp a mono run drives at full
function peakOf(look) {
  if (!look || !look.strip.length) return 1;
  return Math.max.apply(null, look.strip.map(luminance)) || 1;
}

// What a colour comes to on a lamp that has none: the brightness it would drive, in
// the warm white a mono output actually lights. Scaled against the look's own
// brightest, so a look made of deep colours is not drawn as a row of dark lamps
function asMono(colour, peak) {
  var lit = Math.min(1, luminance(colour) / (peak || 1));
  return "rgb(" + Math.round(255 * lit) + "," + Math.round(226 * lit) + "," +
         Math.round(178 * lit) + ")";
}

// Whether a look has anything to give a target: a colour look cannot land on a mono lamp, a
// look that does not span cannot land on a run, and some have no single-light form. A banked
// look deals its banks along a run, so it needs more than one lamp or a single-light form
function canPlay(look, target) {
  if (!look) return true;
  if (target.kind === "run" && isBanked(look)) return target.count > 1 || look.alone !== false;
  if (!target.colour && !look.onMono) return false;
  if (target.count === 1 && look.alone === false) return false;
  if (target.kind === "run" && !look.spans) return false;
  return true;
}

// Why not, in the words of the thing that cannot happen
function whyNot(look, target) {
  if (!target.colour && !look.onMono) return "this look is all colour, and " +
                                             target.label.toLowerCase() + " is mono";
  if (target.count === 1 && look.alone === false)
    return "this look is shaped to several lights";
  if (target.kind === "run" && !look.spans) return "this look is shaped to separate lights";
  return "play this on " + target.label.toLowerCase();
}

// The lines one look's own entries write for one target, in the form that target can take. The
// effects part writes a stretch through this as the board will play it
function lookLines(look, target, pace, mood, colour) {
  if (!look || !canPlay(look, target)) return [];
  var lines = (target.count === 1 && look.alone)
    ? look.alone(target, pace, mood, colour)
    : look.entries(target, pace, mood, colour);
  return target.colour ? lines : lines.map(withoutColour);
}
// ---- the lamps, lit by the line the look writes ---------------------------------------
// A card can say what a look is made of; only a lamp actually running it can say what it
// looks like. A lamp here plays the entry its look would write, read back and run through
// the same shapes picofx uses, so the page cannot show one thing and save another. A look
// whose effect the board does not have yet falls back to its palette, drawn still.

// The colour words an entry may use, as the page has to draw them. These are the words
// autofx names, drawn a little softer than their constants so a screen full of them is
// not glaring
var NAMED = {
  black: "#000000", blue: "#2b5cff", cool: "#cfe4ff", cyan: "#28e0e0",
  green: "#22c65a", magenta: "#ff36c8", orange: "#ff9022", pink: "#ff9a9a",
  purple: "#9a46ff", red: "#ff2d1a", warm: "#ffc27a", white: "#ffffff",
  yellow: "#ffd21f"
};

var UNLIT = "#ffd9a0";   // what a lamp is drawn in where its entry names no colour

function inkOf(word) {
  if (!word) return UNLIT;
  if (word.charAt(0) === "#") return word;
  return NAMED[word] || ("#" + word);
}

// ---- reading an entry back ------------------------------------------------------------

// The lights a selector names, as numbers. A name carries ranges and single numbers,
// "out1-3,7", and a bare name is the whole run
function lightsOf(selector, count) {
  var parts = /^([a-z_]+)(.*)$/.exec(selector.trim());
  if (!parts) return [];
  var tail = parts[2];
  if (!tail) {
    var whole = [];
    for (var i = 1; i <= count; i++) whole.push(i);
    return whole;
  }
  var lights = [];
  tail.split(",").forEach(function (piece) {
    var span = /^(\d+)-(\d+)$/.exec(piece);
    if (span) {
      var from = parseInt(span[1], 10), to = parseInt(span[2], 10);
      var step = from <= to ? 1 : -1;
      for (var n = from; step > 0 ? n <= to : n >= to; n += step) lights.push(n);
    } else if (/^\d+$/.test(piece)) {
      lights.push(parseInt(piece, 10));
    }
  });
  return lights;
}

// The settings of one half of an entry, as numbers where they read as numbers. A value
// that is not a number stays a string, which is what carries a colour
function settingsOf(words) {
  var found = {};
  words.forEach(function (word) {
    var at = word.indexOf("=");
    if (at < 0) return;
    var name = word.slice(0, at), value = word.slice(at + 1);
    found[name] = /^-?\d+(\.\d+)?$/.test(value) ? parseFloat(value) : value;
  });
  return found;
}

// One entry, split where the colon divides the channel from the effect it plays
function parseEntry(line, count) {
  var at = line.indexOf(":");
  if (at < 0) return null;
  var left = line.slice(0, at).trim().split(/\s+/);
  var right = line.slice(at + 1).trim().split(/\s+/);
  return {lights: lightsOf(left.shift(), count), channel: settingsOf(left),
          effect: right.shift(), settings: settingsOf(right)};
}

// ---- the effects, at the settings the entry carries ------------------------------------
// Each is picofx's own shape at the same settings. The board steps its cycle in whole
// milliseconds and wraps at a thousand, which the page does not reproduce: an effect slow
// enough that a frame adds nothing stands still there and drifts on here.

var TAU = Math.PI * 2;

// Where in its cycle an effect is. A cycle running below zero wraps back into one, as picofx's
// modulo does, or a blink or a flash would read a negative point in its beat as lit
function offsetOf(t, settings) {
  var at = ((t * num(settings.speed, 1)) + num(settings.phase, 0)) % 1;
  return at < 0 ? at + 1 : at;
}

function num(value, fallback) {
  return typeof value === "number" ? value : fallback;
}

// A value kept for a while, then a new one. Named per effect, so two of them on one lamp
// do not take each other's turn
function renewed(sim, where, dt, hold, then) {
  var walk = sim[where] || (sim[where] = {});
  walk.left = (walk.left === undefined ? 0 : walk.left) - dt;
  if (walk.left <= 0) {
    walk.left += hold();
    walk.value = then(walk.value);
  }
  return walk.value === undefined ? 0 : walk.value;
}

function betweenAt(low, high) {
  return low + Math.random() * (high - low);
}

var EFFECTS = {

  none: function () { return 0; },

  static: function (t, s) { return num(s.brightness, 1); },

  blink: function (t, s) {
    return offsetOf(t, s) % 1 < num(s.duty, 0.5) ? 1 : 0;
  },

  blink_wave: function (t, s, pos) {
    var at = (offsetOf(t, s) + pos / num(s.length, 1)) % 1;
    return at < num(s.duty, 0.5) ? 1 : 0;
  },

  pulse: function (t, s) {
    return (Math.sin(offsetOf(t, s) * TAU) + 1) / 2;
  },

  pulse_wave: function (t, s, pos) {
    var at = offsetOf(t, s) + pos / num(s.length, 1);
    return (Math.sin(at * TAU) + 1) / 2;
  },

  flash: function (t, s) {
    return flashing(offsetOf(t, s), s);
  },

  flash_sequence: function (t, s, pos) {
    return flashing(offsetOf(t, s) + pos / num(s.length, 1), s);
  },

  // A light sweeping the run and bouncing back, one pass out and one back to a cycle
  sweep: function (t, s, pos) {
    var swing = (t * num(s.speed, 1)) % 2;
    var head = (swing < 1 ? swing : 2 - swing) * (num(s.length, 1) - 1);
    return Math.max(0, 1 - Math.abs(pos - head) / num(s.extent, 1));
  },

  // The run read as a binary number, counting up from where the entry starts it
  binary_counter: function (t, s, pos) {
    var counter = num(s.count, 0) +
                  Math.floor(t / Math.max(0.001, num(s.interval, 0.1))) * num(s.step, 1);
    return (Math.floor(counter / Math.pow(2, pos)) % 2) ? 1 : 0;
  },

  // The guttering of a flame, held bright for a while and dim for a while
  flicker: function (t, s, pos, sim) {
    var bright = num(s.brightness, 1);
    var dim = bright * (1 - num(s.dimness, 0.5));
    return renewed(sim, "flicker", FRAME, function () {
      var walk = sim.flicker;
      walk.low = !walk.low;
      return walk.low ? betweenAt(num(s.dim_min, 0.02), num(s.dim_max, 0.04))
                      : betweenAt(num(s.bright_min, 0.05), num(s.bright_max, 0.1));
    }, function () { return sim.flicker.low ? dim : bright; });
  },

  random: function (t, s, pos, sim) {
    return renewed(sim, "random", FRAME, function () { return num(s.interval, 0.05); },
                function () {
                  return betweenAt(num(s.brightness_min, 0), num(s.brightness_max, 1));
                });
  },

  pelican_crossing: function (t, s, pos) {
    return phasing(t, pos, [
      [[1, 0, 0, 0, 1], num(s.red_interval, 8)],
      [[0, 1, 0, 0, 1], num(s.flashing_interval, 6)],
      [[0, 0, 1, 1, 0], num(s.green_interval, 20)],
      [[0, 1, 0, 1, 0], num(s.amber_interval, 3)]
    ], 1);
  },

  traffic_light: function (t, s, pos) {
    return phasing(t, pos, [
      [[1, 0, 0], num(s.red_interval, 10)],
      [[1, 1, 0], num(s.red_amber_interval, 5)],
      [[0, 0, 1], num(s.green_interval, 10)],
      [[0, 1, 0], num(s.amber_interval, 5)]
    ], -1);
  }
};

// A preview keeps a walk for each light, so these two already play each light its own way,
// which is what the _each effects do on the board
EFFECTS.flicker_each = EFFECTS.flicker;
EFFECTS.random_each = EFFECTS.random;

// Flash's window and its count of flashes within it, shared by the two that use it
function flashing(at, s) {
  var offset = at % 1;
  var window = num(s.window, 1);
  if (offset >= window) return 0;
  return ((offset * num(s.flashes, 1)) / window) % 1 < num(s.duty, 0.5) ? 1 : 0;
}

// The phases a crossing steps through, and how long each lasts. A real crossing is long
// enough that a page showing it truthfully would look broken, so the whole sequence is
// shown in SEQUENCE seconds with its phases kept in proportion. Only the drawing is
// hurried; the entry keeps the intervals the sliders set
var SEQUENCE = 8;
var FLASHING_CYCLE = 0.25;   // the amber and the figure, which flash at their real rate

function phasing(t, pos, states, flashes) {
  var whole = states.reduce(function (sum, one) { return sum + one[1]; }, 0);
  var at = (t / SEQUENCE) % 1 * whole;
  for (var i = 0; i < states.length; i++) {
    if (at < states[i][1]) {
      var lit = states[i][0][pos];
      if (i !== flashes || !lit) return lit === undefined ? 0 : lit;
      // Both flash off one clock, so the amber and the figure are never out of step
      return (t % FLASHING_CYCLE) < FLASHING_CYCLE / 2 ? 1 : 0;
    }
    at -= states[i][1];
  }
  return 0;
}

// ---- the effects that bring their own colour -------------------------------------------

function hueInk(hue, sat, val) {
  var c = num(val, 1) * num(sat, 1);
  var x = c * (1 - Math.abs(((hue / 60) % 2) - 1));
  var low = num(val, 1) - c;
  var rgb = hue < 60 ? [c, x, 0] : hue < 120 ? [x, c, 0] : hue < 180 ? [0, c, x]
          : hue < 240 ? [0, x, c] : hue < 300 ? [x, 0, c] : [c, 0, x];
  return "#" + rgb.map(function (part) {
    var v = Math.round((part + low) * 255).toString(16);
    return v.length < 2 ? "0" + v : v;
  }).join("");
}

var COLOURED = {

  rainbow: function (t, s) {
    return {level: 1, ink: hueInk(((t * num(s.speed, 1)) % 1) * 360, s.sat, s.val)};
  },

  // Wrapped as offsetOf is, or a hue would go out of range
  rainbow_wave: function (t, s, pos) {
    var at = ((t * num(s.speed, 1)) + pos / num(s.length, 1)) % 1;
    return {level: 1, ink: hueInk((at < 0 ? at + 1 : at) * 360, s.sat, s.val)};
  },

  hue_step: function (t, s) {
    var steps = Math.max(1, num(s.steps, 8));
    var which = Math.floor(t / Math.max(0.001, num(s.interval, 1))) % steps;
    return {level: 1, ink: hueInk(which / steps * 360, s.sat, s.val)};
  },

  // Given several colours, it moves to its next each time its beat comes round
  rgb_blink: function (t, s) {
    var colours = String(s.colour || "red").split("|");
    var beats = Math.floor(t * num(s.speed, 1) + num(s.phase, 0));
    var which = ((beats % colours.length) + colours.length) % colours.length;
    return {level: EFFECTS.blink(t, s), ink: inkOf(colours[which])};
  }
};

// ---- the curve a channel follows --------------------------------------------------------
// fade crosses at a steady rate and ease settles in as a bulb does, both of them the
// seconds a change takes to arrive. What they leave behind is the trail under anything
// travelling a run. A split fade or ease, rise|fall, goes up at its rise and comes down at its
// fall, and one number is both

function curved(sim, given, channel) {
  function parts(value) {
    if (typeof value === "number") return [value, value];
    var split = String(value || "").split("|").map(Number);
    return split.length === 2 && split.every(isFinite) ? split : [0, 0];
  }
  var fade = parts(channel.fade), ease = parts(channel.ease);
  if (!fade[0] && !fade[1] && !ease[0] && !ease[1]) return given;
  var was = sim.curve === undefined ? given : sim.curve;
  var rising = given > was;
  var fadeFor = fade[rising ? 0 : 1], easeFor = ease[rising ? 0 : 1];
  var now;
  if (fade[0] || fade[1]) {
    now = !fadeFor ? given
        : rising ? Math.min(given, was + FRAME / fadeFor) : Math.max(given, was - FRAME / fadeFor);
  } else {
    now = !easeFor ? given : was + (given - was) * Math.min(1, FRAME / easeFor);
  }
  sim.curve = Math.max(0, Math.min(1, now));
  return sim.curve;
}

// ---- what one lamp of a target is doing at time t ----------------------------------------

// Whether a strip's stretches are being played, so the looks take the strip's form
var previewingStrip = false;

// The target a look writes for, built from what the lamp knows. Colour is always asked
// for, so an entry naming one says what to draw the lamp in; a caller showing mono lamps
// draws it its own way. The preview plays a stretch as that many lamps of its own
function lampTarget(count) {
  var playing = [];
  for (var i = 1; i <= count; i++) playing.push(i);
  var target = {kind: count === 1 ? "one" : "outputs", id: "outputs", name: "out",
                label: "the outputs", colour: true, count: count, playing: playing,
                selector: "out" + (count === 1 ? "1" : "1-" + count)};
  if (previewingStrip) Object.assign(target, {strip: true, lights: playing.slice()});
  return target;
}

// What a look's entries light at slot, which lamp this is counted from zero, of count playing.
// The effects part plays a stretch through this as the board will
function lookLit(look, holder, t, slot, count, sim) {
  if (!look || !look.entries) return null;
  var lines;
  try {
    lines = linesFor(look, lampTarget(count), holder.pace, holder.mood, holder.colour);
  } catch (e) {
    return null;
  }

  // The entry that names this lamp, the last one winning where two do, as the board
  // reads them in order
  var mine = null, place = 0;
  lines.forEach(function (line) {
    var entry = parseEntry(line, count);
    if (!entry) return;
    var at = entry.lights.indexOf(slot + 1);
    if (at >= 0) { mine = entry; place = at; }
  });
  if (!mine) return null;

  var coloured = COLOURED[mine.effect];
  if (coloured) {
    var shown = coloured(t, mine.settings, place, sim);
    return {level: curved(sim, shown.level, mine.channel), ink: shown.ink};
  }

  var effect = EFFECTS[mine.effect];
  if (!effect) return null;
  // A colour list gives each light of the entry its own, in order
  var colours = String(mine.channel.colour || "").split(",");
  return {level: curved(sim, effect(t, mine.settings, place, sim), mine.channel),
          ink: inkOf(colours[Math.min(place, colours.length - 1)])};
}

// ---- painting them, forty times a second ---------------------------------------------

var FRAME = 1 / 40;
var beat = 0;

var HOLDING_STILL = window.matchMedia &&
                    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// ---- the board's outputs, inside the sections system ------------------------------------
// A colour output is three PWM channels behind one lamp. Where the board lets an adapter tell
// those three apart, the output is either one colour lamp or three mono ones, and a board is
// a mix. A mono output is one light, always on the mono side. Everything below is the section
// model over a run of lamps: the only new idea is that the run's own length is something the
// wiring decides.

var OUTS = BOARD.outputs.length;
var CHANNELS = ["r", "g", "b"];
var CHANNEL_WORDS = {r: "red", g: "green", b: "blue"};

// Each output as the file names it, split into its prefix and number: out3 is out and 3, and
// rgb, which has no number, is rgb alone
var OUTPUTS = BOARD.outputs.map(function (output) {
  var named = output.name.match(/^([a-z]+)(\d*)$/);
  return {name: output.name, prefix: named[1], number: named[2] ? Number(named[2]) : null,
          mono: output.kind === "mono", breaks: !!output.breaks_out};
});

// Whether the mono side comes first, as on a board whose outputs start with its mono ones. The
// file names the lamps in the same order
var MONO_FIRST = OUTPUTS.length > 0 && OUTPUTS[0].mono;
document.getElementById("sides").classList.toggle("monofirst", MONO_FIRST);
document.querySelector("#outPanel > summary .says").textContent = BOARD.output_words.panel;

// The corner cut into a broken-out lamp, saying which of an output's three drives it
var CHANNEL_INKS = ["#d63a2a", "#23a55a", "#2f76d9"];

// Every lamp on the page, by the output it belongs to, so pointing at one reaches the
// others without the page being drawn again
var kinOf = {};

// A colour output is one lamp or three, and nothing between: the adapter brings all three
// channels out or it is not fitted. Two channels playing the same thing are two lamps in
// one stretch, which is sectioning and not wiring. A mono output is held as broken out for good
var wiring = [];
for (var n = 0; n < OUTS; n++) wiring.push({broken: OUTPUTS[n].mono});

function Run(name, mono) {
  return {name: name, mono: mono, lamps: [], sections: [], picked: 0,
          was: [], undone: []};
}

// The colour lamps and the mono ones are each a run of their own
var outs = Run("out", false);
var mono = Run("mono", true);
var runs = MONO_FIRST ? [mono, outs] : [outs, mono];

// The one stretch being worked on, which is the run it is in and its place in that run.
// One set of looks can only be for one stretch, so the other run shows no mark at all
var active = MONO_FIRST ? mono : outs;

// Which kind of lamp the one set of looks is drawn for. It follows whatever was last
// pointed at, so the cards are always the ones for the lights being worked on
var showing = MONO_FIRST;

// Where each lamp sits, which is the one thing about a board only its owner knows. It
// is a lamp and not an output that is placed: an output's three channels reach three
// separate LEDs through the adapter, and those can be anywhere in a build
var order = [];
for (var m = 0; m < OUTS; m++) order = order.concat(placesOf(m));

// An output's places in the wiring order: a mono output's one light, a colour output whole, or
// broken out as its three channels
function placesOf(out) {
  if (OUTPUTS[out].mono) return [{out: out, channel: 0}];
  if (!wiring[out].broken) return [{out: out, channel: null}];
  return CHANNELS.map(function (letter, c) { return {out: out, channel: c}; });
}

function sameLamp(a, b) { return a.out === b.out && a.channel === b.channel; }

function placeOf(lamp) {
  for (var i = 0; i < order.length; i++) {
    if (sameLamp(order[i], lamp)) return i;
  }
  return -1;
}

// ---- the lamps the wiring adds up to -----------------------------------------------------

function lampsFor(run) {
  var found = [];
  // A strip's lamps are its LEDs, each a colour lamp, and the drawing asks it how many it has
  if (run.strip) {
    for (var i = 0; i < run.leds; i++) found.push({colour: true, at: i, run: run});
    run.count = run.leds;
    return found;
  }
  order.forEach(function (place) {
    var colour = place.channel === null;
    if (colour !== !wiring[place.out].broken) return;
    if (colour === run.mono) return;
    found.push({out: place.out, colour: colour, channel: place.channel});
  });
  return found;
}

function widthOf(section) { return section.to - section.from + 1; }

// Whether a lamp is a channel of a colour output broken out, which the file names by its channel
function isChannel(lamp) { return !lamp.colour && !OUTPUTS[lamp.out].mono; }

// What one lamp is called, in the words the file uses
function selectorFor(lamp) {
  if (lamp.run) return lamp.run.name + (lamp.at + 1);
  var name = OUTPUTS[lamp.out].name;
  return isChannel(lamp) ? name + "." + CHANNELS[lamp.channel] : name;
}

// Whether the output after this one, counting by step, is the next of the same name
function nextOutput(out, step) {
  var here = OUTPUTS[out], there = OUTPUTS[out + step];
  return !!there && here.number !== null && there.prefix === here.prefix &&
         there.number === here.number + step;
}

// A set of items as the file joins them: an item's prefix carries on to a bare number after it,
// so a numbered item says its prefix only where it differs from the one before, and an output
// with no number always says its name
function joinedItems(items) {
  var prefix = null;
  return items.map(function (item) {
    var output = OUTPUTS[item.out];
    var said = output.number === null ? output.name + item.rest
             : (output.prefix === prefix ? "" : output.prefix) + item.rest;
    prefix = output.prefix;
    return said;
  }).join(",");
}

// An item naming outputs first to last of one name, with a channel suffix or none
function rangeItem(first, last, suffix) {
  var from = OUTPUTS[first].number, to = OUTPUTS[last].number;
  return {out: first,
          rest: (from === null ? "" : first === last ? String(from) : from + "-" + to) +
                (suffix ? "." + suffix : "")};
}

// The shortest way to name a set of lamps that the file still reads. Consecutive outputs taken
// whole, and consecutive mono outputs, are a range, and an output's three channels in order are
// its `.*`
function nameThese(lamps) {
  // An output's three channels, in order, starting here
  function allThree(at) {
    return at + 2 < lamps.length && isChannel(lamps[at]) &&
           lamps[at].channel === 0 && lamps[at + 1].channel === 1 &&
           lamps[at + 2].channel === 2 && lamps[at + 1].out === lamps[at].out &&
           lamps[at + 2].out === lamps[at].out;
  }

  var items = [];
  var at = 0;
  while (at < lamps.length) {
    if (!isChannel(lamps[at])) {
      var last = at;
      while (last + 1 < lamps.length && !isChannel(lamps[last + 1]) &&
             lamps[last + 1].colour === lamps[at].colour &&
             lamps[last + 1].out === lamps[last].out + 1 && nextOutput(lamps[last].out, 1)) {
        last++;
      }
      items.push(rangeItem(lamps[at].out, lamps[last].out, null));
      at = last + 1;
    } else if (allThree(at)) {
      var end = at;
      var highest = lamps[at].out;
      while (allThree(end + 3) && lamps[end + 3].out === highest + 1 && nextOutput(highest, 1)) {
        end += 3;
        highest++;
      }
      items.push(rangeItem(lamps[at].out, highest, "*"));
      at = end + 3;
    } else {
      items.push(rangeItem(lamps[at].out, lamps[at].out, CHANNELS[lamps[at].channel]));
      at++;
    }
  }
  return joinedItems(items);
}

// A lamp's label on the page: its number, and its channel where it is one, or for an output with
// no number its name, or its channel's letter
function shortName(lamp) {
  if (lamp.run) return String(lamp.at + 1);
  var output = OUTPUTS[lamp.out];
  if (output.number === null) {
    return isChannel(lamp) ? CHANNELS[lamp.channel].toUpperCase() : output.name.toUpperCase();
  }
  return isChannel(lamp) ? output.number + CHANNELS[lamp.channel] : String(output.number);
}

// ---- sections over those lamps -----------------------------------------------------------

function sectionAt(run, which) {
  for (var i = 0; i < run.sections.length; i++) {
    if (which >= run.sections[i].from && which <= run.sections[i].to) return i;
  }
  return 0;
}

// A stretch playing nothing yet. One on a strip starts at three quarters brightness, a strip or
// LED panel at full being glaring up close
function blank(from, to, run) {
  return {from: from, to: to, look: null, pace: 0.45, mood: 0.5, colour: "#ff8c1a",
          level: run && run.strip ? 0.75 : 1};
}

// ---- keeping a stretch on its own lamps ----------------------------------------------------
// A stretch is a range of places in a run, and breaking an output out puts three lamps in
// at the output's own place. Every stretch after that would fall on different lights, so
// what each one holds is taken by lamp before the run changes and put back afterwards.

// A stretch's list of colours to blink through, copied so two stretches never share one
function copyBlinks(blinks) {
  return blinks ? {colours: blinks.colours.slice(), at: blinks.at} : undefined;
}

// A stretch's values typed past its sliders' ends, by slider, or a signal's timings, copied
// as its blinks are
function copyExact(exact) {
  return exact ? JSON.parse(JSON.stringify(exact)) : undefined;
}

// What holds a stretch to its lamps across a change to the wiring. A strip's lamps have no
// output to be named by, so they are named by the strip and their place
function lampKey(lamp) {
  if (lamp.run) return lamp.run.id + ":" + lamp.at;
  return lamp.out + "." + (lamp.channel === null ? "whole" : lamp.channel);
}

function whatEachHolds(run) {
  return run.sections.map(function (section) {
    return {look: section.look, pace: section.pace, mood: section.mood,
            colour: section.colour, reversed: section.reversed, level: section.level,
            custom: section.custom, blinks: copyBlinks(section.blinks),
            exact: copyExact(section.exact), timings: copyExact(section.timings),
            held: run.lamps.slice(section.from, section.to + 1).map(lampKey)};
  });
}

// Lamps no stretch claims become one of their own, which is what an output's three
// channels are the moment it is broken out. A stretch they land inside becomes two, so
// every other lamp keeps what it was playing
function putStretchesBack(run, was) {
  var mine = {};
  was.forEach(function (one, which) {
    one.held.forEach(function (key) { mine[key] = which; });
  });

  var sections = [];
  var at = 0;
  while (at < run.lamps.length) {
    var which = mine[lampKey(run.lamps[at])];
    var to = at;
    while (to + 1 < run.lamps.length &&
           mine[lampKey(run.lamps[to + 1])] === which) to++;
    var had = which === undefined ? null : was[which];
    sections.push(had ? {from: at, to: to, look: had.look, pace: had.pace,
                         mood: had.mood, colour: had.colour, reversed: had.reversed,
                         level: had.level, custom: had.custom,
                         blinks: copyBlinks(had.blinks), exact: copyExact(had.exact),
                         timings: copyExact(had.timings)}
                      : Object.assign(blank(at, to, run), {}));
    at = to + 1;
  }
  if (sections.length) run.sections = sections;
}

// Hold every run's stretches to their lamps across a change to the wiring
function acrossWiring(change) {
  var was = {};
  runs.forEach(function (run) { was[run.name] = whatEachHolds(run); });
  change();
  settle();
  runs.forEach(function (run) { putStretchesBack(run, was[run.name]); });
  settle();
}

// A cut is one run's step. A change to the wiring is every run's, both of them holding
// lamps that moved, so the snapshots it takes share a mark and are stepped over together
var thisStep = 0;

function remember(run) {
  run.undone = [];
  run.was.push(JSON.stringify({mark: thisStep, sections: run.sections}));
  if (run.was.length > 40) run.was.shift();
  thisStep++;
}

// The runs whose top step is the same one as this run's, which is every run where the
// wiring changed and only this one where a cut did
function steppingWith(run, stack) {
  var top = run[stack].length ? JSON.parse(run[stack][run[stack].length - 1]) : null;
  if (!top) return [];
  return runs.filter(function (other) {
    if (other === run || !other[stack].length) return false;
    var mine = JSON.parse(other[stack][other[stack].length - 1]);
    return Math.abs(mine.mark - top.mark) < runs.length;
  });
}

// A step back or on is the scene's, so it changes the stretches and never the board
function stepBack(run) {
  if (!run.was.length) return;
  var also = steppingWith(run, "was");
  [run].concat(also).forEach(function (one) {
    one.undone.push(JSON.stringify({mark: thisStep, sections: one.sections}));
    one.sections = JSON.parse(one.was.pop()).sections;
  });
  thisStep++;
  settle();
  draw();
}

function stepOn(run) {
  if (!run.undone.length) return;
  var also = steppingWith(run, "undone");
  [run].concat(also).forEach(function (one) {
    one.was.push(JSON.stringify({mark: thisStep, sections: one.sections}));
    one.sections = JSON.parse(one.undone.pop()).sections;
  });
  thisStep++;
  settle();
  draw();
}

// Every lamp is in exactly one section, and no section spans a colour lamp and a mono
// one: they do not play the same looks, so a stretch over both could not be given one
function settle() {
  runs.forEach(function (run) {
    run.lamps = lampsFor(run);
    var kept = [];
    run.sections.forEach(function (section) {
      var from = Math.max(0, Math.min(section.from, run.lamps.length - 1));
      var to = Math.max(from, Math.min(section.to, run.lamps.length - 1));
      if (kept.length && from <= kept[kept.length - 1].to) return;
      kept.push({from: from, to: to, look: section.look, pace: section.pace,
                 mood: section.mood, colour: section.colour, reversed: section.reversed,
                 level: section.level, custom: section.custom,
                 blinks: copyBlinks(section.blinks),
                 exact: copyExact(section.exact), timings: copyExact(section.timings)});
    });
    if (!kept.length || kept[0].from !== 0) kept.unshift(blank(0, -1, run));
    // Close the gaps, so the sections cover the run exactly
    var at = 0;
    var whole = [];
    kept.forEach(function (section, which) {
      section.from = at;
      section.to = Math.max(at, Math.min(section.to, run.lamps.length - 1));
      if (which === kept.length - 1) section.to = run.lamps.length - 1;
      if (section.to >= section.from) {
        whole.push(section);
        at = section.to + 1;
      }
    });
    run.sections = whole.length ? whole : [blank(0, run.lamps.length - 1, run)];

    // A section straddling a colour lamp and a mono one is split where the kind changes
    var split = [];
    run.sections.forEach(function (section) {
      var start = section.from;
      for (var i = section.from; i < section.to; i++) {
        if (run.lamps[i].colour !== run.lamps[i + 1].colour) {
          split.push({from: start, to: i, look: section.look, pace: section.pace,
                      mood: section.mood, colour: section.colour,
                      reversed: section.reversed, level: section.level, custom: section.custom,
                      blinks: copyBlinks(section.blinks),
                      exact: copyExact(section.exact), timings: copyExact(section.timings)});
          start = i + 1;
        }
      }
      split.push({from: start, to: section.to, look: section.look, pace: section.pace,
                  mood: section.mood, colour: section.colour, reversed: section.reversed,
                  level: section.level, custom: section.custom,
                  blinks: copyBlinks(section.blinks),
                  exact: copyExact(section.exact), timings: copyExact(section.timings)});
    });
    run.sections = split.filter(function (section) {
      return section.to >= section.from;
    });

    // A look a lamp cannot play is not left sitting on it
    run.sections.forEach(function (section) {
      var look = lookNamed(section.look);
      if (look && !canPlay(look, targetFor(run, section))) section.look = null;
    });
    run.picked = Math.max(0, Math.min(run.picked, run.sections.length - 1));
  });
}

// The one stretch being worked on. Everything that changes it comes through here, so
// the mark, the tools and the set of looks can never end up about different things.
// Setting up the board gives no stretch a look, so nothing is picked while it is on
function pick(run, at) {
  if (setupOn) return;
  active = run;
  run.picked = Math.max(0, Math.min(at, run.sections.length - 1));
  showing = kindAt(run, run.picked);
}

function cutAt(run, after) {
  if (after < 0 || after >= run.lamps.length - 1) return;
  var at = sectionAt(run, after);
  var section = run.sections[at];
  if (section.to === after) return;
  remember(run);
  run.sections.splice(at + 1, 0, {from: after + 1, to: section.to, look: section.look,
                                  pace: section.pace, mood: section.mood,
                                  colour: section.colour, reversed: section.reversed,
                                  level: section.level, custom: section.custom,
                                  blinks: copyBlinks(section.blinks),
                                  exact: copyExact(section.exact),
                                  timings: copyExact(section.timings)});
  section.to = after;
  settle();
  pick(run, at);
  draw();
}

function uncut(run, which) {
  var left = run.sections[which];
  var right = run.sections[which + 1];
  if (!right) return;
  remember(run);
  left.to = right.to;
  run.sections.splice(which + 1, 1);
  settle();
  pick(run, which);
  draw();
}

// Moving a cut takes lamps from the stretch on one side and gives them to the other. A
// stretch squeezed to nothing is gone, which is how a drag joins two
function moveEdge(run, which, to) {
  var left = run.sections[which];
  var right = run.sections[which + 1];
  if (!right) return;
  to = Math.max(left.from - 1, Math.min(right.to, to));
  left.to = to;
  right.from = to + 1;
  run.sections = run.sections.filter(function (one) { return one.to >= one.from; });
  run.picked = Math.min(run.picked, run.sections.length - 1);
}

// Joined back into one, the run plays what the stretch picked was playing
function joinAll(run) {
  var section = run.sections[run.picked];
  var had = section && playsOf(section);
  remember(run);
  run.sections = [blank(0, run.lamps.length - 1, run)];
  settle();
  pick(run, 0);
  draw();
  if (had && run.sections.length === 1) {
    Object.assign(run.sections[0], had);
    settle();
    draw();
  }
}

// ---- the wiring itself -------------------------------------------------------------------
// One output broken out or put back, in the scene on show. The wiring part does it to every
// scene and slides the lamps

function breakOutWiring(out) {
  if (wiring[out].broken) return;
  runs.forEach(remember);
  acrossWiring(function () {
    wiring[out] = {broken: true};
    // The three take the place the one held, and are free to be moved apart from there
    var at = placeOf({out: out, channel: null});
    if (at >= 0) {
      order.splice(at, 1, {out: out, channel: 0}, {out: out, channel: 1},
                   {out: out, channel: 2});
    }
  });
  pickOutput(out);
  draw();
}

// Breaking out and putting back are done to one output, and what is done next is nearly
// always to its lamps, so the mark and the set of looks go to the stretch holding them.
// While the board is set up the output is held, and picked once setting up ends
function pickOutput(out) {
  if (setupOn) {
    heldOutput = out;
    return;
  }
  runs.some(function (run) {
    var at = run.lamps.map(function (lamp) { return lamp.out; }).indexOf(out);
    if (at < 0) return false;
    pick(run, sectionAt(run, at));
    return true;
  });
}

function rejoinWiring(out) {
  if (!wiring[out].broken || OUTPUTS[out].mono) return;
  runs.forEach(remember);
  acrossWiring(function () {
    wiring[out] = {broken: false};
    // Wherever its three ended up, the one lamp takes the place of the first of them
    var first = -1;
    order = order.filter(function (place) {
      if (place.out !== out) return true;
      if (first < 0) first = placeOf(place);
      return false;
    });
    order.splice(Math.max(0, first), 0, {out: out, channel: null});
  });
  pickOutput(out);
  draw();
}

// ---- what the file says ------------------------------------------------------------------

// Some outputs by their place counted from one, as the file names them: those of one name in a
// row as a set of numbers, an output with no number by its name
function outputsNamed(places) {
  var items = [];
  var at = 0;
  while (at < places.length) {
    var output = OUTPUTS[places[at] - 1];
    var last = at;
    while (output.number !== null && last + 1 < places.length &&
           OUTPUTS[places[last + 1] - 1].number !== null &&
           OUTPUTS[places[last + 1] - 1].prefix === output.prefix) last++;
    var numbers = places.slice(at, last + 1).map(function (place) {
      return OUTPUTS[place - 1].number;
    });
    items.push({out: places[at] - 1, rest: output.number === null ? "" : rangify(numbers)});
    at = last + 1;
  }
  return joinedItems(items);
}

// An output in words: output 3, or the RGB output for one with no number
function outputSaid(out) {
  var output = OUTPUTS[out];
  return output.number === null ? "the " + output.name.toUpperCase() + " output"
                                : "output " + output.number;
}

// The board's colour outputs in words, as one where there is only one
function colourOutputsSaid() {
  var colour = [];
  OUTPUTS.forEach(function (output, out) { if (!output.mono) colour.push(out); });
  return colour.length === 1 ? outputSaid(colour[0]) : "the colour outputs";
}

// What a stretch plays on, as though it ran from its near end
function forwardTargetFor(run, section) {
  if (run.strip) {
    // The stretch's lights by number, for the looks that deal them out themselves
    var lights = [];
    for (var at = section.from; at <= section.to; at++) lights.push(at + 1);
    return {kind: "run", id: run.id, name: run.name, label: run.label, colour: true,
            selector: stripSelector(run, section), count: widthOf(section), playing: [],
            lights: lights};
  }
  var first = run.lamps[section.from];
  if (!first) return {kind: "outputs", colour: false, selector: "out1", count: 1,
                      label: "nothing", playing: []};
  var mine = [];
  for (var i = section.from; i <= section.to; i++) mine.push(run.lamps[i]);
  // What a stretch plays on, in build order, which a look sharing its lamps out between
  // sets of its own, as Party does, deals from. A colour stretch's are its outputs; a mono
  // stretch's are its lamps, which are channels, so it names each set itself
  var target = {kind: first.colour && widthOf(section) === 1 ? "single" : "outputs",
                name: "out", colour: first.colour, selector: nameThese(mine),
                count: widthOf(section), playing: [],
                label: first.colour ? colourOutputsSaid() : "the mono lights"};
  if (first.colour) {
    target.playing = mine.map(function (lamp) { return lamp.out + 1; });
    target.nameSet = outputsNamed;
  } else {
    target.playing = mine.map(function (lamp, at) { return at; });
    target.nameSet = function (set) {
      return nameThese(set.map(function (at) { return mine[at]; }));
    };
  }
  return target;
}

// A stretch below full brightness says so before the colon of each line it writes, as
// level=, which scales whatever the effect plays. A line playing nothing is left alone
function levelled(lines, level) {
  if (level === undefined || level >= 1) return lines;
  var said = " level=" + Math.round(level * 100) + "%";
  return lines.map(function (line) {
    var at = line.indexOf(":");
    if (at < 0 || /:\s*none\s*$/.test(line)) return line;
    return line.slice(0, at) + said + line.slice(at);
  });
}

// What the lamps play, a line or more for each stretch with a look
function lampLines() {
  var lines = [];
  runs.forEach(function (run) {
    run.sections.forEach(function (section) {
      var look = lookNamed(section.look);
      if (!look) return;
      lines = lines.concat(sectionLines(run, section, look));
    });
  });
  return lines;
}

// ---- lighting -----------------------------------------------------------------------------

var painters = [];
var walks = {};

// What each lamp of a run shows now. A strip's stretches are played in the strip's form
function litRun(run) {
  var out = [];
  var store = walks[run.name] || (walks[run.name] = {});
  previewingStrip = !!run.strip;
  try {
    run.sections.forEach(function (section) {
      var look = lookNamed(section.look);
      var wide = widthOf(section);
      for (var i = 0; i < wide; i++) {
        var which = section.from + i;
        var lamp = run.lamps[which];
        if (!lamp) continue;
        var walk = store[which] || (store[which] = {});
        var lit = look ? livePlay(look, section, beat, i, wide, walk) : null;
        out[which] = lit
          ? {level: Math.max(0, Math.min(1, lit.level)),
             ink: lamp.colour ? lit.ink : "#ffd9a0"}
          : {level: 0, ink: "#3a3f44", nothing: true};
      }
    });
  } finally {
    previewingStrip = false;
  }
  return out;
}

function inkAt(lit) {
  var hex = (lit.ink || "#ffd9a0").replace("#", "");
  var mix = 0.1 + lit.level * 0.9;
  return "rgb(" + Math.round(parseInt(hex.slice(0, 2), 16) * mix) + "," +
         Math.round(parseInt(hex.slice(2, 4), 16) * mix) + "," +
         Math.round(parseInt(hex.slice(4, 6), 16) * mix) + ")";
}

// ---- the gallery, played on the chosen stretch --------------------------------------------

var CARD_LIGHTS = 12;
var MIDDLING = {pace: 0.5, mood: 0.5, colour: "#ff8c1a"};
var cardFaces = [];
var cardWalks = {};
var carrying_lamp = null;

// The cut being dragged, and whether the pointer moved far enough for the release to be
// the end of a drag rather than a click
var holding = null;
var dragged = false;

document.addEventListener("mousemove", function (event) {
  if (!holding) return;
  var bar = document.getElementById(holding.where).querySelector(".bar");
  if (!bar) return;
  var box = bar.getBoundingClientRect();
  if (!box.width) return;
  var across = (event.clientX - box.left) / box.width;
  var lamp = Math.round(across * holding.run.lamps.length) - 1;
  var left = holding.run.sections[holding.which];
  if (!left || left.to === lamp) return;
  dragged = true;
  moveEdge(holding.run, holding.which, lamp);
  settle();
  pick(holding.run, holding.which);
  draw();
  // A drag that swallowed a stretch has done the one thing a drag can do. Letting it
  // carry on would eat the rest of the run in the same few pixels
  if (holding.run.sections.length !== holding.had) holding = null;
});

document.addEventListener("mouseup", function () {
  if (!holding) return;
  holding = null;
  draw();
  window.setTimeout(function () { dragged = false; }, 0);
});

// A look given to a stretch. A line kept as written that already plays some of its lights is
// asked about first, since the board refuses a light set twice: agreed, the kept lines go;
// declined, nothing changes. A strip not fitted takes no look, and a new look starts in its
// own colour, its second setting afresh
function landLook(run, at, name) {
  var section = run.sections[at];
  if (section && name) {
    var named = keptLights(run);
    var clashing = [];
    for (var lamp = section.from; lamp <= section.to; lamp++) {
      (named[lamp] || []).forEach(function (one) {
        if (clashing.indexOf(one) < 0) clashing.push(one);
      });
    }
    if (clashing.length) {
      var lines = clashing.map(function (one) { return one.text; }).join("\n");
      if (!confirm((clashing.length === 1 ? "A line kept as written already plays some of " +
                    "these lights:" : "Lines kept as written already play some of these " +
                    "lights:") + "\n\n" + lines + "\n\nTake " +
                   (clashing.length === 1 ? "it" : "them") + " out of the file and play " +
                   name + " instead?")) return;
      keptNow = keptNow.filter(function (one) { return clashing.indexOf(one) < 0; });
    }
  }
  if (run.strip && !run.there) return;
  var look = lookNamed(name);
  if (section && look && section.look !== name) {
    startColour(run, section, look);
    section.mood = START_MOODS[look.name] !== undefined ? START_MOODS[look.name] : MIDDLING.mood;
  }
  if (!section) return;
  if (section.look !== name) {
    remember(run);
    section.look = name;
  }
  settle();
  pick(run, at);
  draw();
}

function lookCard(isMono, look, on) {
  var card = document.createElement("div");
  card.className = "card" + (on ? " picked" : "") + (look.name ? "" : " nothing");
  var face = document.createElement("div");
  face.className = "face";
  if (look.name) {
    var cells = [];
    for (var i = 0; i < CARD_LIGHTS; i++) {
      var cell = document.createElement("span");
      face.appendChild(cell);
      cells.push(cell);
    }
    cardFaces.push({cells: cells, look: look, mono: isMono,
                    key: (isMono ? "m" : "c") + "-" + look.name});
  }
  card.appendChild(face);
  var name = document.createElement("div");
  name.className = "name";
  name.textContent = look.name || "Nothing";
  card.appendChild(name);

  card.title = look.name ? look.name + ": play it on the stretch being worked on"
                         : "leave a stretch dark";
  card.onclick = function () {
    var run = galleryRun(isMono);
    landLook(run, stretchFor(run, isMono), look.name);
  };
  if (!isMono && takesColour(lookNamed(look.name))) {
    card.appendChild(paletteMark());
    card.title += ". You can choose its colour";
  }
  return card;
}

// The run the cards are for. A run of another kind, a strip say, is its own kind and is
// worked on while it is the one picked; otherwise the cards follow the colour or mono side
function galleryRun(isMono) {
  if (active && active.strip) return active;
  return isMono ? mono : outs;
}

// Whether a stretch is mono, which is what the set of looks follows
function kindAt(run, at) {
  var section = run.sections[at];
  var lamp = section && run.lamps[section.from];
  return lamp ? !lamp.colour : false;
}

// Whether the board has any lamp of a kind. With none, its looks are worth offering but
// not worth landing: there is nothing for them to land on until an output is broken out
function haveKind(isMono) {
  return runs.some(function (run) {
    return run.lamps.some(function (lamp) { return lamp.colour === !isMono; });
  });
}

function stretchFor(run, isMono) {
  var section = run.sections[run.picked];
  var lamp = section && run.lamps[section.from];
  if (lamp && lamp.colour === !isMono) return run.picked;
  for (var i = 0; i < run.sections.length; i++) {
    var first = run.lamps[run.sections[i].from];
    if (first && first.colour === !isMono) return i;
  }
  return run.picked;
}

// The cards follow whatever stretch was last picked, so the gallery is a shelf of what that
// stretch can play
function renderGalleries() {
  // A kind the board has none of cannot be worked on, so the set goes back to the one it
  // has. Without this the cards would be for lights that are not there
  if (!haveKind(showing) && haveKind(!showing)) showing = !showing;

  var box = document.getElementById("looks");
  box.textContent = "";

  var tabs = document.createElement("div");
  tabs.className = "tabs sides";
  box.appendChild(tabs);

  var run = galleryRun(showing);
  var section = run.sections[run === active ? run.picked : stretchFor(run, showing)];
  var lamp = section && run.lamps[section.from];

  // What the stretch being worked on could actually be given. A look shaped to several
  // lamps has nothing to say on a stretch of one, and the model would clear it the moment
