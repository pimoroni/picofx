function featureIcon(key) {
  var feature = featureNamed(key);
  var icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  icon.setAttribute("viewBox", "0 0 24 24");
  icon.setAttribute("class", "featureicon");
  icon.setAttribute("aria-hidden", "true");
  icon.innerHTML = feature[3];
  return icon;
}

// What an example uses, read from its source. A program on the drive says nothing of it
function usesOf(path) {
  var example = BOARD_EXAMPLES.filter(function (one) { return one.path === path; })[0];
  return example ? example.uses : [];
}

// Frames captured off a board running each example, composed to what its panel showed and scaled
// to the thumbnail's size, by the example's file name, carried in the page as data URLs. Where one
// exists it is the thumbnail, the drawn one standing in only for what has not been captured
var THUMBS = {};

function offeredAt(path) {
  for (var g = 0; g < OFFERED.length; g++) {
    for (var i = 0; i < OFFERED[g][1].length; i++) {
      if ("examples/" + OFFERED[g][1][i][0] === path) return OFFERED[g][1][i];
    }
  }
  return null;
}

// Words a file name spells for the code, said as a reader would
var TITLE_WORDS = {crt: "CRT", led: "LED", color: "colour"};

// A program's name to show: its own where it gives one, else its file's, in words
function programTitle(path) {
  var program = programNamed(path);
  if (program && program.name) return program.name;
  var words = path.split("/").pop().replace(/\.py$/, "").split("_").map(function (word) {
    return TITLE_WORDS[word] || word;
  }).join(" ");
  return words.charAt(0).toUpperCase() + words.slice(1);
}

// ---- thumbnails ----------------------------------------------------------------------------------
// A screen's shape at a fifth of a 2.8" panel's pixels, drawn blocky on purpose, which is also what
// a captured frame scaled down this far would look like

var THUMB_W = 64, THUMB_H = 48;
var thumbImages = {};

function thumbCanvas(kind, seed, uses) {
  var canvas = document.createElement("canvas");
  canvas.width = THUMB_W;
  canvas.height = THUMB_H;
  canvas.className = "progthumb";
  paintThumb(canvas.getContext("2d"), kind, seed || 1, canvas, uses || []);
  return canvas;
}

// The outputs a program's lamps are drawn for: all of them, but a colour output among mono ones
// only where the program uses it
function lampsDrawn(uses) {
  var mixed = BOARD.outputs.some(function (output) { return output.kind === "mono"; });
  return BOARD.outputs.filter(function (output) {
    return !mixed || output.kind === "mono" || uses.indexOf("rgb") >= 0;
  });
}

// A lamp's colour on a mono output, a warm white as bright as the colour, an unlit lamp unchanged
function monoInk(ink) {
  if (ink === "#3a3f44") return ink;
  var level = (parseInt(ink.slice(1, 3), 16) * 0.2126 + parseInt(ink.slice(3, 5), 16) * 0.7152 +
               parseInt(ink.slice(5, 7), 16) * 0.0722) / 255;
  level = Math.max(0.3, level);
  return "rgb(" + Math.round(255 * level) + "," + Math.round(217 * level) + "," +
         Math.round(160 * level) + ")";
}

// A repeatable scatter, so a thumbnail is the same every time it is drawn
function scatter(seed) {
  var state = seed * 9301 + 49297;
  return function () {
    state = (state * 9301 + 49297) % 233280;
    return state / 233280;
  };
}

function paintThumb(g, kind, seed, canvas, uses) {
  var W = THUMB_W, H = THUMB_H, x, y, i;
  var chance = scatter(seed);
  function fill(ink) { g.fillStyle = ink; g.fillRect(0, 0, W, H); }
  function dotRow(ink, top, count, size, gap) {
    g.fillStyle = ink;
    for (i = 0; i < count; i++) g.fillRect(3 + i * (size + gap), top, size, size);
  }
  // A pair's two captured frames side by side, each whole in its half, as the two panels stand
  if (kind.indexOf("pair:") === 0) {
    fill("#111");
    [THUMBS[kind.slice(5)], THUMBS[kind.slice(5) + "-2"]].forEach(function (src, side) {
      var panel = thumbImages[src];
      if (!panel) {
        panel = thumbImages[src] = new Image();
        panel.src = src;
      }
      var placed = function () {
        var half = W / 2 - 1;
        var fit = Math.min(half / panel.width, H / panel.height);
        g.imageSmoothingEnabled = true;
        g.drawImage(panel, side * (half + 2) + (half - panel.width * fit) / 2,
                    (H - panel.height * fit) / 2, panel.width * fit, panel.height * fit);
      };
      if (panel.complete && panel.width) placed();
      else panel.addEventListener("load", placed);
    });
    return;
  }
  // A captured frame carried in the page, or the picture a program on the drive names
  if (kind.indexOf("shot:") === 0 || kind.indexOf("picture:") === 0) {
    fill("#111");
    var src = kind.indexOf("shot:") === 0 ? THUMBS[kind.slice(5)] : DRIVE_PICTURES[kind.slice(8)];
    var image = thumbImages[src];
    if (!image) {
      image = thumbImages[src] = new Image();
      image.src = src;
    }
    var drawn = function () {
      var scale = Math.max(W / image.width, H / image.height);
      g.imageSmoothingEnabled = true;
      g.drawImage(image, (W - image.width * scale) / 2, (H - image.height * scale) / 2,
                  image.width * scale, image.height * scale);
    };
    if (image.complete && image.width) drawn();
    else image.addEventListener("load", drawn);
    return;
  }
  if (kind.indexOf("lamps:") === 0) {
    // What the outputs do, as a lamp for each on the board's dark, spread across seven lamps' width
    fill("#1c1f22");
    var inks = {rainbow: ["#ff2d1a", "#ff9022", "#ffd21f", "#22c65a", "#28e0e0", "#2b5cff", "#9a46ff"],
                warm: ["#ffb060", "#ffc27a", "#ff9022", "#ffb060", "#ffc27a", "#ff9022", "#ffb060"],
                mono: ["#ffd9a0", "#3a3f44", "#ffd9a0", "#ffd9a0", "#3a3f44", "#ffd9a0", "#3a3f44"],
                pulse: ["#ffd9a0", "#c9aa7c", "#8a765a", "#4d4336", "#8a765a", "#c9aa7c", "#ffd9a0"],
                dusk: ["#ffe6b0", "#ffe6b0", "#ffe6b0", "#c9aa7c", "#8a765a", "#4d4336", "#3a3f44"],
                level: ["#3a3f44", "#3a3f44", "#22c65a", "#22c65a", "#3a3f44", "#3a3f44", "#3a3f44"],
                bar: ["#2b5cff", "#28e0e0", "#22c65a", "#ffd21f", "#3a3f44", "#3a3f44", "#3a3f44"],
                melody: ["#9a46ff", "#3a3f44", "#ff36c8", "#9a46ff", "#3a3f44", "#2b5cff", "#ff36c8"],
                countdown: ["#ff2d1a", "#ff2d1a", "#ff2d1a", "#22c65a", "#3a3f44", "#3a3f44", "#3a3f44"],
                off: ["#3a3f44", "#3a3f44", "#3a3f44", "#3a3f44", "#3a3f44", "#3a3f44", "#3a3f44"]};
    var row = inks[kind.slice(6)] || inks.mono;
    var lamps = lampsDrawn(uses);
    lamps.forEach(function (output, at) {
      var ink = row[Math.min(at, row.length - 1)];
      g.fillStyle = output.kind === "mono" ? monoInk(ink) : ink;
      g.beginPath();
      g.arc(lamps.length > 1 ? 6 + at * 8.6 * 6 / (lamps.length - 1) : W / 2, H / 2, 3.2, 0,
            Math.PI * 2);
      g.fill();
    });
    return;
  }
  switch (kind) {
  case "flipdot":
    fill("#101010");
    for (y = 0; y < 7; y++) for (x = 0; x < 20; x++) {
      g.fillStyle = chance() < 0.42 ? "#f5d400" : "#262626";
      g.fillRect(2 + x * 3, 13 + y * 3, 2, 2);
    }
    break;
  case "flap":
    fill("#161616");
    for (i = 0; i < 4; i++) {
      g.fillStyle = "#2c2c2c";
      g.fillRect(4 + i * 14 + (i > 1 ? 4 : 0), 12, 12, 24);
      g.fillStyle = "#0c0c0c";
      g.fillRect(4 + i * 14 + (i > 1 ? 4 : 0), 23, 12, 1);
      g.fillStyle = "#eee";
      g.font = "bold 16px monospace";
      g.fillText("1942".charAt(i), 6 + i * 14 + (i > 1 ? 4 : 0), 30);
    }
    break;
  case "flapboard":
    fill("#161616");
    for (y = 0; y < 5; y++) for (x = 0; x < 9; x++) {
      g.fillStyle = "#2a2a2a";
      g.fillRect(2 + x * 6.8, 5 + y * 8, 6, 7);
      g.fillStyle = chance() < 0.7 ? "#e8e8e8" : "#f5c400";
      g.fillRect(3.5 + x * 6.8, 7 + y * 8, 3, 3);
    }
    break;
  case "nixie":
  case "lixie":
    fill(kind === "nixie" ? "#140a06" : "#06080f");
    g.font = "bold 30px serif";
    g.shadowColor = kind === "nixie" ? "#ff7a1a" : "#6ab0ff";
    g.shadowBlur = 8;
    g.fillStyle = kind === "nixie" ? "#ffb060" : "#bfe0ff";
    g.fillText("7", 23, 36);
    g.shadowBlur = 0;
    break;
  case "board":
  case "bus":
    fill(kind === "bus" ? "#0b1a33" : "#0a0a0a");
    for (y = 0; y < 5; y++) {
      g.fillStyle = kind === "bus" ? "#ffffff" : "#ffb000";
      g.fillRect(4, 6 + y * 8, 8 + chance() * 10, 3);
      g.fillRect(28, 6 + y * 8, 14 + chance() * 12, 3);
      g.fillStyle = kind === "bus" ? "#ffd21f" : "#ffb000";
      g.fillRect(W - 12, 6 + y * 8, 8, 3);
    }
    break;
  case "amber":
  case "roadworks":
    fill("#0d0c0a");
    for (y = 0; y < 8; y++) for (x = 0; x < 21; x++) {
      var on = kind === "roadworks" ? (y === 3 || y === 4 || (x > 8 && x < 12))
                                    : chance() < 0.3;
      g.fillStyle = on ? "#ffa51a" : "#2a2218";
      g.fillRect(2 + x * 3, 12 + y * 3, 2, 2);
    }
    break;
  case "gantry":
    fill("#0a0a0a");
    for (i = 0; i < 3; i++) {
      g.fillStyle = "#1e1e1e";
      g.fillRect(3 + i * 21, 10, 18, 28);
      g.strokeStyle = i === 0 ? "#ff2d1a" : "#ffffff";
      g.lineWidth = 2;
      g.beginPath();
      if (i === 0) {
        g.moveTo(7, 16); g.lineTo(17, 32); g.moveTo(17, 16); g.lineTo(7, 32);
      } else {
        g.moveTo(12 + i * 21 - 9, 14); g.lineTo(12 + i * 21 - 9, 33);
        g.moveTo(12 + i * 21 - 14, 28); g.lineTo(12 + i * 21 - 9, 34);
        g.lineTo(12 + i * 21 - 4, 28);
      }
      g.stroke();
    }
    break;
  case "crt":
    fill("#031a06");
    g.fillStyle = "#39ff6a";
    for (y = 0; y < 6; y++) g.fillRect(4, 5 + y * 7, 10 + chance() * 40, 3);
    g.fillRect(4 + 22, 5 + 6 * 7 - 7, 3, 4);
    break;
  case "trivision":
    fill("#222");
    for (i = 0; i < 10; i++) {
      g.fillStyle = ["#ff5a36", "#ffd21f", "#2b5cff"][i % 3 === 0 ? 0 : i < 5 ? 1 : 2];
      g.fillRect(i * 6.4, 4, 5.6, 40);
    }
    break;
  case "iso":
    fill("#8fd0ff");
    for (y = 0; y < 6; y++) for (x = 0; x < 6; x++) {
      g.fillStyle = (x + y) % 3 ? "#4caf50" : "#2e7d32";
      g.beginPath();
      var cx = 32 + (x - y) * 6, cy = 8 + (x + y) * 3.4;
      g.moveTo(cx, cy); g.lineTo(cx + 6, cy + 3.4); g.lineTo(cx, cy + 6.8); g.lineTo(cx - 6, cy + 3.4);
      g.fill();
    }
    break;
  case "stars":
    fill("#02030a");
    for (i = 0; i < 60; i++) {
      var far = chance();
      g.fillStyle = far < 0.8 ? "#8a93b8" : "#ffffff";
      g.fillRect(Math.floor(chance() * W), Math.floor(chance() * H), far < 0.9 ? 1 : 2, 1);
    }
    break;
  case "wheel":
    fill("#000");
    for (i = 0; i < 24; i++) {
      g.fillStyle = "hsl(" + i * 15 + ",100%,55%)";
      g.beginPath();
      g.moveTo(32, 24);
      g.arc(32, 24, 19, i / 24 * Math.PI * 2, (i + 1) / 24 * Math.PI * 2 + 0.02);
      g.fill();
    }
    break;
  case "matrix":
    fill("#080808");
    for (y = 0; y < 10; y++) for (x = 0; x < 14; x++) {
      var lit = Math.hypot(x - 6.5, (y - 4.5) * 1.3) < 4.2;
      g.fillStyle = lit ? "#ff3a2a" : "#2a0d0a";
      g.beginPath();
      g.arc(5 + x * 4.2, 5 + y * 4.2, 1.5, 0, Math.PI * 2);
      g.fill();
    }
    break;
  case "kaleido":
    fill("#10061a");
    for (i = 0; i < 12; i++) {
      g.fillStyle = ["#ff36c8", "#28e0e0", "#ffd21f", "#9a46ff"][i % 4];
      g.beginPath();
      g.moveTo(32, 24);
      g.arc(32, 24, 21, i / 12 * Math.PI * 2, (i + 0.55) / 12 * Math.PI * 2);
      g.fill();
    }
    break;
  case "logo":
    fill("#15233a");
    g.fillStyle = "#ff36c8";
    g.fillRect(34, 10, 20, 12);
    g.fillStyle = "#15233a";
    g.fillRect(38, 13, 12, 6);
    break;
  case "carpet":
    fill("#6b1f2a");
    for (y = 0; y < 6; y++) for (x = 0; x < 8; x++) {
      g.fillStyle = (x + y) % 2 ? "#d9a441" : "#1f4d6b";
      g.beginPath();
      g.arc(4 + x * 8, 4 + y * 8, 2.4, 0, Math.PI * 2);
      g.fill();
    }
    break;
  case "drive":
    // A program of the user's own that names no picture, shown as a prompt waiting for code
    fill("#1c1f22");
    g.fillStyle = "#8a93a0";
    g.font = "bold 16px monospace";
    g.fillText(">_", 22, 30);
    break;
  case "servo":
  case "motor":
    fill("#e9e6e0");
    g.strokeStyle = "#56708f";
    g.fillStyle = "#56708f";
    g.lineWidth = 3;
    if (kind === "servo") {
      g.fillRect(18, 22, 28, 16);
      g.beginPath(); g.moveTo(32, 22); g.lineTo(44, 8); g.stroke();
    } else {
      g.beginPath(); g.arc(32, 24, 13, 0, Math.PI * 2); g.stroke();
      for (i = 0; i < 6; i++) {
        g.beginPath(); g.moveTo(32, 24);
        g.lineTo(32 + Math.cos(i) * 13, 24 + Math.sin(i) * 13); g.stroke();
      }
    }
    break;
  default:
    fill("#ddd");
  }
}

function programThumb(path) {
  var offered = offeredAt(path);
  var file = path.split("/").pop().replace(/\.py$/, "");
  var kind = offered && THUMBS[file + "-2"] ? "pair:" + file
           : offered && THUMBS[file] ? "shot:" + file
           : offered ? offered[1] : DRIVE_PICTURES[path] ? "picture:" + path : "drive";
  return thumbCanvas(kind, path.length, usesOf(path));
}

// ---- the program page ------------------------------------------------------------------------

var programView = null;

// Whether the program tab is open. A program is chosen only by picking one, so the tab can be open
// with none chosen, and the file says program= only once one is
var onProgramPage = false;

// A program as a card, as the looks are, its thumbnail over its name, and what it uses as a row
// of small drawings along the foot of the thumbnail
function programCard(path) {
  var card = document.createElement("button");
  card.type = "button";
  card.className = "progcard" + (boardSet.program === path ? " picked" : "");
  card.dataset.path = path;
  card.appendChild(programThumb(path));
  var uses = usesOf(path);
  if (uses.length) {
    var row = document.createElement("span");
    row.className = "proguses";
    uses.forEach(function (key) { row.appendChild(featureIcon(key)); });
    card.appendChild(row);
  }
  var name = document.createElement("span");
  name.className = "progname";
  name.textContent = programTitle(path);
  card.appendChild(name);
  card.title = ((programNamed(path) || {}).does || "") + (uses.length ? "\nUses " +
    uses.map(function (key) { return featureNamed(key)[1]; }).join(", ") : "");
  // Picked again, the program is put back, leaving none chosen
  card.onclick = function () {
    boardSet.program = boardSet.program === path ? null : path;
    if (boardSet.program) boardSet.lastProgram = path;
    draw();
  };
  return card;
}

// The screen size a program is shown on: the one it is given, else screen A's, else a 2.8"
function sizeShown(path) {
  var program = programNamed(path) || {};
  var at = (program.onDrive ? [] : program.args || []).map(function (argument) {
    return argument.kind;
  }).indexOf("size");
  var given = at >= 0 ? (boardSet.args[path] || [])[at] : null;
  var screen = state.screens && state.screens.A;
  return given || (screen && screen.there && screen.size) || "2.8";
}

// One captured frame on a module at the program's screen size, turned as the program turns it
function framedPanel(path, url) {
  var image = thumbImages[url];
  var upright = image && image.height > image.width;
  return panelPreview({size: sizeShown(path), turn: upright ? 0 : 90,
                       art: {url: url, w: upright ? 240 : 320, h: upright ? 320 : 240,
                             pixelated: true}});
}

// The picked program's picture: a screen program's captured frame on the panel it would play on,
// as the Screens tab draws one, turned as the program turns it, and anything else its thumbnail
// large. A frame taller than wide was taken from a panel upright
function programPicture(path) {
  var file = path.split("/").pop().replace(/\.py$/, "");
  var onScreen = usesOf(path).some(function (key) {
    return ["screen", "either", "pair", "hub"].indexOf(key) >= 0;
  });
  if (onScreen && THUMBS[file]) {
    // A pair's second frame goes on a second panel, the two drawn smaller to stand side by side
    if (!THUMBS[file + "-2"]) return framedPanel(path, THUMBS[file]);
    var both = document.createElement("div");
    both.className = "twopanels";
    both.appendChild(framedPanel(path, THUMBS[file]));
    both.appendChild(framedPanel(path, THUMBS[file + "-2"]));
    return both;
  }
  var big = programThumb(path);
  big.classList.add("big");
  return big;
}

// The picture before a program is chosen: an empty panel upright, so its words read across, or on
// a board without screens its lamps unlit
function emptyPicture() {
  if (SCREEN_PORTS.length) return panelPreview({size: "2.8", turn: 0});
  var big = thumbCanvas("lamps:off", 1);
  big.classList.add("big");
  return big;
}

// The line along the preview's top, saying what the board runs, with the way to choose none
function heroNote(path) {
  var note = document.createElement("div");
  note.className = "programnote";
  note.appendChild(boardIcon());
  var said = document.createElement("span");
  said.textContent = path
    ? "The board runs " + path.split("/").pop() + " in place of the effects. They are kept, and " +
      "play if it is missing or stops, when errors.txt says why."
    : "No program chosen, so the board plays the effects. Pick one below to run it in their place.";
  note.appendChild(said);
  if (path) {
    var none = document.createElement("button");
    none.type = "button";
    none.className = "progchoosenone";
    none.textContent = "Choose none";
    none.onclick = function () {
      boardSet.program = null;
      draw();
    };
    note.appendChild(none);
  }
  return note;
}

// The picked program large, with what it does, what it needs and what it takes. With none picked
// the box keeps its size, an empty panel in the picture's place, so choosing one moves nothing
function programHero(path) {
  var hero = document.createElement("div");
  hero.className = "proghero" + (path ? "" : " unchosen");
  hero.appendChild(heroNote(path));
  var body = document.createElement("div");
  body.className = "herobody";
  hero.appendChild(body);
  var picture = document.createElement("div");
  picture.className = "progpicture";
  picture.appendChild(path ? programPicture(path) : emptyPicture());
  body.appendChild(picture);
  if (!path) {
    var waiting = document.createElement("div");
    waiting.className = "progwords";
    var taken = ["outputs"];
    if (SCREEN_PORTS.length) taken.push(SCREEN_PORTS.length > 1 ? "screens" : "screen");
    if (BOARD.sound) taken.push("sound");
    waiting.innerHTML = "<h3>Choose a program</h3><p>Each takes the whole board, its " +
                        spoken(taken) + ", while it runs.</p>";
    body.appendChild(waiting);
    return hero;
  }
  var words = document.createElement("div");
  words.className = "progwords";
  var program = programNamed(path) || {};
  words.innerHTML = "<h3>" + escapeHtml(programTitle(path)) + "</h3>" +
                    "<p>" + escapeHtml(program.does || "Says nothing about itself.") + "</p>" +
                    "<p class='progwhere'>" + escapeHtml(path) +
                    (program.onDrive ? ", on the drive" : ", comes with the board") + "</p>";
  // What it uses, each drawn and named, as the filter below names them
  var uses = document.createElement("div");
  uses.className = "herouses";
  usesOf(path).forEach(function (key) {
    var one = document.createElement("span");
    one.appendChild(featureIcon(key));
    one.appendChild(document.createTextNode(featureNamed(key)[1]));
    uses.appendChild(one);
  });
  if (uses.children.length) words.appendChild(uses);
  words.appendChild(argsFor(path, false));
  body.appendChild(words);
  return hero;
}

function renderProgramView() {
  programView.textContent = "";
  if (!onProgramPage) return;
  programView.appendChild(programHero(boardSet.program));
  programView.appendChild(featureFilter());
  var shown = 0;
  function group(title, paths) {
    var kept = paths.filter(passesFilter);
    if (!kept.length) return;
    shown += kept.length;
    var heading = document.createElement("div");
    heading.className = "gallery-head";
    heading.appendChild(document.createTextNode(title));
    if (GROUP_SAYS[title]) {
      var says = document.createElement("span");
      says.className = "says";
      says.textContent = GROUP_SAYS[title];
      heading.appendChild(says);
    }
    programView.appendChild(heading);
    var grid = document.createElement("div");
    grid.className = "proggrid";
    kept.forEach(function (path) { grid.appendChild(programCard(path)); });
    programView.appendChild(grid);
  }
  group("On the drive", DRIVE_PROGRAMS.map(function (one) { return one[0]; }));
  OFFERED.forEach(function (set) {
    group(set[0], set[1].map(function (entry) { return "examples/" + entry[0]; }));
  });
  if (!shown) {
    var none = document.createElement("p");
    none.className = "prognone";
    none.textContent = "Every program here needs something not ticked.";
    programView.appendChild(none);
  }
}

// ---- choosing by what is to hand ----------------------------------------------------------------
// A chip for each thing an offered program can use, all on to begin with. A chip turned off is
// something not to hand, so every program needing it goes, and a program stays only while all it
// uses is on. One screen or two is had with either a screen or two, so it has no chip of its own,
// and every board has its outputs and its Boot button, and an RGB output where it has one, so
// none of those has one

var CHIPLESS = ["either", "outputs", "rgb", "button"];

var unhad = [];

function had(key) { return unhad.indexOf(key) < 0; }

function passesFilter(path) {
  return usesOf(path).every(function (key) {
    return key === "either" ? had("screen") || had("pair") : had(key);
  });
}

function loadThumbs(sources) {

  sources.forEach(function (src) {
    if (thumbImages[src]) return;
    var image = thumbImages[src] = new Image();
    waiting++;
    image.onload = image.onerror = function () {

// Split under the header, the tabs stand over the page's column. Where the window is wide
// enough for the name to fit left of that column and the rest right of it, all three share one
// line, measured, since what fits depends on the name and on which buttons show
var COLUMN_REM = 57.2;

function headerOnOneLine() {
  var header = document.querySelector("header");
  header.classList.remove("oneline");
  var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  var style = getComputedStyle(header);
  var inner = header.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  var gap = rem;
  var side = (inner - COLUMN_REM * rem) / 2 - gap;
  var name = document.querySelector("header h1").scrollWidth;
  // The group's width as it sits, first shown to last, so a button joined to another counts once.
  // What is laid over the page, such as an open menu, takes no room in the line
  var shown = Array.prototype.filter.call(document.getElementById("headActions").children,
    function (one) {
      return one.offsetWidth && getComputedStyle(one).position !== "absolute";
    });
  var rest = shown.length ? shown[shown.length - 1].getBoundingClientRect().right -
                            shown[0].getBoundingClientRect().left : 0;
  // The space below the buttons matches the header's top padding, measured to its outer edge so
  // its bottom border counts, and the tabs reach from the buttons' top to that edge. The tabs
  // keep that height on two rows too, so moving between one and two changes nothing
  var above = parseFloat(style.paddingTop);
  var border = parseFloat(style.borderBottomWidth) || 0;
  // Its exact height, a whole-pixel one leaving the spacing half a pixel out
  var button = document.getElementById("open").getBoundingClientRect().height;
  header.style.setProperty("--headgap", (above - border) + "px");
  header.style.setProperty("--buttonheight", button + "px");
  header.style.setProperty("--tabheight", (button + above) + "px");
  // A little to spare, as the group's borders and the arrow's join round up
  if (name <= side && rest + 8 <= side) header.classList.add("oneline");
}

// is a card made small at the end of the first heading, where there is always room for it.

var LOOK_GROUPS = [
  {name: "Along the lights", says: "travelling from one end to the other",
   looks: ["Rainbow", "Wave", "Scanner", "Chase", "Marquee"]},
  {name: "Ready-made", says: "made from the other looks",

];

// The gallery's cards gathered under the groups' headings, in the groups' order
function groupGallery() {
  var flat = document.querySelector("#looks .gallery");

  var cards = {};

  var groups = LOOK_GROUPS.map(function (group) {
    return {name: group.name, says: group.says,
            looks: group.looks.filter(function (name) { return cards[name]; })};
  });
  var rest = order.filter(function (name) { return named.indexOf(name) < 0; });
  if (rest.length) groups.push({name: "More", says: "", looks: rest});
  groups = groups.filter(function (group) { return group.looks.length; });

  var holder = document.createElement("div");

// ---- the figure beside each slider --------------------------------------------------------
// Each slider can show beside it the value the file writes, with its unit, in a box that takes
// one typed in. Typed within the slider's reach, the slider moves to it; typed past an end,
// the slider sits at that end and the value is kept as typed, so the file writes exactly it.
// The figures are in a drawer at the right of the sliders, shut until opened, one for the
// whole panel, and a viewer's page remembers which way they left it.
//
// Every figure rises as its slider goes right, as the setting does. So a speed set as
// an interval between steps is shown as how many times a second, and a signal's as how fast
// it runs against a real one. A slider moving several settings shows the first of its keys it
// changes, the rest following it. A wave's speed is shown without its sign, which way it runs
// being Reverse's to say.

document.body.classList.add("figures");

// The settings a slider may be shown by, in the order they are looked for
var FIGURE_KEYS = {
  pace: ["speed", "interval", "green_interval", "bright_max"],
  mood: ["length", "sat", "steps", "dimness", "duty", "flashes", "ease", "fade"]
};

// A real signal's green interval, which a signal's speed is shown against
var SIGNAL_GREEN = {"Traffic light": 12, "Pelican crossing": 20};

// How a setting's value is shown, the figure rising as the slider does, and taken back
function figureWay(key, look) {
  var times = {unit: "/s", show: function (v) { return 1 / v; },
               take: function (f) { return 1 / f; }};
  var same = function (unit) {
    return {unit: unit, show: function (v) { return v; }, take: function (f) { return f; }};
  };
  var percent = {unit: "%", show: function (v) { return v * 100; },
                 take: function (f) { return f / 100; }};
  if (key === "speed") return same("/s");
  if (key === "interval" || key === "bright_max") return times;
  if (key === "green_interval") {
    var real = SIGNAL_GREEN[look.name] || 12;
    return {unit: "\u00d7", show: function (v) { return real / v; },
            take: function (f) { return real / f; }};
  }
  if (key === "length") return same("lights");
  if (key === "ease" || key === "fade") return same("s");
  if (["sat", "dimness", "duty"].indexOf(key) >= 0) return percent;
  return same("");
}

// Whether the drawer is open, which a viewer's page keeps between visits
var FIGURES_KEPT = "fx-picker-figures-open";
var figuresOpen = false;
try {
  figuresOpen = window.localStorage.getItem(FIGURES_KEPT) === "1";
} catch (e) {
  figuresOpen = false;
}

// The typed values of the stretch whose lines are being written, which linesFor applies
var exactNow = null;

// Both ways a stretch's lines are asked for carry its typed values: the file and the preview
function withExact(exact, write) {
  var had = exactNow;
  exactNow = exact || null;
  try {
    return write();
  } finally {
    exactNow = had;
  }
}

// A setting's value in a stretch's lines, without its sign, or null where none names it. A
// fade is read as its fall, the part after its bar, which is what a trail is
function settingIn(lines, key) {
  var setting = new RegExp("(^|\\s)" + key + "=(?:[\\d.]+\\|)?(-?[\\d.]+)");
  for (var at = 0; at < lines.length; at++) {
    var found = lines[at].match(setting);
    if (found) return Math.abs(Number(found[2]));
  }
  return null;
}

// The stretch's lines with one slider at a value and nothing typed
function linesAt(run, section, look, slider, value) {
  var at = Object.assign({}, section, {exact: null});
  at[slider] = value;
  return sectionLines(run, at, look);
}

// The setting a slider moves, the first of its keys whose value it changes
function figureKey(run, section, look, slider) {
  var low = linesAt(run, section, look, slider, 0);
  var high = linesAt(run, section, look, slider, 1);
  return FIGURE_KEYS[slider].filter(function (key) {
    return settingIn(low, key) !== null && settingIn(low, key) !== settingIn(high, key);
  })[0] || null;
}

function figureSaid(value) {
  return String(Math.round(value * 100) / 100);
}

// The slider's place that writes nearest a value, looked for along its whole reach. Past its
// reach the slider sits at the nearer end, not at the first place that rounds to it
function placeFor(run, section, look, slider, key, value) {
  var best = 0, nearest = Infinity;
  for (var step = 0; step <= 200; step++) {
    var place = step / 200;
    var gives = settingIn(linesAt(run, section, look, slider, place), key);
    if (gives !== null && Math.abs(gives - value) < nearest) {
      nearest = Math.abs(gives - value);
      best = place;
    }
  }
  if (nearest > 1e-6) {
    var low = settingIn(linesAt(run, section, look, slider, 0), key);
    var high = settingIn(linesAt(run, section, look, slider, 1), key);
    best = Math.abs(low - value) < Math.abs(high - value) ? 0 : 1;
  }
  return {place: best, off: nearest};
}

// A palette's colours, a swatch for each its lines name, drawn afresh as its slider moves
function paintPalette(swatches, lines) {
  swatches.textContent = "";
  (lines.join(" ").match(/colour=[^\s:]+/g) || []).forEach(function (said) {
    var chip = document.createElement("span");
    chip.className = "repeatchip";
    chip.style.background = inkOf(said.slice(7));
    chip.title = said.slice(7);
    swatches.appendChild(chip);
  });
}

// The box a figure is typed in and its unit, each a cell of the sliders' grid
function figureCells(said, unit, title, take) {
  var box = document.createElement("input");
  box.type = "text";
  box.inputMode = "decimal";
  box.className = "figurebox";
  box.value = said;
  box.title = title;
  box.onchange = function () {
    var typed = parseFloat(box.value.replace(",", "."));
    if (!(typed > 0)) {
      box.value = said;
      return;
    }
    take(typed);
    draw();
  };
  var units = document.createElement("span");
  units.className = "figureunit";
  units.textContent = unit;
  return [box, units];
}

chosenSteps.push(function (where, run) {
  var box = document.getElementById(where);
  var section = run && run.sections[run.picked];
  var look = section && lookNamed(section.look);
  var tuning = box && box.querySelector(".chosen .tuning");
  if (!tuning || !look) return;
  function live() { return run.sections[run.picked]; }
  tuning.classList.toggle("figuresopen", figuresOpen);

  var ranges = Array.prototype.slice.call(tuning.querySelectorAll("input[type=range]"));
  var boxes = [];
  ranges.forEach(function (range) {
    var slider = (range.dataset.focus || "").split("-").pop();
    var cells, way = null, key = null, widest = 3;
    var timing = range.dataset.timing;
    if (timing) {
      // A signal's timing is its seconds already, typed past the slider's ends as it is
      widest = Math.max(String(range.min).length, String(range.max).length) + 2;
      cells = figureCells(figureSaid(Number(range.value)), "s",
                          "seconds, typed exactly, past the slider's ends too", function (typed) {
        var mine = live();
        mine.timings = Object.assign({}, mine.timings);
        mine.timings[timing] = Math.round(typed * 100) / 100;
      });
    } else if (slider === "mood" && look.mood === "Palette") {
      // A palette is its colours, not a number, so its slot shows them
      var swatches = document.createElement("span");
      swatches.className = "figurebox paletteswatches";
      paintPalette(swatches, sectionLines(run, section, look));
      // Across the box and unit columns, from where the boxes start, being wider than a box
      swatches.style.gridColumn = "span 2";
      cells = [swatches, null];
    } else if (slider === "level") {
      var bright = section.level === undefined ? 1 : section.level;
      cells = figureCells(String(Math.round(bright * 100)), "%",
                          "how bright, typed as a percentage", function (typed) {
        live().level = Math.max(0.01, Math.min(1, typed / 100));
      });
    } else if (slider === "pace" || slider === "mood") {
      key = figureKey(run, section, look, slider);
      if (key) {
        way = figureWay(key, look);
        // As wide as the widest figure the slider can reach, so dragging it never resizes its
        // column and with it the slider
        [0, 0.5, 1].forEach(function (place) {
          var reach = figureSaid(way.show(settingIn(linesAt(run, section, look, slider, place),
                                                   key)));
          widest = Math.max(widest, reach.length);
        });
        var typedHere = section.exact && section.exact[slider];
        var value = typedHere ? typedHere.value : settingIn(sectionLines(run, section, look), key);
        cells = figureCells(figureSaid(way.show(value)), way.unit,
                            "the file's " + key + ", typed exactly, past the slider's ends too",
                            function (typed) {
          var wanted = way.take(typed);
          var mine = live();
          var found = placeFor(run, mine, look, slider, key, wanted);
          mine[slider] = found.place;
          mine.exact = Object.assign({}, mine.exact);
          if (found.off > 1e-6) {
            mine.exact[slider] = {key: key, value: Math.round(wanted * 1000) / 1000};
          } else {
            delete mine.exact[slider];
          }
        });
      }
    } else {
      return;
    }
    // A slider with no one figure keeps its row's cells, empty, so the columns stay whole
    if (!cells) {
      cells = [document.createElement("span"), document.createElement("span")];
      cells[0].className = "figurebox";
      cells[1].className = "figureunit";
    }
    // A figure typed past the slider's end, wider than any it reaches, widens it to fit
    if (cells[0].tagName === "INPUT") {
      boxes.push({box: cells[0], chars: Math.max(widest, String(cells[0].value || "").length)});
    }
    if (cells[1]) range.parentNode.insertBefore(cells[1], range.nextSibling);
    range.parentNode.insertBefore(cells[0], range.nextSibling);

    // Moved, the slider is the setting again, and its figure follows it
    var moved = range.oninput;
    range.oninput = function () {
      var mine = live();
      if (mine.exact && mine.exact[slider]) {
        mine.exact = Object.assign({}, mine.exact);
        delete mine.exact[slider];
      }
      if (moved) moved.call(range);
      if (cells[0].classList.contains("paletteswatches")) {
        paintPalette(cells[0], sectionLines(run, mine, look));
        return;
      }
      if (cells[0].tagName !== "INPUT") return;
      if (timing) cells[0].value = figureSaid(Number(range.value));
      else if (slider === "level") cells[0].value = String(Math.round(Number(range.value) * 100));
      else cells[0].value = figureSaid(way.show(settingIn(sectionLines(run, mine, look), key)));
    };
  });

  // Every box in the panel as wide as the widest, so they line up and none moves as it changes
  var chars = boxes.reduce(function (most, one) { return Math.max(most, one.chars); }, 3);
  boxes.forEach(function (one) { one.box.style.width = (chars + 0.5) + "ch"; });

  // The drawer's handle, down the right of the sliders, which opens and shuts every figure
  var handle = document.createElement("button");
  handle.type = "button";
  handle.className = "figurehandle";
  handle.textContent = figuresOpen ? "\u203a" : "\u2039";
  handle.title = figuresOpen ? "hide the figures" : "show each setting's figure, to type one in";
  handle.setAttribute("aria-expanded", figuresOpen ? "true" : "false");
  handle.style.gridRow = "1 / span " + ranges.length;
  handle.onclick = function () {
    figuresOpen = !figuresOpen;
    try {
      window.localStorage.setItem(FIGURES_KEPT, figuresOpen ? "1" : "0");
    } catch (e) {
      // Kept only for this visit where the page may not keep anything
    }
    draw();
  };
  tuning.appendChild(handle);
});

// ---- the drive's files ---------------------------------------------------------------------------
// The files on the FX drive: a walk of the drive that each part's own files are found in, adding
// files to it from this computer and deleting them from it.

state.fileHandle = null;
state.scanned = false;

var scanBusy = false;

async function scanMedia(dir) {
  // One walk at a time, built aside and landed whole, so a redraw mid-scan never sees half a
  // drive and two walks can never lace their findings together
  if (scanBusy) return;
  scanBusy = true;
  driveParts.forEach(function (part) { if (part.begin) part.begin(); });
  try {
    for await (var pair of dir.entries()) {
      var name = pair[0], handle = pair[1];
      if (handle.kind !== "file" && name === "System Volume Information") continue;
      for (var at = 0; at < driveParts.length; at++) {
        var part = driveParts[at];
        var take = handle.kind === "file" ? part.file : part.folder;
        if (take && await take(name, handle)) break;
      }
    }
  } finally {
    scanBusy = false;
  }
  driveParts.forEach(function (part) { if (part.land) part.land(); });
  state.scanned = true;
}

function driveSaid() {
  return JSON.stringify(driveParts.map(function (part) { return part.said ? part.said() : ""; }));
}

async function rescanMedia() {
  if (!state.dirHandle || scanBusy) return;
  var was = driveSaid();
  try {
    await scanMedia(state.dirHandle);
  } catch (e) {
    return;
  }
  if (driveSaid() !== was) draw();
}

function adderTile(label, kinds, what, takes) {
  var tile = document.createElement("button");
  tile.className = "adder";
  tile.innerHTML = "<svg width='13' height='13' viewBox='0 0 11 11'><path d='M5.5 1 " +
                   "L5.5 10 M1 5.5 L10 5.5' stroke='currentColor' stroke-width='1.8' " +
                   "stroke-linecap='round'/></svg>" + label;
  tile.title = "Copy files from this computer onto the FX drive";
  tile.onclick = function () { addFiles(kinds, what, takes); };
  return tile;
}

function binButton(name, kind) {
  if (!CAN_REACH_A_DRIVE) return document.createTextNode("");
  var bin = document.createElement("span");
  bin.className = "bin";
  bin.textContent = "\u00d7";
  bin.title = "Delete " + name + " from the FX drive";
  bin.onclick = function (e) {
    e.stopPropagation();

  };

async function addFiles(kinds, what, takes) {
  var picked;
  try {
    picked = await window.showOpenFilePicker({multiple: true, types: [kinds],
                                              excludeAcceptAllOption: true});
  } catch (e) {
    // A dismissed dialog says nothing. Anything else is the browser refusing the files
    if (e.name !== "AbortError")
      banner("The browser would not open those files (" + e.message + "). Copy them to " +
             "another folder, such as Downloads, and add them from there.", true);
    return;
  }
  var landed = 0;
  var arrived = [];
  var refused = [];
  for (var i = 0; i < picked.length; i++) {
    var file;
    try {
      // The dialog filters, and this holds where a platform's does not: a kind
      // the board cannot play never reaches the drive
      if (!takes.test(picked[i].name)) {
        refused.push(picked[i].name + " (not a kind the board plays)");
        continue;
      }
      file = await picked[i].getFile();
      var existing = null;
      try { existing = await state.dirHandle.getFileHandle(file.name); } catch (e) {}
      if (existing && !confirm(file.name + " is already on the drive. Replace it?"))
        continue;
      var handle = await state.dirHandle.getFileHandle(file.name, {create: true});
      var writable = await handle.createWritable();
      await writable.write(file);
      await writable.close();
      landed++;
      arrived.push(file.name);
    } catch (e) {
      refused.push(file ? file.name : "a file");
      if (e.name === "QuotaExceededError") {
        refused = refused.concat(picked.slice(i + 1).map(function (p) { return p.name; }));
        banner("The FX drive filled up: " + landed + " " + what + " copied, no room for " +
               refused.join(", ") + ". Delete something from it and try again.", true);
        break;
      }
    }
  }
  try { await scanMedia(state.dirHandle); } catch (e) {}
  // A Python file is offered only where its opening string makes it a drawing
  var unoffered = arrived.filter(function (name) {
    return /\.py$/i.test(name) && !mediaNamed(name);
  });
  if (refused.length && landed)
    banner(landed + " copied; these did not arrive: " + refused.join(", "), true);
  else if (refused.length)
    banner("Nothing arrived: " + refused.join(", "), true);
  else if (unoffered.length)
    banner(unoffered.join(", ") + " copied, but only a drawing is offered here, and a " +
           "drawing's opening string starts with Drawing: and its name.", true);
  else if (landed)
    banner(landed + " " + what + " copied to the drive.");
  draw();
}

async function removeFromDrive(name, kind) {
  var said = kind === "folder"
    ? "Delete the folder " + name + " and every picture in it from the FX drive?"
    : "Delete " + name + " from the FX drive?";
  if (!confirm(said)) return;
  try {
    await state.dirHandle.removeEntry(name, {recursive: kind === "folder"});
  } catch (e) {
    banner("Could not delete " + name + ": " + e.name + ". Is the drive showing?", true);
    return;
  }
  store();
  driveParts.forEach(function (part) {
    if (!part.forget) return;
    part.forget(name);
    apply(slotAt(state.at).body);
  });
  try { await scanMedia(state.dirHandle); } catch (e) {}
  draw();
  driveParts.forEach(function (part) { if (part.gone) part.gone(name); });
}

// The file starts folded, there for anyone who opens it
