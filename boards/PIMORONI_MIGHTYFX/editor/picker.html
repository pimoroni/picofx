  // for. It is the colour as written, at the stretch's brightness, as a screen's background
  // has it: one typed in sets the colour and the brightness both
  var typed = document.createElement("div");
  typed.className = "hexline";
  var label = document.createElement("label");
  label.textContent = "Hex";
  typed.appendChild(label);
  var hex = document.createElement("input");
  hex.type = "text";
  hex.maxLength = 7;
  hex.spellcheck = false;
  hex.value = atBrightness(section.colour || "#ffffff", section.level);
  hex.title = "the colour as it is written, at its brightness. Paste one in and its hue " +
              "and depth land on the field, and how bright it is on the brightness below";
  hex.oninput = function () {
    var said = hex.value.replace("#", "").trim();
    if (!/^[0-9a-fA-F]{6}$/.test(said)) return;
    var typedRgb = hexRgb("#" + said.toLowerCase());
    var got = takeApart(typedRgb);
    var rgb = fieldColour(got.hue, got.sat);
    live().colour = "#" + hexOf(rgb);
    live().level = Math.max(FAINTEST, Math.max.apply(null, typedRgb) / 255);
    live().custom = true;
    at.style.left = (got.hue / 360 * 100) + "%";
    at.style.top = ((1 - got.sat) * 100) + "%";
    at.style.background = rgbInk(rgb);
    preview.style.background = "#" + said.toLowerCase();
    renderPreview();
  };
  hex.onblur = function () { draw(); };
  typed.appendChild(hex);

  // Beside the field, the hex over the colour itself, as large as the room allows, as a
  // screen's custom background has it
  var side = document.createElement("div");
  side.className = "scustomside";
  side.appendChild(typed);
  var preview = document.createElement("div");
  preview.className = "scustompreview";
  preview.style.background = atBrightness(section.colour || "#ffffff", section.level);
  preview.title = "The colour as it is written, at its brightness";
  side.appendChild(preview);
  holds.appendChild(side);
  wrap.appendChild(holds);

  box.appendChild(wrap);
}

// A hue at full value, brought toward white by how far the saturation is from full
function fieldColour(hue, sat) {
  return hueRgb(hue).map(function (v) { return Math.round(v + (255 - v) * (1 - sat)); });
}

// The stretch's settings, with the colour choice in place of a slider that stepped tones
var oneRenderChosen = renderChosen;

// A second setting that is a count, such as Emergency's flashes, stops only at its values,
// with a tick at each while there are few enough to tell apart
var MOST_TICKS = 16;

function detented(box, where, count) {
  var range = box.querySelector("input[data-focus='" + where + "-mood']");
  if (!range || count < 2) return;
  range.step = 1 / (count - 1);
  if (count > MOST_TICKS) return;
  var ticks = document.createElement("datalist");
  ticks.id = where + "-detents";
  for (var at = 0; at < count; at++) {
    var tick = document.createElement("option");
    tick.value = at / (count - 1);
    ticks.appendChild(tick);
  }
  range.parentNode.appendChild(ticks);
  range.setAttribute("list", ticks.id);
}

renderChosen = function (where, run) {
  oneRenderChosen(where, run);
  var box = document.getElementById(where);
  var section = run && run.sections[run.picked];
  var look = section && lookNamed(section.look);
  var memo = box && section && standingIn(run, section);
  if (memo) {
    var note = document.createElement("div");
    note.className = "standin";
    note.textContent = look.name + ", in place of " + memo.look + ", which mono lights " +
                       "cannot play. Put back, it plays " + memo.look + " again.";
    box.querySelector(".chosen").appendChild(note);
  }
  // A count of stops may depend on the stretch, as Spread's lengths do on its lights
  if (box && look && look.detents) {
    detented(box, where, typeof look.detents === "function"
      ? look.detents(targetFor(run, section)) : look.detents);
  }
  var wrap = box && box.querySelector(".chosen");
  if (!wrap || !look) return;
  var tuning = wrap.querySelector(".tuning");
  if (!tuning) {
    tuning = document.createElement("div");
    tuning.className = "tuning";
    wrap.appendChild(tuning);
  }
  // Solid's own slider was its brightness, which the one every look has now is
  if (look.solid) tuning.textContent = "";
  // A mono lamp has no colour to be given
  var first = run.lamps[section.from];
  var coloured = takesColour(look) && !!first && first.colour;
  // The second slider stepped a table of tones for these looks, and the swatches take
  // its place. On mono lights it has nothing to set, a mono light having no colour
  var mono = !!first && !first.colour;
  var toneless = look.mood === "Colour" || (mono && look.mood === "Palette");

    tuning.removeChild(tuning.children[3]);
    tuning.removeChild(tuning.children[2]);

// ---- how bright a stretch is -------------------------------------------------------------
// Every look has a brightness, the first slider in the list, written only below full. A look
// given a custom colour writes it in that colour's hex, dimmed, as a screen's background is.
// Any other, a swatch's word included, writes it as the stretch's level=, which scales
// whatever the look plays
var FAINTEST = 0.05;

function atBrightness(hex, level) {
  if (!(level < 1)) return hex;
  return "#" + hexOf(hexRgb(hex).map(function (v) { return Math.round(v * level); }));
}

// Whether this stretch is given a custom colour here, so its brightness goes into the hex
function coloursItself(run, section, look) {
  var first = run.lamps[section.from];
  var custom = section.custom || !wordFor(section.colour || "#ffffff");
  return takesColour(look) && !!first && first.colour && custom;
}

var oneSectionLines = sectionLines;

sectionLines = function (run, section, look) {
  if (!coloursItself(run, section, look) || !(section.level < 1))
    return oneSectionLines(run, section, look);

                  atBrightness(section.colour || "#ffffff", section.level));
};

function brightnessSlider(tuning, run, where) {
  var section = run.sections[run.picked];
  var ahead = tuning.firstChild;
  var label = document.createElement("label");
  label.textContent = "Brightness";
  tuning.insertBefore(label, ahead);
  var range = document.createElement("input");
  range.type = "range";
  range.min = FAINTEST;
  range.max = 1;
  range.step = 0.01;
  range.value = section.level === undefined ? 1 : section.level;
  range.dataset.focus = where + "-level";
  range.oninput = function () {
    run.sections[run.picked].level = Number(range.value);
    renderPreview();
  };
  // A colour's hex and its preview show the brightness, so they are drawn again once it is set
  range.onchange = function () { draw(); };
  tuning.insertBefore(range, ahead);
}

// Solid is written at full, its brightness being the stretch's own
var oneSolidLines = linesFor;

linesFor = function (look, target, pace, mood, colour) {
  if (!look || !look.solid) return oneSolidLines(look, target, pace, mood, colour);
  return oneSolidLines(look, target, pace, 1, colour).map(function (line) {
    return line.replace(/ brightness=1(?=\s|$)/, "");

};

// The preview plays a stretch at its brightness, as the board will. A card plays at full
var oneLevelPlay = livePlay;

livePlay = function (look, holder, t, slot, count, sim) {
  var lit = oneLevelPlay(look, holder, t, slot, count, sim);
  if (!lit || !holder || holder === MIDDLING || !(holder.level < 1)) return lit;
  return Object.assign({}, lit, {level: lit.level * holder.level});
};

// What a stretch writes, with the colour it was given. Solid already writes it. The looks
// whose slider stepped tones write a tone, so the colour they wrote is replaced with the
// chosen one, as a word where it is a swatch and as hex from the field
var oneLinesFor = linesFor;

linesFor = function (look, target, pace, mood, colour) {
  var lines = oneLinesFor(look, target, pace, mood, colour);
  if (!takesColour(look) || !target.colour || !colour) return lines;
  var word = wordFor(colour);
  var said = word || colour.replace("#", "").toLowerCase();
  return lines.map(function (line) {
    return line.replace(/colour=[^\s:]+/, "colour=" + said);
  });

// ---- which way a stretch runs --------------------------------------------------------------
// A stretch can start from its far end, which writes its lamps counting down. Only a look
// that differs from lamp to lamp can show it, so for the rest the toggle is greyed and the
// stretch is written as it runs

// The effects that give each lamp of an entry its place, and a length= does the same

// time runs, where a sweep, a counter and the signals begin at the start and go on from it.
// So that a stretch goes forward the same way whatever its look, the waves are written
// with their speed below zero, which the manual allows, and Reverse counts the lights down
var WAVES = ["rainbow_wave", "pulse_wave", "blink_wave", "flash_sequence"];

var oneWaveLines = linesFor;

linesFor = function (look, target, pace, mood, colour) {
  return oneWaveLines(look, target, pace, mood, colour).map(function (line) {
    var effect = (line.split(":")[1] || "").trim().split(/\s+/)[0];
    if (WAVES.indexOf(effect) < 0) return line;
    return line.replace(/ speed=(\d)/, " speed=-$1");
  });
};

// Party flashes its three sets a third of a beat apart, and the phases it was given, 0, 0.33

// each time. Swapped, its sets light in order, away from the start as every look goes

        return " phase=0." + (third === "33" ? "67" : "33");

  var at = ((t * num(s.speed, 1)) + pos / num(s.length, 1)) % 1;

  // A look that deals the stretch out, as Party and Emergency do, deals from the start
  if (lines.length > 1) return true;
  return lines.some(function (line) {
    var effect = (line.split(":")[1] || "").trim().split(/\s+/)[0];
    return TRAVELLING.indexOf(effect) >= 0 || / length=/.test(line);

// How many whole outputs from here run counting down with their channels blue, green, red,
// which a descending range with .* writes as one item
function wholeOutputsDown(lamps, at) {
  var count = 0;
  while (at + 3 * count + 2 < lamps.length) {
    var three = lamps.slice(at + 3 * count, at + 3 * count + 3);
    var out = lamps[at].out - count;
    var whole = three.every(function (lamp, i) {
      return !lamp.colour && lamp.out === out && lamp.channel === 2 - i;

function nameBackwards(lamps) {

    var outputs = wholeOutputsDown(lamps, at);
    if (outputs >= 2) {
      items.push((lamps[at].out + 1) + "-" + (lamps[at].out - outputs + 2) + ".*");
      at += 3 * outputs;
      continue;
    }
    var last = at;
    while (lamps[at].colour && last + 1 < lamps.length && lamps[last + 1].colour &&
           lamps[last + 1].out === lamps[last].out - 1) last++;
    items.push(last > at ? (lamps[at].out + 1) + "-" + (lamps[last].out + 1)
                         : shortSelector(lamps[at]));
    at = last + 1;
  }
  return "out" + items.join(",");
}

function shortSelector(lamp) {
  return lamp.colour ? String(lamp.out + 1) : (lamp.out + 1) + "." + CHANNELS[lamp.channel];
}

var oneWayTargetFor = targetFor;

targetFor = function (run, section) {
  var target = oneWayTargetFor(run, section);
  if (!section.reversed || !runsAWay(lookNamed(section.look), target, section)) return target;
  if (run.strip) {
    var whole = section.from === 0 && section.to === run.lamps.length - 1;
    return Object.assign(target, {
      selector: run.name + (whole ? run.lamps.length + "-1"
                                  : (section.to + 1) + "-" + (section.from + 1)),
      lights: target.lights.slice().reverse(), reversed: true});
  }
  var mine = run.lamps.slice(section.from, section.to + 1).reverse();
  target.selector = nameBackwards(mine);
  target.reversed = true;
  if (target.colour) {
    target.playing = mine.map(function (lamp) { return lamp.out + 1; });
  } else {
    target.nameSet = function (set) {
      return nameBackwards(set.map(function (at) { return mine[at]; }));
    };
  }
  return target;
};

// The preview plays a reversed stretch from its far end, as the board will
var oneWayPlay = livePlay;

livePlay = function (look, holder, t, slot, count, sim) {
  var backwards = holder && holder.reversed && count > 1 &&
                  runsAWay(look, lampTarget(count), holder);
  return oneWayPlay(look, holder, t, backwards ? count - 1 - slot : slot, count, sim);
};

// A light at the end the stretch starts from and an arrow the way it runs
// A toggle in the screens' style, its word and its pressed state as Loop's and Restart's are,
// the light in its icon at the end the stretch starts from
function directionToggle(run, section) {
  var button = document.createElement("button");
  button.type = "button";
  var look = lookNamed(section.look);
  var moves = runsAWay(look, oneWayTargetFor(run, section), section);
  button.className = "stoggle direction" + (section.reversed ? " reversed" : "") +
                     (section.reversed && moves ? " on" : "");
  button.setAttribute("aria-pressed", section.reversed && moves ? "true" : "false");
  button.disabled = !moves;
  button.title = !moves ? (!look ? "Which end it starts from, once it has a look that runs"
                                 : widthOf(section) < 2 ? "One light has no direction"
                                 : look.name + " looks the same from either end")
               : section.reversed ? "Starting from the far end, running back"
                                  : "Starting from the near end, running on";
  button.innerHTML = "<svg width='28' height='13' viewBox='0 0 28 13' aria-hidden='true'>" +
    (section.reversed
      ? "<rect x='19' y='2.5' width='8' height='8' rx='2' fill='currentColor'/>" +
        "<path d='M17 6.5 L11.5 6.5 M14 3.5 L11 6.5 L14 9.5'/>"
      : "<rect x='1' y='2.5' width='8' height='8' rx='2' fill='currentColor'/>" +
        "<path d='M11 6.5 L16.5 6.5 M14 3.5 L17 6.5 L14 9.5'/>") + "</svg> Reverse";
  // Through the run, as a page that makes the stretches afresh leaves this one behind
  button.onclick = function () {
    remember(run);
    var live = run.sections[run.picked];
    live.reversed = !live.reversed;
    draw();
  };
  return button;
}

// ---- what heads a stretch's settings ------------------------------------------------------------
// The look's name, the panel being its settings, then where it plays in words: outputs
// 1 to 7, LEDs 11 to 20 of the left strip, output 3's red and green. The file's selector is the
// file view's to show, and whether the lights are colour or mono the tab's

var CHANNEL_WORDS = {r: "red", g: "green", b: "blue"};

// A list said as English does: one, two and three
function spoken(items) {
  if (items.length < 2) return items.join("");
  return items.slice(0, -1).join(", ") + " and " + items[items.length - 1];
}

// Numbers as English says them: three or more climbing or falling by one are "a to b", and the
// rest are listed, so 1-7 is "1 to 7" and 5,6 is "5 and 6"
function numbersSaid(numbers) {
  var said = [];
  var at = 0;
  while (at < numbers.length) {
    var last = at;
    var step = numbers[at + 1] - numbers[at];
    if (step === 1 || step === -1) {
      while (last + 1 < numbers.length && numbers[last + 1] - numbers[last] === step) last++;
    }
    if (last - at >= 2) {
      said.push(numbers[at] + " to " + numbers[last]);
    } else {
      said = said.concat(numbers.slice(at, last + 1).map(String));
    }
    at = last + 1;
  }
  return spoken(said);
}

// A reversed stretch is said in the order it plays, from its far end, as the file writes it
function wherePlays(run, section, reversed) {
  var lamps = run.lamps.slice(section.from, section.to + 1);
  if (reversed) lamps.reverse();
  if (run.strip) {
    var from = section.from + 1, to = section.to + 1;
    if (reversed) {
      var swap = from;
      from = to;
      to = swap;
    }
    return (from === to ? "LED " + from : "LEDs " + from + " to " + to) + " of " + run.label;
  }
  if (lamps.every(function (lamp) { return lamp.colour; })) {
    var numbers = lamps.map(function (lamp) { return lamp.out + 1; });
    return (numbers.length === 1 ? "output " : "outputs ") + numbersSaid(numbers);
  }
  // Mono lights, each output's channels together, in the order they play
  var groups = [];
  lamps.forEach(function (lamp) {
    var last = groups[groups.length - 1];
    if (last && last.out === lamp.out) last.channels.push(lamp.channel);
    else groups.push({out: lamp.out, channels: [lamp.channel]});
  });
  return spoken(groups.map(function (group) {
    return "output " + (group.out + 1) + "'s " + spoken(group.channels.map(function (channel) {
      return CHANNEL_WORDS[CHANNELS[channel]];
    }));
  }));
}

// ---- a signal's states, drawn ----------------------------------------------------------------
// Each timing is named by the state it holds, drawn as the signal shows it: a head of three
// lamps, red, amber and green top to bottom, with those lit in their colour, and for a
// crossing the two figures beside it, the red one standing and the green one walking. Its
// slider takes the state's colour. The word stays beside the drawing
var SIGNAL_INK = {red: "#e8392c", amber: "#f5a623", green: "#20b35c", dark: "#3b3f44"};

// The lamps each state lights: 1 lit, 0 dark, "f" flashing
var SIGNAL_STATES = {
  "Traffic light": {red_interval: [1, 0, 0], red_amber_interval: [1, 1, 0],
                    green_interval: [0, 0, 1], amber_interval: [0, 1, 0]},
  "Pelican crossing": {red_interval: [1, 0, 0, 0, 1], flashing_interval: [0, "f", 0, 0, "f"],
                       green_interval: [0, 0, 1, 1, 0], amber_interval: [0, 1, 0, 1, 0]}
};

// A slider's tint, amber and green a shade deeper than the lamps: a browser gives a light
// accent a dark track, which read as a slider filled to its end
var SIGNAL_TINT = {red_interval: SIGNAL_INK.red, red_amber_interval: "#a86600",
                   green_interval: "#16894a", amber_interval: "#a86600",
                   flashing_interval: "#a86600"};

function signalFace(name, key) {
  var lit = SIGNAL_STATES[name][key];
  function lamp(state, ink) {
    if (!state) return SIGNAL_INK.dark;
    return ink;
  }
  function flashing(state) { return state === "f" ? " class='flashing'" : ""; }
  var head = [SIGNAL_INK.red, SIGNAL_INK.amber, SIGNAL_INK.green].map(function (ink, at) {
    return "<circle cx='6' cy='" + (4.5 + at * 6.5) + "' r='2.6' fill='" + lamp(lit[at], ink) +
           "'" + flashing(lit[at]) + "/>";
  }).join("");
  var wide = 12;
  var figures = "";
  // A crossing's pedestrian lights are drawn as its figures, the red one standing and the
  // green one walking, so they read as figures and not as a second head of lamps
  if (lit.length > 3) {
    wide = 22;
    var stand = lamp(lit[3], SIGNAL_INK.red), walk = lamp(lit[4], SIGNAL_INK.green);
    figures = "<rect x='12.5' y='1' width='9' height='22' rx='2' fill='#1c1f22'/>" +
      "<g fill='none' stroke-width='1.3' stroke-linecap='round' stroke='" + stand + "'" +
      flashing(lit[3]) + "><circle cx='17' cy='3.6' r='1.1' fill='" + stand + "' stroke='none'/>" +
      "<path d='M17 5.2 V8.6 M15.6 6.4 H18.4 M16.3 8.6 V11 M17.7 8.6 V11'/></g>" +
      "<g fill='none' stroke-width='1.3' stroke-linecap='round' stroke='" + walk + "'" +
      flashing(lit[4]) + "><circle cx='17.4' cy='13.6' r='1.1' fill='" + walk + "' stroke='none'/>" +
      "<path d='M17.2 15.2 L16.8 18.3 M15.6 16.8 L18.6 16 M16.8 18.3 L15.4 21 M16.8 18.3 " +
      "L18.6 20.8'/></g>";
  }
  return "<svg class='signalface' viewBox='0 0 " + wide + " 24' width='" + wide * 0.9 +
         "' height='21.6' aria-hidden='true'><rect x='1' y='0' width='10' height='24' rx='3' " +
         "fill='#1c1f22'/>" + head + figures + "</svg>";
}

// A signal's timings take Speed's place, each a slider in seconds under its own name
var oneTimingChosen = renderChosen;

renderChosen = function (where, run) {
  oneTimingChosen(where, run);
  var box = document.getElementById(where);
  var section = run && run.sections[run.picked];
  var look = section && lookNamed(section.look);
  var tuning = box && box.querySelector(".chosen .tuning");
  if (!tuning || !look || !SIGNAL_TIMINGS[look.name]) return;
  var speed = tuning.querySelector("input[data-focus='" + where + "-pace']");
  var after = speed ? speed.nextSibling : null;
  if (speed) {
    tuning.removeChild(speed.previousElementSibling);
    tuning.removeChild(speed);
  }
  // Ease is about every state, so it comes before them, after Brightness
  var ease = tuning.querySelector("input[data-focus='" + where + "-mood']");
  if (ease) {
    var easeLabel = ease.previousElementSibling;
    if (after === easeLabel) after = ease.nextSibling;
    tuning.insertBefore(easeLabel, after);
    tuning.insertBefore(ease, after);
    after = ease.nextSibling;
  }
  SIGNAL_TIMINGS[look.name].forEach(function (part) {
    var label = document.createElement("label");
    label.className = "signalstate";
    label.innerHTML = signalFace(look.name, part[0]) + "<span>" + part[1] + "</span>";
    var range = document.createElement("input");
    range.style.accentColor = SIGNAL_TINT[part[0]];
    range.type = "range";
    range.min = part[3];
    range.max = part[4];
    range.step = 0.5;
    range.value = withSection(section, function () { return timingOf(look.name, part[0]); });
    range.dataset.focus = where + "-timing-" + part[0];
    range.dataset.timing = part[0];
    range.title = "seconds, " + part[1].toLowerCase();
    range.oninput = function () {
      var mine = run.sections[run.picked];
      mine.timings = Object.assign({}, mine.timings);
      mine.timings[part[0]] = Number(range.value);
      renderPreview();
    };
    tuning.insertBefore(label, after);
    tuning.insertBefore(range, after);
  });
};

};

var oneIconChosen = renderChosen;

renderChosen = function (where, run) {
  oneIconChosen(where, run);
  var box = document.getElementById(where);
  var tuning = box && box.querySelector(".chosen .tuning");

var oneHeadChosen = renderChosen;

// ---- blinking through several colours -----------------------------------------------------
// Blink takes one colour or several. With several it blinks through them in turn, one a beat,
// which is picofx's rgb_blink. The list is the stretch's blinks, {colours, at}, at being the
// one the picker above is changing; a stretch with no list has the one colour it always had.
// A list is written with the words and hexes at full and the stretch's brightness as level=,
// rgb_blink taking one level for all of them.

var BLINK = "Blink";

// The colours a stretch blinks through, where it has more than one and plays them in colour
function blinkList(run, section) {
  var first = run && run.lamps[section.from];
  if (section.look !== BLINK || !section.blinks || section.blinks.colours.length < 2 ||
      !first || !first.colour) return null;
  return section.blinks.colours;
}

// A colour's word, black included, which a set of colours to blink through may hold
function blinkNamed(hex) {
  return hex.replace("#", "").toLowerCase() === "000000" ? "black" : wordFor(hex);
}

function blinkWord(hex) {
  return blinkNamed(hex) || hex.replace("#", "").toLowerCase();
}

// A set of colours offers black too, as a turn with the light off
var oneBlinkSwatches = swatchesFor;

swatchesFor = function (run, section) {
  var first = run && run.lamps[section.from];
  if (section.look === BLINK && section.blinks && section.blinks.colours.length > 1 &&
      first && first.colour) return ["black"].concat(SWATCHES);
  return oneBlinkSwatches(run, section);
};

var oneBlinkLines = sectionLines;

sectionLines = function (run, section, look) {
  var colours = blinkList(run, section);
  if (!colours) return oneBlinkLines(run, section, look);
  var line = targetFor(run, section).selector + ": rgb_blink colour=" +
             colours.map(blinkWord).join("|") + " speed=" + blinkSpeed(section.pace) +
             " duty=" + blinkDuty(section.mood);
  return levelled([line], section.level);
};

// rgb_blink moves to its next colour each time its beat comes round
COLOURED.rgb_blink = function (t, s) {
  var colours = String(s.colour || "red").split("|");
  var beats = Math.floor(t * num(s.speed, 1) + num(s.phase, 0));
  var which = ((beats % colours.length) + colours.length) % colours.length;
  return {level: EFFECTS.blink(t, s), ink: inkOf(colours[which])};
};

// The preview plays a list as the board will, a stretch holding its own list
var oneBlinkPlay = livePlay;

livePlay = function (look, holder, t, slot, count, sim) {
  var colours = holder && holder !== MIDDLING && look && look.name === BLINK &&
                holder.blinks && holder.blinks.colours.length > 1 ? holder.blinks.colours : null;
  if (!colours) return oneBlinkPlay(look, holder, t, slot, count, sim);
  var lit = COLOURED.rgb_blink(t, {colour: colours.map(blinkWord).join("|"),
                                   speed: blinkSpeed(holder.pace), duty: blinkDuty(holder.mood)});
  return {level: lit.level * (holder.level < 1 ? holder.level : 1), ink: lit.ink};
};

// The stretch is drawn in the colours it blinks through
var oneBlinkColours = coloursWritten;

coloursWritten = function (look, section, run) {
  var colours = blinkList(run, section);
  if (!colours) return oneBlinkColours(look, section, run);
  return colours.map(function (hex) { return rgbInk(hexRgb(hex)); });
};

// Above the swatches, the colours it blinks through, each a chip that the picker changes
// while it is chosen, with a way to add another and to take one away
var oneBlinkChosen = renderChosen;

renderChosen = function (where, run) {
  oneBlinkChosen(where, run);
  var box = document.getElementById(where);
  var section = run && run.sections[run.picked];
  var pick = box && box.querySelector(".chosen .colourpick");
  var first = section && run.lamps[section.from];
  if (!pick || section.look !== BLINK || !first || !first.colour) return;
  function live() { return run.sections[run.picked]; }
  var blinks = section.blinks || {colours: [section.colour || "#ff0000"], at: 0};
  blinks.colours[blinks.at] = section.colour;
  section.blinks = blinks;

  function choose(at) {
    var mine = live();
    mine.blinks.at = at;
    mine.colour = mine.blinks.colours[at];
    mine.custom = !blinkNamed(mine.colour);
    draw();
  }

  var row = document.createElement("div");
  row.className = "blinklist";
  var said = document.createElement("span");
  said.className = "blinksay";
  said.textContent = blinks.colours.length > 1 ? "Blinks through" : "Blinks in";
  row.appendChild(said);
  blinks.colours.forEach(function (hex, at) {
    var chip = document.createElement("button");
    chip.type = "button";
    chip.className = "blinkchip" + (at === blinks.at ? " on" : "");
    chip.style.setProperty("--chip", hex);
    chip.title = (at === blinks.at ? "the colour the picker below is changing, " : "change ") +
                 (blinkNamed(hex) || hex);
    chip.onclick = function () { choose(at); };
    row.appendChild(chip);
    if (blinks.colours.length > 1) {
      var drop = document.createElement("button");
      drop.type = "button";
      drop.className = "blinkdrop";
      drop.textContent = "\u00d7";
      drop.title = "stop blinking in " + (blinkNamed(hex) || hex);
      drop.onclick = function () {
        var mine = live();
        mine.blinks.colours.splice(at, 1);
        var left = mine.blinks.colours;
        mine.blinks.at = Math.min(mine.blinks.at, left.length - 1);
        mine.colour = left[mine.blinks.at];
        mine.custom = !blinkNamed(mine.colour);
        if (left.length === 1) mine.blinks = undefined;
        draw();
      };
      row.appendChild(drop);
    }
  });
  var more = document.createElement("button");
  more.type = "button";
  more.className = "blinkmore";
  more.textContent = "+ another colour";
  more.title = "blink through several colours in turn, one a beat";
  // The colour added is a copy of the last, a custom one included, to be changed from there
  more.onclick = function () {
    var mine = live();
    if (!mine.blinks) mine.blinks = {colours: [mine.colour], at: 0};
    var colours = mine.blinks.colours;
    colours.push(colours[colours.length - 1]);
    choose(colours.length - 1);
  };
  row.appendChild(more);
  pick.insertBefore(row, pick.firstChild);
};

draw();

// ---- the board, the same in every scene ------------------------------------------------
// How the board is built is the same in every scene: which outputs have an adapter
// fitted, how long each strip is, and which screen is plugged into each port. The pages
// built on this one differ only in where those are shown and when they can be changed.

// Which panel is plugged into each screen port, or none. Only the size is the board's:
// which way up it is mounted is left for when screens are settled
var SCREEN_PORTS = [{id: "screena", label: "Screen A"}, {id: "screenb", label: "Screen B"}];
// The sizes a panel can be, as the firmware takes them, the catalogue's hub being no panel size
var SCREEN_SIZES = CATALOGUE.board_settings.screena.filter(function (inches) {
  return inches !== "hub";
});
var screensFitted = {screena: "", screenb: ""};

// A scene holds its cutting and its looks, but not the wiring or where the lamps sit,
// which are the board's
var oneCapture = capture;
var oneApply = apply;

capture = function () {
  var body = oneCapture();
  delete body.wiring;
  delete body.order;
  return body;
};

apply = function (body) {
  oneApply(Object.assign({}, body, {wiring: wiring, order: order}));
};

// A step back in a scene is the scene's, so it never changes the board under the others
function keepingTheBoard(step) {
  return function (run) {
    var board = {wiring: wiring, order: order};
    step(run);
    wiring = board.wiring;
    order = board.order;
    settle();
    draw();
  };
}

stepBack = keepingTheBoard(stepBack);
stepOn = keepingTheBoard(stepOn);

// Breaking an output out, or putting it back, is done to every scene in turn, each carrying
// its own looks across. A scene's steps to undo end there, being about
// lamps that have since moved: putting the output back is the way to undo it
function acrossScenes(change) {
  return function (out) {
    store();
    var editing = state.at;
    var before = {wiring: JSON.stringify(wiring), order: JSON.stringify(order)};
    // Each scene is changed with the page held still, since drawing would store what is
    // being changed into the scene being edited
    var drawing = draw;
    draw = function () {};
    try {
      [state.always].concat(state.scenes).forEach(function (slot) {
        wiring = JSON.parse(before.wiring);
        order = JSON.parse(before.order);
        apply(slot.body);
        change(out);
        runs.forEach(function (run) {
          run.was = [];
          run.undone = [];
        });
        slot.body = capture();
      });
    } finally {
      draw = drawing;
    }
    state.at = editing;
    apply(slotAt(editing).body);
    draw();
  };
}

breakOut = acrossScenes(breakOut);
rejoin = acrossScenes(rejoin);

// Where a lamp sits is the build's as well. Moving one keeps every scene's looks on the
// lamps they were on, the way breaking out does, so a stretch the move takes apart
// becomes two playing the same
moveLamp = acrossScenes(function (move) {
  acrossWiring(function () { placeLamp(move); });
});

// Whether a lamp can be dragged to where it sits just now, which a page may narrow
function lampsMovable() { return true; }

var oneTakesPlace = takesPlace;

takesPlace = function (node, lamp) {
  oneTakesPlace(node, lamp);
  if (!lampsMovable()) node.draggable = false;
};

// The outputs broken out, as a person would say it
function brokenSaid() {
  var broken = wiring.map(function (one, at) { return one.broken ? at + 1 : 0; })
    .filter(function (at) { return at; });
  if (!broken.length) return "every output is one colour light";
  // Three or more in a row close up into a range, as the file writes them, so the box is
  // never much longer than it is with nothing broken out and the setup hint keeps its room
  var parts = [];
  for (var at = 0; at < broken.length;) {
    var end = at;
    while (end + 1 < broken.length && broken[end + 1] === broken[end] + 1) end++;
    if (end - at >= 2) parts.push(broken[at] + "-" + broken[end]);
    else for (var one = at; one <= end; one++) parts.push(String(broken[one]));
    at = end + 1;
  }
  return (broken.length === 1 ? "output " : "outputs ") + parts.join(", ") +
         (broken.length === 1 ? " is" : " are") + " broken out";
}

// ---- what the file says about the board -------------------------------------------------

function boardLine() {
  var tokens = [];
  SCREEN_PORTS.forEach(function (port) {
    if (screensFitted[port.id]) tokens.push(port.id + "=" + screensFitted[port.id]);
  });
  // A strip's length brings its connector up, so it is given only where some scene plays on it
  var bodies = [state.always.body].concat(state.scenes.map(function (scene) {
    return scene.body;
  }));
  runs.filter(function (run) { return run.strip; }).forEach(function (run) {
    var used = bodies.some(function (body) {
      var held = body && body.runs && body.runs[run.name];
      return held && held.sections.some(function (section) { return section.look; });
    });
    if (used) tokens.push(run.name + "=" + run.leds);
  });
  return tokens.length ? "board: " + tokens.join(" ") : "";
}

var oneBoardText = currentText;

currentText = function () {
  var text = oneBoardText();
  var line = boardLine();
  if (!line) return text;
  return HEADER + "\n" + line + "\n" + text.slice(HEADER.length);
};

// A screen port's size choice, which every page offers wherever it puts it
function screenSize(port) {
  var size = document.createElement("select");
  [""].concat(SCREEN_SIZES).forEach(function (inches) {
    var option = document.createElement("option");
    option.value = inches;
    option.textContent = inches ? inches + " inch" : "none fitted";
    if (screensFitted[port.id] === inches) option.selected = true;
    size.appendChild(option);
  });
  size.title = "Which panel is plugged in, which is the same for every scene";
  size.onchange = function () {
    screensFitted[port.id] = size.value;
    draw();
  };
  return size;
}

// ---- where the board is set up ----------------------------------------------------------
// Every fact about the board stays beside what it is about: the wiring on the outputs, a
// strip's length on the strip, a screen's type on the screen. What differs is how a page
// says those are the board's and not the scene's, and when they can be changed.
//
//   page     a setup mode for the whole page, turned on in the header
//   panel    a setup band in each panel, opened from that panel's header
//   marker   always editable, every board fact wearing the same mark
//   both     the mark always, and the setup mode for changing them
//   section  each fact in a box of its section's own colour, and the setup mode for
//            the whole board entered from any section's header, where it is needed

var SETUP_WAY = "section";

var WAYS_SAID = {
  page: "Set up the board from the header; outside that, it reads as plain words",
  panel: "Each panel sets up its own part of the board",
  marker: "Board facts are changed where they sit, and marked as the board's",
  both: "Board facts are marked, and changed in a setup mode",
  section: "A coloured box is a board setting, set up from any section"
};

// Whether the whole page is in its setup mode, and which panels have their band open
var setupOn = false;
var setupOpen = {};

// The panels that hold a board fact, and the colour each one's box takes
var SECTIONS = {outPanel: "outs", striplPanel: "stripl", striprPanel: "stripr",
                screenaPanel: "screena", screenbPanel: "screenb"};

function marked() { return SETUP_WAY === "marker" || SETUP_WAY === "both"; }

// Whether a fact reads as its section's coloured box
function boxed() { return SETUP_WAY === "section"; }

// Whether the board facts in this panel can be changed just now
function canEdit(panel) {
  if (SETUP_WAY === "marker") return true;
  if (SETUP_WAY === "panel") return !!setupOpen[panel];
  return setupOn;
}

// Where a lamp sits is changed with the wiring, so only where that can be
lampsMovable = function () { return canEdit("outPanel"); };

// The outputs read as a strip does, with no row above the lamps and no line under them. The
// arrows and dragging are explained beside the board's box while setting up, so the section
// is one size either way
var onePanelHead = renderPanelHead;

renderPanelHead = function () {
  onePanelHead();
  var head = document.getElementById("outHead");
  head.textContent = "";
  head.style.display = "none";
};

var oneLegend = renderLegend;

renderLegend = function () {
  oneLegend();
  var legend = document.getElementById("outLegend");
  legend.textContent = "";
  legend.style.display = "none";
};

// The steps the two sides share go on the cutting row of the side at the right, as a strip
// keeps its own on its cutting row
var oneCutting = renderCutting;

renderCutting = function (where, run) {
  oneCutting(where, run);
  if (where !== (mono.lamps.length ? "monoCut" : "outCut")) return;
  var row = document.getElementById(where);
  if (row) zoomAndSteps(row, active);
};

// A side is named only while there are two, telling the colour lamps from the mono ones.
// With every output one colour lamp, the board's box says so already
var oneSides = renderSides;

renderSides = function () {
  oneSides();
  var two = mono.lamps.length > 0;
  ["headA", "headB"].forEach(function (id) {
    var head = document.getElementById(id);
    if (head) head.style.display = two ? "" : "none";
  });

  if (sides) sides.classList.toggle("unnamed", !two);
};

// ---- selection waits while the board is set up ------------------------------------------------
// A stretch is picked to give it a look, which setup does not do, so a tap there picks
// nothing and nothing looks picked. What was picked is held by its lamp, the wiring
// being free to move it, and is picked again when setup ends; an output broken out or
// put back meanwhile is picked instead, as it would have been outside setup

var heldPick = null;
var heldOutput = null;

var onePick = pick;

pick = function (run, at) {
  if (setupOn) return;
  onePick(run, at);
};

var onePickOutput = pickOutput;

pickOutput = function (out) {
  if (setupOn) {
    heldOutput = out;
    return;
  }
  onePickOutput(out);
};

function setSetup(on) {
  if (on && !setupOn) {
    var section = active.sections[active.picked];
    heldPick = section ? lampKey(active.lamps[section.from]) : null;
    heldOutput = null;
  }
  setupOn = on;
  if (on) return;
  if (heldOutput !== null) {
    pickOutput(heldOutput);
  } else if (heldPick) {
    runs.some(function (run) {
      var at = run.lamps.map(lampKey).indexOf(heldPick);
      if (at >= 0) pick(run, sectionAt(run, at));
      return at >= 0;
    });
  }
  heldPick = null;
  heldOutput = null;
}

// Nothing looks picked while setup is on: the marks are drawn by the pages below, so they
// are taken off once drawn
function unmark() {
  document.querySelectorAll(".lamp.ringed, .sec.picked, .card.picked").forEach(function (one) {
    one.classList.remove("ringed", "picked");
  });
  document.querySelectorAll(".run svg rect.ringed").forEach(function (ring) {
    ring.parentNode.removeChild(ring);
  });
}

// A section's coloured box, the chip icon inside it with whatever the fact says
function boardBox(panel, parts) {
  var box = document.createElement("span");
  box.className = "chip boardchip " + SECTIONS[panel];
  box.title = "How the board is built, which is the same in every scene";
  box.appendChild(boardIcon());
  parts.forEach(function (part) {
    box.appendChild(typeof part === "string" ? document.createTextNode(part) : part);
  });
  return box;
}

function small(words) {
  var said = document.createElement("small");
  said.textContent = words;
  return said;
}

// The mark every board fact wears where marking is the way: a small board with pins
// The board's chip, three legs a side, set three apart as the smallest spacing that still
// reads as legs at 16px
function boardIcon() {
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 14 14");
  svg.setAttribute("width", "13");
  svg.setAttribute("height", "13");
  svg.setAttribute("class", "boardicon");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = "<rect x='3' y='3' width='8' height='8' rx='1' fill='none' " +
                  "stroke='currentColor' stroke-width='1.3'/>" +
                  "<path d='M4 0.8V3M7 0.8V3M10 0.8V3M4 11v2.2M7 11v2.2M10 11v2.2" +
                  "M0.8 4H3M0.8 7H3M0.8 10H3M11 4h2.2M11 7h2.2M11 10h2.2' " +
                  "stroke='currentColor' stroke-width='1.3' stroke-linecap='round'/>";
  return svg;
}

// One board fact as it reads in place: marked where that is the way, and saying so
function fact(content) {
  var chip = document.createElement("span");
  chip.className = "fact" + (marked() ? " boardfact" : "");
  if (marked()) {
    chip.appendChild(boardIcon());
    chip.title = "How the board is built, which is the same in every scene";
  }
  if (typeof content === "string") chip.appendChild(document.createTextNode(content));
  else chip.appendChild(content);
  return chip;
}

// A panel's band, where the panel way opens one: its facts under a label saying whose
function band(box, panel) {
  box.classList.toggle("setupband", SETUP_WAY === "panel" && !!setupOpen[panel]);
  if (SETUP_WAY !== "panel" || !setupOpen[panel]) return;
  var says = document.createElement("span");
  says.className = "bandsays";
  says.textContent = "Board setup, the same in every scene";
  box.appendChild(says);
}

// ---- the facts, in place --------------------------------------------------------------------

// The arrows on the lamps are how an output is broken out, so they show only where the
// wiring can be changed, and are marked as the board's where marking is the way
var oneCrossing = crossing;

// Where the wiring cannot be changed the arrow is left out. What stands in its place takes
// no room, as the arrow does, or each output's lamps would sit further apart outside setup
function noArrow() {
  var none = document.createElement("span");
  none.style.position = "absolute";
  return none;
}

crossing = function (out, colour) {
  if (!canEdit("outPanel")) return noArrow();
  var made = oneCrossing(out, colour);
  if (marked()) made.classList.add("boardfact");
  if (boxed()) made.classList.add("boardarrow");
  return made;
};

function renderOutFacts() {
  var box = document.getElementById("outFacts");
  box.textContent = "";
  band(box, "outPanel");
  var said = brokenSaid();
  if (boxed()) {
    box.appendChild(boardBox("outPanel", ["Wiring", small(said)]));
    if (canEdit("outPanel")) {
      var hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = "Drag a light to where it sits in your build. Arrows split an " +
                         "output into three mono lights, or rejoin them.";
      hint.title = hint.textContent;
      box.appendChild(hint);
    }
    return;
  }
  box.appendChild(fact(said.charAt(0).toUpperCase() + said.slice(1) +
                       (canEdit("outPanel") ? ". The arrow on an output breaks it out, or " +
                                              "puts it back." : ".")));
}

var oneRenderLeds = renderLeds;

renderLeds = function (where, run) {
  var box = document.getElementById(where);
  var panel = run.id + "Panel";
  if (boxed()) {
    // The strip's own count box is already the board's, so the icon goes inside it and
    // it takes the strip's colour
    if (canEdit(panel)) {
      oneRenderLeds(where, run);
      var says = box.querySelector(".says");
      if (says) box.removeChild(says);
      var chip = box.querySelector(".chip");
      chip.className = "chip boardchip " + SECTIONS[panel];
      chip.title = "How the board is built, which is the same in every scene";
      chip.insertBefore(boardIcon(), chip.firstChild);
    } else {
      box.textContent = "";
      box.appendChild(boardBox(panel, ["Strip", small(run.leds + " LEDs")]));
    }
    return;
  }
  if (canEdit(panel)) {
    oneRenderLeds(where, run);
    var chip = box.querySelector(".chip");
    var says = box.querySelector(".says");
    if (says) box.removeChild(says);
    box.removeChild(chip);
    band(box, panel);
    box.appendChild(fact(chip));
  } else {
    box.textContent = "";
    band(box, panel);
    box.appendChild(fact(run.leds + " LEDs"));
  }
};

function renderScreenFacts(port) {
  var box = document.getElementById(port.id + "Facts");
  var panel = port.id + "Panel";
  box.textContent = "";
  band(box, panel);
  if (boxed()) {
    var size = screensFitted[port.id];
    box.appendChild(boardBox(panel, [port.label, canEdit(panel)
      ? screenSize(port)
      : small(size ? size + " inch" : "no panel fitted")]));
    return;
  }
  if (canEdit(panel)) {
    var label = document.createElement("label");
    label.appendChild(document.createTextNode("Panel fitted "));
    label.appendChild(screenSize(port));
    box.appendChild(fact(label));
  } else {
    var fitted = screensFitted[port.id];
    box.appendChild(fact(fitted ? fitted + " inch panel fitted" : "No panel fitted"));
  }
}

// Once there are scenes the mark has to be read against them, so the frame says what it is
function renderMarkNote() {
  var box = document.getElementById("markNote");
  box.textContent = "";
  if (!marked() || !state.scenes.length) return;
  box.appendChild(boardIcon());
  box.appendChild(document.createTextNode(
    "marks how the board is built, which is the same in every scene"));
}

// ---- turning setup on ------------------------------------------------------------------------

function setupButton(label, on, act) {
  var button = document.createElement("button");
  button.type = "button";
  button.className = "setupbutton" + (on ? " on" : "");
  // The board's chip, as every board setting wears it, since this is where they open

  button.appendChild(document.createTextNode(label));

}

function renderSetupButtons() {
  if (SETUP_WAY === "page" || SETUP_WAY === "both") {
    var header = document.getElementById("setupHead");

    header.appendChild(setupButton(setupOn ? "Done setting up" : "Set up the board", setupOn,
                                   function () {
                                     setSetup(!setupOn);
                                     draw();
                                   }));
    document.body.classList.toggle("setup", setupOn);
    var banner = document.getElementById("setupBanner");

      ? "Setting up the board. What is changed here is the same in every scene, so the " +
        "scenes and looks wait until you are done."
      : "";
  }

    // The whole board is set up at once, from whichever section it was wanted in, and

    document.body.classList.toggle("setupall", setupOn);

// A section's own setup button, in the header of its panel
function sectionButton(panel, label, on, toggle) {
  var summary = document.querySelector("#" + panel + " > summary");
  var box = summary.querySelector(".setupslot");
  if (!box) {
    box = document.createElement("span");
    box.className = "setupslot";
    summary.appendChild(box);
  }

  // held where it was on the screen

var oneSetupDraw = draw;

draw = function () {

  renderOutFacts();
  SCREEN_PORTS.forEach(renderScreenFacts);
  renderMarkNote();
  renderSetupButtons();
  if (setupOn) unmark();
  document.getElementById("setupWay").textContent = WAYS_SAID[SETUP_WAY];
  paintAll();
};

state.always.body = capture();
draw();

// ---- the wiring, while the board is set up ------------------------------------------------
// In the outputs' own panel and only while the board is set up, the board's seven connectors along the bottom, each colour output one pin and
// each broken-out one three, a faint line from every pin to the lamp it feeds, brought
// forward by pointing at the lamp or the connector, a moved lamp sliding to its new place,
// and the lamps out of the order they are wired in with their numbers in bold.

var SLIDE_MS = 420;

// The connectors sit under both sides of the outputs, before their tools and settings
(function () {
  var row = document.createElement("div");
  row.id = "wiringRow";
  var sides = document.getElementById("sides");
  sides.parentNode.insertBefore(row, sides.nextSibling);
}());

// Every lamp in the order the board wires them: an output's own lamp, or its three channels
function wiredLamps() {
  var lamps = [];
  wiring.forEach(function (one, out) {
    if (one.broken) {
      [0, 1, 2].forEach(function (channel) { lamps.push({out: out, channel: channel}); });
    } else {
      lamps.push({out: out, channel: null});
    }
  });
  lamps.forEach(function (lamp) { lamp.key = lampKey(lamp); });
  return lamps;
}

// The board as the out-of-order rule reads it, a side of the same lamps
// in wired order and in build order
function wiredSide() {
  var wired = wiredLamps();
  var byKey = {};
  wired.forEach(function (lamp) { byKey[lamp.key] = lamp; });
  return {wiring: wired, order: order.map(function (place) { return byKey[lampKey(place)]; })};
}

// The lamps on show, which a page drawing its own row of them while set up may change
function lampsShown() {
  return Array.prototype.slice.call(document.querySelectorAll(
    "#outRun .lamp[data-key], #monoRun .lamp[data-key]"));
}

function lampNode(key) {
  return lampsShown().filter(function (node) { return node.dataset.key === key; })[0] || null;
}

// What a page draws before the wiring is laid over it, which here is nothing
function beforeWiring() {}

// Every lamp can be found by what it is, which is what the lines and the slide go by
var oneWiredTakesPlace = takesPlace;

takesPlace = function (node, lamp) {
  oneWiredTakesPlace(node, lamp);
  var key = lampKey({out: lamp.out, channel: lamp.colour ? null : lamp.channel});
  node.dataset.key = key;
  node.addEventListener("mouseenter", function () { bringForward([key], true); });
  node.addEventListener("mouseleave", function () { bringForward([key], false); });
};

// A line, its lamp and its pin brought forward, or let go
function bringForward(keys, on) {
  keys.forEach(function (key) {
    document.querySelectorAll("#outPanel [data-key='" + key + "']").forEach(function (node) {
      node.classList.toggle("wirehot", on);
    });
  });
}

// How far the sides and what follows them run outside setup, the cutting and the bar
// included, so the connectors can take up the same room while setting up
var unwiredSpan = null;

function sidesSpan() {
  return document.getElementById("outTools").getBoundingClientRect().top -
         document.getElementById("sides").getBoundingClientRect().top;
}

function renderConnectors() {
  var box = document.getElementById("wiringRow");
  box.textContent = "";
  var old = document.getElementById("wiringLines");
  if (old) old.parentNode.removeChild(old);
  document.getElementById("outPanel").classList.toggle("wired", setupOn);
  if (!setupOn) {
    unwiredSpan = sidesSpan();
    return;
  }

  var row = document.createElement("div");
  row.className = "wireconnectors";
  wiring.forEach(function (one, out) {
    var block = document.createElement("div");
    block.className = "wireconnector";
    var pins = document.createElement("div");
    pins.className = "wirepins";
    var keys = [];
    (one.broken ? [0, 1, 2] : [null]).forEach(function (channel) {
      var pin = document.createElement("span");
      var key = lampKey({out: out, channel: channel});
      pin.className = "wirepin" + (channel === null ? " whole" : "");
      pin.dataset.key = key;
      if (channel !== null) pin.style.background = CHANNEL_INKS[channel];
      pins.appendChild(pin);
      keys.push(key);
    });
    block.appendChild(pins);
    var name = document.createElement("b");
    name.textContent = String(out + 1);
    block.appendChild(name);
    block.title = "output " + (out + 1) + (one.broken ? ", broken out into three" : "");
    // A pin is too small to aim at, so the connector is what is pointed at
    block.addEventListener("mouseenter", function () { bringForward(keys, true); });
    block.addEventListener("mouseleave", function () { bringForward(keys, false); });
    row.appendChild(block);
  });
  box.appendChild(row);

  var side = wiredSide();
  var astray = astrayOf(side);
  astray.forEach(function (lamp) {
    var node = lampNode(lamp.key);
    if (node) node.classList.add("astray");
  });
  var said = document.createElement("p");
  said.className = "wiresay";
  said.innerHTML = astray.length
    ? "<b>" + astray.length + " of " + side.order.length + "</b> lights are out of the order " +

// it feeds, which a rearranged build is not
function drawLines() {
  var panel = document.getElementById("outPanel");
  var from = panel.getBoundingClientRect();
  var lines = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  lines.id = "wiringLines";
  lines.setAttribute("class", "wirelines");
  wiredLamps().forEach(function (lamp) {
    var node = lampNode(lamp.key);
    var pin = panel.querySelector(".wirepin[data-key='" + lamp.key + "']");
    if (!node || !pin) return;
    var top = node.getBoundingClientRect();
    var bottom = pin.getBoundingClientRect();
    var start = {x: bottom.left + bottom.width / 2 - from.left, y: bottom.top - from.top};
    var end = {x: top.left + top.width / 2 - from.left, y: top.bottom - from.top};
    var rise = (start.y - end.y) / 2;

// ---- the move shown ------------------------------------------------------------------------
// Every lamp measured before a move and played back from its old place to its new one, the
// one carried lifted above the rest. The drag ending draws the page again straight after
// the drop, which would replace the lamps mid-slide, so every draw until the page is next
// idle plays the slide from the same starting places

var oneWiredMove = moveLamp;
var sliding = null;

moveLamp = function (move) {
  slideFrom(lampKey(move.from));
  oneWiredMove(move);
};

// Where a lamp is within the outputs' panel. The page may scroll straight after a draw to
// hold a section still, and a place measured within the panel moves with it
function placeInPanel(node) {
  var box = node.getBoundingClientRect();
  var panel = document.getElementById("outPanel").getBoundingClientRect();
  return {left: box.left - panel.left, top: box.top - panel.top};
}

// Every lamp's place now, for the next draw to slide each from, the one carried lifted
function slideFrom(carried) {
  var was = {};
  lampsShown().forEach(function (node) { was[node.dataset.key] = placeInPanel(node); });
  sliding = {was: was, carried: carried};
  window.setTimeout(function () { sliding = null; }, 0);
}

function playSlide() {
  if (!sliding) return;
  var was = sliding.was;
  var carried = sliding.carried;
  lampsShown().forEach(function (node) {
    var from = was[node.dataset.key];
    if (!from) return;
    var to = placeInPanel(node);
    var dx = from.left - to.left;
    var dy = from.top - to.top;
    if (!dx && !dy) return;
    if (node.dataset.key === carried) node.classList.add("moving");
    node.style.transition = "none";
    node.style.transform = "translate(" + dx + "px," + dy + "px)";
    node.getBoundingClientRect();
    node.style.transition = "transform " + SLIDE_MS + "ms cubic-bezier(.2,.7,.2,1)";
    node.style.transform = "";
    window.setTimeout(function () {
      node.classList.remove("moving");
      node.style.transition = "";
    }, SLIDE_MS + 40);
  });
}

// Breaking an output out, its three lamps open out of where its one stood, each sliding
// from there to its own place; putting one back, the lamp it becomes closes in from the
// middle of the three. The other lamps make way as they do for a move
var oneWiredBreakOut = breakOut;
var oneWiredRejoin = rejoin;

breakOut = function (out) {
  slideFrom(null);
  var whole = sliding.was[lampKey({out: out, channel: null})];
  if (whole) {
    [0, 1, 2].forEach(function (channel) {
      sliding.was[lampKey({out: out, channel: channel})] = whole;
    });
  }
  oneWiredBreakOut(out);
};

rejoin = function (out) {
  slideFrom(null);
  var three = [0, 1, 2].map(function (channel) {
    return sliding.was[lampKey({out: out, channel: channel})];
  }).filter(Boolean);
  if (three.length) {
    sliding.was[lampKey({out: out, channel: null})] = {
      left: three.reduce(function (sum, one) { return sum + one.left; }, 0) / three.length,
      top: three.reduce(function (sum, one) { return sum + one.top; }, 0) / three.length
    };
  }
  oneWiredRejoin(out);
};

                               "font-size": 4, "font-family": "system-ui"}, "no picture"));
  }

  var name = PRINTED[screen.size] || PRINTED["2.8"];
  parts.push("<g transform='translate(" + (left - name.x / PER_MM) + " " +
             (extent - bottom - name.y / PER_MM) + ") scale(" + (1 / PER_MM) + ")' " +
             "fill='" + NAME_INK + "'>" + svgTag("path", {d: name.d}) + "</g>");

  var holder = document.createElement("div");
  holder.className = "holder";
  holder.innerHTML =
    "<svg width='" + DRAWN + "' height='" + DRAWN + "' viewBox='0 0 " + extent + " " + extent +
    "'><g transform='rotate(" + turn + " " + (extent / 2) + " " + (extent / 2) + ")'>" +
    parts.join("") + "</g></svg>";

  // The picture as the board will draw it: its own pixels, centred, cropped by the
  // lit window, black around it. The window sits on the drawing's exact centre, so
  // a turned module swaps its width and height and nothing else moves; the picture
  // itself stays upright, which is what a viewer of a mounted screen sees
  if (art) {
    var px = PANEL_PX[screen.size] || PANEL_PX["2.8"];
    var scale = (DRAWN / extent) * (litW / px[0]);
    var windowW = (quarter ? litH : litW) * (DRAWN / extent);
    var windowH = (quarter ? litW : litH) * (DRAWN / extent);
    var pane = document.createElement("div");
    pane.style.cssText = "position:absolute;overflow:hidden;" +
      "left:" + ((DRAWN - windowW) / 2) + "px;top:" + ((DRAWN - windowH) / 2) + "px;" +
      "width:" + windowW + "px;height:" + windowH + "px;" +
      "display:flex;align-items:center;justify-content:center";
    var img = document.createElement("img");
    img.src = art.url;
    img.style.cssText = "flex:none;width:" + (art.w * scale) + "px;height:" +
                        (art.h * scale) + "px";
    pane.appendChild(img);
    holder.style.position = "relative";
    holder.appendChild(pane);
  }
  return holder;
}

    head.appendChild(drop);

    var row = document.createElement("div");

        turn.appendChild(option);

    row.appendChild(turn);
    settings.appendChild(row);

    // A moving picture can bounce instead of jumping at the loop, and wait where
    // it turns; a slideshow also says how fast it walks its folder
    var media = screen.shows && screen.shows !== "keep" ? mediaNamed(screen.shows) : null;
    if (media && media.kind !== "image") {

      back.appendChild(tick);

      moving.appendChild(back);

      var holdWrap = document.createElement("label");
      holdWrap.className = "opt";

      holdWrap.appendChild(document.createTextNode("hold"));
      var hold = document.createElement("input");

      hold.min = 0;
      hold.step = 0.5;
      hold.value = screen.hold || "";
      hold.placeholder = "0";
      hold.dataset.focus = "hold-" + letter;
      hold.onchange = function () {
        screen.hold = hold.value && Number(hold.value) > 0 ? hold.value : "";
        draw();
      };
      holdWrap.appendChild(hold);
      moving.appendChild(holdWrap);

      if (media.kind === "folder") {
        var fpsWrap = document.createElement("label");
        fpsWrap.className = "opt";
        fpsWrap.title = "Pictures shown per second";
        fpsWrap.appendChild(document.createTextNode("fps"));
        var fps = document.createElement("input");
        fps.type = "number";
        fps.min = 1;
        fps.value = screen.fps;
        fps.dataset.focus = "fps-" + letter;
        fps.onchange = function () {
          screen.fps = Math.max(1, Number(fps.value) || 5);

        };

        moving.appendChild(fpsWrap);

      settings.appendChild(moving);

    var showing = document.createElement("div");

        : !state.fileHandle ? "open the FX drive to see its pictures"
        : state.scenes.length

    // and no picture can stand for it. It is a line of its own under the settings
    if (screen.kept) {

      keep.className = "keep" + (screen.shows === "keep" ? " picked" : "");
      keep.title = screen.kept;
      keep.innerHTML = "<b>Leave it as it is</b><code>" + screen.kept + "</code>";
      keep.onclick = function () { screen.shows = "keep"; draw(); };
      side.appendChild(keep);
    }
    box.appendChild(side);
  });
}

  state.media.forEach(function (media) {

      on[l] = state.screens[l].there && state.screens[l].shows === name;
    });
    var cell = document.createElement("div");
    cell.className = "asset" + (on.A && on.B ? " onAB" : on.A ? " onA" : on.B ? " onB" : "");
    var face = document.createElement("div");
    face.className = "face";
    var art = mediaArt(name);
    if (art) {
      face.style.background =
        "repeating-conic-gradient(#e8e4dc 0% 25%, #cbc5bb 0% 50%) 0 0/12px 12px";
      var img = document.createElement("img");
      img.src = art.url;
      face.appendChild(img);
    } else {
      // The extension stands in only until the picture arrives
      face.textContent = name.split(".").pop();
    }
    if (media.kind !== "image") {
      var kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = media.kind === "folder" ? "slideshow" : "gif";

    }

    SCREENS.forEach(function (letter) {
      var button = document.createElement("button");
      button.textContent = letter;
      var lit = on[letter];
      button.className = lit ? "lit" + (letter === "B" ? " b" : "") : "";
      button.disabled = !state.screens[letter].there;
      if (button.disabled) button.style.opacity = ".3";
      button.onclick = function () {
        // Tapping the lit one again takes the picture off this scene's screen,
        // falling back to what the file said where there is something to go back
        // to. A scene showing nothing on a screen leaves it as the scene before
        // left it, which the cross in the header cannot say for one scene alone
        var screen = state.screens[letter];
        screen.shows = screen.shows !== name ? name
                     : screen.kept ? "keep" : null;
        draw();
      };
      pick.appendChild(button);
    });
    cell.appendChild(pick);
    cell.appendChild(binButton(name, media.kind));
    box.appendChild(cell);
  });
  if (state.fileHandle)
    box.appendChild(adderTile("add pictures",
      {description: "Pictures the board plays",
       accept: {"image/png": [".gif", ".png", ".jpg", ".jpeg"]}},
      "pictures", /\.(gif|png|jpe?g)$/i));
}

function mediaNamed(name) {
  return state.media.filter(function (m) { return m.name === name; })[0] || null;
}

function screenEntry(letter, body) {
  var screen = state.screens[letter];
  var shows = body.screens[letter].shows;
  if (!screen.there || !shows) return null;
  if (shows === "keep") return body.screens[letter].kept;
  var media = mediaNamed(shows);
  var kind = media ? media.kind
           : /\.gif$/i.test(shows) ? "gif"
           : /\.(png|jpe?g)$/i.test(shows) ? "image" : "folder";
  var selector = "screen" + letter;
  if (screen.carried) selector += " " + screen.carried;
  if (Number(screen.turn)) selector += " rotation=" + screen.turn;
  var playing = body.screens[letter];
  var extras = "";
  if (kind !== "image") {
    if (playing.pingpong) extras += " ping_pong=true";
    if (playing.hold) extras += " hold=" + playing.hold;
  }
  if (kind === "folder")
    return selector + ": sequence folder=" + quoted(shows) + " fps=" + playing.fps + extras;
  if (kind === "gif")
    return selector + ": gif file=" + quoted(shows) + extras;
  return selector + ": image file=" + quoted(shows);
}

// Made up for a page with no drive, the drive files part reading the drive's in their place

function madePicture(name, kind, wide, high, paint) {
  var canvas = document.createElement("canvas");
  canvas.width = wide;
  canvas.height = high;
  paint(canvas.getContext("2d"), wide, high);
  state.art[name] = {url: canvas.toDataURL(), w: wide, h: high, ratio: wide / high};
  state.media.push({name: name, kind: kind});
}

madePicture("sunset.png", "image", 240, 320, function (g, w, h) {
  var sky = g.createLinearGradient(0, 0, 0, h);

});
madePicture("badge.png", "image", 240, 240, function (g, w, h) {
  g.fillStyle = "#15191c";

    .forEach(function (star) {
      g.beginPath();
      g.arc(star[0], star[1], star[2], 0, Math.PI * 2);

// A picture's drawing, made above
function mediaArt(name) { return state.art[name] || null; }

// Stand-ins for adding and deleting files, which the drive files part replaces
function binButton() { return document.createElement("span"); }
function adderTile() { return document.createElement("span"); }

function allBodies() {
  return [state.always.body].concat(state.scenes.map(function (scene) { return scene.body; }));
}

// ---- each scene keeps what its screens show ---------------------------------------------------

var oneScreensCapture = capture;

capture = function () {
  var body = oneScreensCapture();
  body.screens = {};
  SCREENS.forEach(function (letter) {
    var screen = state.screens[letter];
    body.screens[letter] = {shows: screen.shows, kept: screen.kept, pingpong: screen.pingpong,
                            hold: screen.hold, fps: screen.fps, turn: screen.turn};
  });
  return body;
};

var oneScreensApply = apply;

apply = function (body) {
  oneScreensApply(body);
  if (!body.screens) return;
  SCREENS.forEach(function (letter) {
    var screen = state.screens[letter];
    Object.assign(screen, body.screens[letter]);
    screen.turn = body.screens[letter].turn || 0;
    screen.lastShows = screen.shows;
  });
};

var oneScreensBlank = blankBody;

blankBody = function () {
  var body = oneScreensBlank();
  SCREENS.forEach(function (letter) { body.screens[letter].shows = null; });
  return body;
};

var oneScreensContent = hasContent;

hasContent = function (body) {
  return oneScreensContent(body) || SCREENS.some(function (letter) {
    return !!(body.screens && body.screens[letter].shows);
  });
};

// A scene's screens are written after its lamps
var oneScreensEntries = entriesOf;

entriesOf = function (body) {
  var lines = oneScreensEntries(body);
  SCREENS.forEach(function (letter) {
    var entry = body.screens && screenEntry(letter, body);
    if (entry) lines.push(entry);
  });
  return lines;
};

// The board line gives a screen's size only where some scene shows something on it. The board
// reserves for a pair wherever two screens are named, which
// slows the one in use
var oneScreensBoardLine = boardLine;

boardLine = function () {
  var bodies = [state.always.body].concat(state.scenes.map(function (scene) {
    return scene.body;
  }));
  SCREENS.forEach(function (letter) {
    var screen = state.screens[letter];
    var used = screen.there && bodies.some(function (body) {
      return body && body.screens && body.screens[letter].shows;
    });
    screensFitted["screen" + letter.toLowerCase()] = used ? screen.size : "";
  });
  return oneScreensBoardLine();
};

function renderScreensTab() {
  renderScreensHead();

  var boxes = head.querySelectorAll(".screen-box");
  // The band is the screen's coloured box, so it wears the board's chip like the others
  head.querySelectorAll(".screen-box h3").forEach(function (band) {
    band.insertBefore(boardIcon(), band.firstChild);
    band.title = "How the board is built, which is the same in every scene";
  });
  // The turn is kept for the picture showing, so there is none to set with none showing
  SCREENS.forEach(function (letter, at) {
    var screen = state.screens[letter];

    var picture = screen.shows && screen.shows !== "keep" ? screen.shows : null;

                         : "Which way up a picture is drawn, once one is showing";
    turn.onchange = function () {
      screen.turn = Number(turn.value);
      screen.turns[picture] = screen.turn;

// The tab's swatch is the two screens, each showing what its screen shows
var oneScreensSwatch = tabSwatch;

tabSwatch = function (swatch, panel) {

// Under the tab's name, where the others have their swatch, the size fitted to each screen,

// ---- a Sound tab ----------------------------------------------------------------------------
// One wav at a time, chosen from a row of tiles each showing its shape and how long it runs,
// with whether it loops and silence on a line above them.
//
// The drawing asks of its page the sounds on the drive, and each scene keeping its own sound.
// The board takes one per scene, and the one in the always-on tab plays in any scene that
// brings none of its own. Nothing about the sound is the board's, so setting up leaves it
// standing back.

state.sound = null;
state.soundLoop = false;
state.soundKept = null;
state.sounds = [];
state.soundInfo = {};

function renderSound() {
  var box = document.getElementById("sound");
  box.textContent = "";
  document.getElementById("soundSays").textContent = !state.fileHandle
    ? "open the FX drive to see the sounds on it"
    : !state.scanned
      ? "reading the drive..."
    : !(state.sounds.length || state.sound || state.soundKept)
      ? "no sounds on the drive yet; drop a wav onto it"
    : !state.scenes.length
      ? "one wav, playing on while the lights run"
    : state.at < 0
      ? "played in any scene that brings no sound of its own"
      : "played while this scene shows, picking up where it left off";

  // How the sound is played rather than which one it is, so it sits above them,
  // where a screen keeps its settings
  var again = document.createElement("button");
  again.className = "again" + (state.soundLoop && state.sound ? " on" : "");
  again.textContent = "on repeat";
  again.disabled = !state.sound;
  again.title = state.sound
    ? "Start it again as it ends, instead of playing once as the board starts"
    : "Nothing is playing, so there is nothing to repeat";
  again.onclick = function () { state.soundLoop = !state.soundLoop; draw(); };
  var above = document.createElement("div");
  above.style.margin = "0 0 .7rem";
  above.appendChild(again);
  box.appendChild(above);

  var row = document.createElement("div");
  row.className = "sounds";
  // A sound the file names that the drive does not hold still gets its tile, since
  // the board may find it on its own storage
  var names = state.sounds.slice();
  if (state.sound && names.indexOf(state.sound) < 0) names.unshift(state.sound);
  if (state.soundKept) row.appendChild(soundKeptTile());
  names.forEach(function (name) { row.appendChild(soundTile(name)); });
  row.appendChild(soundTile(null));
  if (state.fileHandle)
    row.appendChild(adderTile("add sounds",
      {description: "Sounds the board plays", accept: {"audio/wav": [".wav"]}},
      "sounds", /\.wav$/i));
  box.appendChild(row);

// How many points a sound's outline is drawn from, enough for it to look smooth at the

var SOUND_SAMPLES = 96;

function madeSound(name, seconds, shape) {
  var bars = [];
  for (var i = 0; i < SOUND_SAMPLES; i++) {
    bars.push(Math.max(0.08, Math.min(1, shape(i / (SOUND_SAMPLES - 1)))));
  }
  state.sounds.push(name);
  state.soundInfo[name] = {seconds: seconds, bars: bars};
}

// ---- drawing the tab ---------------------------------------------------------------------------

// The tab's swatch is the shape of the sound playing, or silence
var oneSoundSwatch = tabSwatch;

// A sound's outline, filled edge to edge and mirrored about the middle. Each moment of it is
// coloured by how loud it is, blue when quiet through violet and pink to red when loud, the
// violet keeping the middle of the run clear where blue straight to red goes muddy
var LOUDNESS = ["#3a6fd8", "#8a4fd0", "#d0449a", "#e5443a"];
var outlinesMade = 0;

// The colour for a loudness from 0 to 1, between the two nearest of LOUDNESS
function loudnessInk(loud) {
  var at = Math.max(0, Math.min(1, loud)) * (LOUDNESS.length - 1);
  var low = Math.floor(at), high = Math.min(LOUDNESS.length - 1, low + 1), part = at - low;
  function parts(hex) {
    return [1, 3, 5].map(function (from) { return parseInt(hex.substr(from, 2), 16); });
  }
  var from = parts(LOUDNESS[low]), to = parts(LOUDNESS[high]);
  return "rgb(" + from.map(function (value, channel) {
    return Math.round(value + (to[channel] - value) * part);
  }).join(",") + ")";
}

function soundOutline(bars) {
  var wide = 100, high = 40, middle = high / 2, last = bars.length - 1;
  var id = "loudness" + (outlinesMade++);
  function across(at) { return (at / last) * wide; }
  var above = bars.map(function (tall, at) { return across(at) + "," + (middle - tall * middle); });
  var below = bars.map(function (tall, at) { return across(at) + "," + (middle + tall * middle); });
  var outline = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  outline.setAttribute("viewBox", "0 0 " + wide + " " + high);
  outline.setAttribute("preserveAspectRatio", "none");
  outline.setAttribute("class", "soundoutline");
  outline.innerHTML = "<defs><linearGradient id='" + id + "' x1='0' x2='1'>" +
    bars.map(function (tall, at) {
      return "<stop offset='" + at / last + "' stop-color='" + loudnessInk(tall) + "'/>";
    }).join("") + "</linearGradient></defs>" +
    "<polygon points='" + above.concat(below.reverse()).join(" ") + "' fill='url(#" + id + ")'/>";
  return outline;
}

// ---- a Screen Hub in the Screens tab ----------------------------------------------------------
// A hub takes both connectors: one carries the screens' SPI and the other gives its five pins
// up as chip selects, so one hub reaches six panels, lettered A to F as on the hub itself.
// The hub is drawn for its SPI on A and its selects on B, but nothing stops it being wired
// the other way round. Whether the board has two screens or a hub, which way the hub is wired,
// and which panel is at each position are the board's, set while editing the board. What each
// position shows, and which way up, is the scene's, as it is for a screen.
//
// Positions of one size showing the same picture are sent it once, together, so a wall of one
// picture plays as fast as a single screen. Anything else goes to each position in turn, so
// the tab says when moving pictures will slow for it. The positions share one backlight, which
// the board lights for them all.
//
// The file names a position by the hub's own letter, as outputs are named by number: hubB, or
// hubA-C,E for several, with the hub and its panels declared on the board line.

var HUB_PLACES = ["A", "B", "C", "D", "E", "F"];

// A position taken out keeps the size it had, for if it is put back
state.hub = {on: true, port: "A", sizes: {}, was: {}};
state.places = {};
HUB_PLACES.forEach(function (place) {
  state.hub.sizes[place] = "2.8";
  state.places[place] = {shows: null, turn: 0, pingpong: false, hold: "", fps: 5,
                         turns: {}, lastShows: null};
});

// The position whose settings are shown under the hub
var placePicked = "A";

// Whether a position has a panel to show on, its size being "" where it has none
function placeThere(place) { return state.hub.on && !!state.hub.sizes[place]; }

function placesThere() { return HUB_PLACES.filter(placeThere); }

// A position shown as a screen of its panel's size, which is what the module drawing asks for
function asScreen(place) {
  var held = state.places[place];
  return {size: state.hub.sizes[place], turn: held.turn, shows: held.shows};
}

// The connector's own colour, A blue and B purple, which the hub takes from the one its
// screens come through
function hubInk() { return state.hub.port === "A" ? "a" : "b"; }

// A picture newly chosen on a position starts at the turn it was last given there
function placeTurnForChosen(place) {
  var held = state.places[place];
  if (held.shows === held.lastShows) return;
  held.turn = (held.shows && held.turns[held.shows]) || 0;
  held.lastShows = held.shows;
}

// ---- each scene keeps what the hub's positions show ------------------------------------------

var oneHubCapture = capture;

capture = function () {
  var body = oneHubCapture();
  body.places = {};
  HUB_PLACES.forEach(function (place) {
    var held = state.places[place];
    body.places[place] = {shows: held.shows, pingpong: held.pingpong, hold: held.hold,
                          fps: held.fps, turn: held.turn};

};

var oneHubApply = apply;

apply = function (body) {

    var held = state.places[place];
    Object.assign(held, body.places[place]);
    held.turn = body.places[place].turn || 0;
    held.lastShows = held.shows;
  });
};

var oneHubBlank = blankBody;

blankBody = function () {
  var body = oneHubBlank();
  HUB_PLACES.forEach(function (place) { body.places[place].shows = null; });
  return body;
};

var oneHubContent = hasContent;

hasContent = function (body) {
