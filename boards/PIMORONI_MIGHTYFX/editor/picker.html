// Saving and the read-back of errors.txt: the banner and the saving lights, remembering the
// drive, and waiting on the board. Opening a drive takes its handles, the read-back part
// reading its effects.txt into the page. Chrome and Edge only, where a page can be handed a
// folder to write to.

var SPOT_STEP_MS = 120;

var SAVING_TAIL_MS = 920;

var spotTimer = null;

function stopSpots() {
  if (spotTimer !== null) clearInterval(spotTimer);
  spotTimer = null;
}

function saving(text) {
  banner(text, "hold");
  var row = document.createElement("span");
  row.className = "spots";
  for (var i = 0; i < 7; i++) row.appendChild(document.createElement("i"));
  document.getElementById("banner").firstChild.appendChild(row);
  var at = 0;
  spotTimer = setInterval(function () {
    for (var i = 0; i < row.children.length; i++)
      row.children[i].className = i === at ? "lit" : "";
    at = (at + 1) % row.children.length;
  }, SPOT_STEP_MS);
}

function banner(text, warn, detail) {
  stopSpots();
  var box = document.getElementById("banner");
  box.textContent = "";
  if (!text) return;
  var note = document.createElement("div");
  // warn may also be "hold", the amber of a check still running
  note.className = warn === "hold" ? "banner hold" : warn ? "banner warn" : "banner";
  note.textContent = text;
  if (detail) {
    var pre = document.createElement("pre");
    pre.textContent = detail;
    note.appendChild(pre);
  }
  box.appendChild(note);
}

function rememberDrive(handle) {
  try {
    var open = indexedDB.open("fx-pages", 1);
    open.onupgradeneeded = function () { open.result.createObjectStore("handles"); };
    open.onsuccess = function () {
      try {
        open.result.transaction("handles", "readwrite")
            .objectStore("handles").put(handle, "drive");
      } catch (e) {}
    };
  } catch (e) {}
}

function rememberedDrive() {
  return new Promise(function (settle) {
    try {
      var open = indexedDB.open("fx-pages", 1);
      open.onupgradeneeded = function () { open.result.createObjectStore("handles"); };
      open.onerror = function () { settle(null); };
      open.onsuccess = function () {
        try {
          var ask = open.result.transaction("handles").objectStore("handles").get("drive");
          ask.onsuccess = function () { settle(ask.result || null); };
          ask.onerror = function () { settle(null); };
        } catch (e) { settle(null); }
      };
    } catch (e) { settle(null); }
  });
}

async function pickDrive(fresh) {
  var kept = await rememberedDrive();
  if (kept && !fresh) {
    try {
      if (await kept.requestPermission({mode: "readwrite"}) === "granted") {
        await kept.getFileHandle("effects.txt");
        return kept;
      }
    } catch (e) {}
  }
  var picked;
  try {
    picked = await window.showDirectoryPicker(
        kept ? {mode: "readwrite", startIn: kept} : {mode: "readwrite"});
  } catch (e) {
    if (e.name === "AbortError") throw e;
    picked = await window.showDirectoryPicker({mode: "readwrite"});
  }
  rememberDrive(picked);
  return picked;
}

var BOARD_SETTLE_MS = 6000;

var BOARD_WAIT_MS = 15000;

var BOARD_AWAY_MS = 10000;

var BOARD_POLL_MS = 250;

function playsItself(text) {
  return /\breload\s*=\s*auto\b/i.test(text);
}

var CHECKING = "The board has not read the file yet.";

async function markChecking() {
  try {
    var handle = await state.dirHandle.getFileHandle("errors.txt", {create: true});
    var writable = await handle.createWritable();
    await writable.write(CHECKING + "\n");
    await writable.close();
    return true;
  } catch (e) {
    return false;
  }
}

async function driveAnswers() {
  try {
    for await (var entry of state.dirHandle.values()) return true;
    return true;
  } catch (e) {
    return false;
  }
}

async function readErrors() {
  try {
    var handle = await state.dirHandle.getFileHandle("errors.txt");
    return (await (await handle.getFile()).text()).trim();
  } catch (e) {
    if (e.name !== "NotFoundError") return false;
    return (await driveAnswers()) ? null : false;
  }
}

async function waitForBoard(before, nothingYet) {
  var deadline = Date.now() + BOARD_WAIT_MS;
  var settled = Date.now() + BOARD_SETTLE_MS;
  var wentAway = false;
  var told = false;
  while (Date.now() < deadline) {
    await new Promise(function (settle) { setTimeout(settle, BOARD_POLL_MS); });
    var now = await readErrors();
    if (now === false) {
      if (!wentAway) deadline = Math.max(deadline, Date.now() + BOARD_AWAY_MS);
      wentAway = true;
      continue;
    }
    if (now !== before) return now;
    if (wentAway) return now;
    if (!told && Date.now() > settled) {
      nothingYet();
      told = true;
    }
  }
  return before;
}

function sayWhatHappened(said, also) {
  if (said === CHECKING)
    banner("No answer from the board yet. Eject the FX drive, or press Boot " +
           "once, and it plays. If the lights already changed, this computer is " +
           "showing the page an old copy of the drive: press the board's Reset " +
           "button to see what it wrote.", true);
  else if (said)
    banner("The board wasn't happy with some of it:", true, said);
  else
    banner("Playing on the board. No problems reported." + (also || ""));
}

async function openDrive(fresh) {
  try {
    await connect(fresh);
    banner("");
  } catch (e) {
    if (e.name === "AbortError") return;
    if (e.name === "NotAnFxDrive") {
      banner("That folder has no effects.txt, so it does not look like an FX " +
             "drive. Pick the drive itself, the one named FX.", true);
      return;
    }
    banner("Could not open the drive: " + e.name + ". Is it showing? " +
           "A double press of Boot brings it back.", true);
  }
}

function openFresh() { openDrive(true); }

var CAN_REACH_A_DRIVE = typeof window.showDirectoryPicker === "function";


var drive = {dirHandle: null, fileHandle: null};

// The board's answer as this page shows it: what errors.txt said, and the file it was about,
// so a line is marked only while the page still writes it the same
var answered = {said: null, about: null};

// What this page last wrote or read
var WROTE_KEY = "fx-picker-wrote";

// What a save asks where the board holds a file this page has neither written nor read
function overwriteQuestion() {
  return "This page does not read the file on the board yet, so saving replaces it with " +
         "what this page writes. Save over it?";
}

async function connect(fresh) {
  var dir = await pickDrive(fresh);
  var file;
  try {
    file = await dir.getFileHandle("effects.txt");
  } catch (e) {
    if (e.name === "NotFoundError") {
      var refused = new Error("no effects.txt");
      refused.name = "NotAnFxDrive";
      throw refused;
    }
    throw e;
  }
  drive.dirHandle = dir;
  drive.fileHandle = file;
  // The wait on the board reads the drive through the page's state
  state.dirHandle = dir;
  document.getElementById("check").disabled = false;
  // Open, the drive button goes quiet and narrower, saying in its tip which drive is open, and
  // saving takes the colour as the next thing to do
  var openButton = document.getElementById("open");
  openButton.className = "";
  openButton.textContent = "Change drive";
  openButton.title = "Connected to " + (dir.name && dir.name.length > 1 ? dir.name : "the FX drive") +
                     ". Open a different one";
  openButton.onclick = openFresh;
  var saveButton = document.getElementById("save");
  saveButton.className = "primary";
  saveButton.disabled = false;
  // The header's buttons have changed width, which decides whether it keeps one line
  draw();
}

// errors.txt read into the lines it names. autofx begins each problem "line N:", and anything
// after it up to the next is that problem's, such as a program's traceback
function problemsIn(said) {
  var found = {};
  var at = null;
  (said || "").split("\n").forEach(function (line) {
    var named = line.match(/^line (\d+): ?(.*)$/);
    if (named) {
      at = Number(named[1]);
      (found[at] = found[at] || []).push(named[2]);
    } else if (at !== null && line.trim()) {
      found[at].push(line.trim());
    }
  });
  return found;
}

// Takes the board's answer and the file it read, then marks the lines it named
function takeAnswer(said, about) {
  answered = {said: said || null, about: about};
  renderPreview();
}

// A line the board named is marked where the page still writes it as the board read it, the
// board's words after it
var oneDrivePreview = renderPreview;

renderPreview = function () {
  oneDrivePreview();
  var problems = problemsIn(answered.said);
  var lines = currentText().split("\n");
  var read = (answered.about || "").split("\n");
  var stale = 0;
  var painted = lines.map(function (line, at) {
    var said = problems[at + 1];
    if (!said) return paintLine(line);
    if (read[at] !== line) {
      stale++;
      return paintLine(line);
    }
    return "<span class='s-problem'>" + paintLine(line) + "</span>" +
           "<span class='s-said'>  " + escapeHtml(said.join(" ")) + "</span>";
  });
  Object.keys(problems).forEach(function (at) {
    if (Number(at) > lines.length) stale++;
  });
  document.getElementById("preview").innerHTML = painted.join("\n");
  var note = document.getElementById("previewNote");
  if (note) {
    note.hidden = !stale;
    note.textContent = stale === 1 ? "One line the board named has changed since it was read."
                                   : stale + " lines the board named have changed since.";
  }
};

document.getElementById("save").onclick = async function () {
  var button = this;
  var check = document.getElementById("check");
  try {
    if (!drive.fileHandle) await connect();
    button.disabled = true;
    check.disabled = true;
    var onBoard = await (await drive.fileHandle.getFile()).text();
    var lastWritten = null;
    try { lastWritten = localStorage.getItem(WROTE_KEY); } catch (e) {}
    if (onBoard !== lastWritten && onBoard.trim() !== "" && !confirm(overwriteQuestion()))
      return;
    var text = currentText();
    saving("Saving to the board...");
    var errorsBefore = playsItself(onBoard) ? await readErrors() : undefined;
    if (errorsBefore !== undefined && await markChecking()) errorsBefore = CHECKING;
    var writable = await drive.fileHandle.createWritable();
    await writable.write(text);
    await writable.close();
    var back = await (await drive.fileHandle.getFile()).text();
    if (back !== text) throw new Error("the file read back differently");
    try { localStorage.setItem(WROTE_KEY, text); } catch (e) {}
    // The marks were about the file the board had, which this one replaces
    takeAnswer(null, text);
    await new Promise(function (settle) { setTimeout(settle, SAVING_TAIL_MS); });
    // Said once, where this save is the first to hide the drive
    var hides = /\bdrive=manual\b/.test(text) && !/\bdrive=manual\b/.test(onBoard)
      ? " The drive stays hidden the next time the board starts: double-press its button " +
        "to bring it back."
      : "";
    // A program running keeps the board busy, so neither an eject nor a press reaches it
    if (/\bprogram=/.test(onBoard)) {
      banner("On its way. The board is running a program, so press its Reset button to play " +
             "this one." + hides);
      return;
    }
    if (errorsBefore === undefined) {
      banner("On its way. " + (playsItself(text)
             ? "Eject the FX drive, or press Boot once, to play this one. " +
               "From now on a save plays on its own."
             : "Eject the FX drive on this computer, and the board plays it. Double-press " +
               "Boot to bring the drive back, then press 'Check board'.") + hides);
      return;
    }
    banner("Saved. Waiting for the board to pick it up...", "hold");
    var was = errorsBefore === false ? null : errorsBefore;
    var said = await waitForBoard(was, function () {
      banner("Playing on the board. Checking for problems...", "hold");
    });
    sayWhatHappened(said, hides);
    if (said !== CHECKING) takeAnswer(said, text);
  } catch (e) {
    if (e.name === "AbortError") return;
    if (e.name === "QuotaExceededError") {
      banner("The FX drive is full, so there was no room to save. Delete a " +
             "picture or sound from it and try again.", true);
      return;
    }
    drive.fileHandle = null;
    drive.dirHandle = null;
    banner("That didn't reach the board: " + e.name + ". Is the FX drive showing? " +
           "A double press of its button brings it back; then try again.", true);
  } finally {
    button.disabled = !drive.fileHandle;
    check.disabled = !drive.fileHandle;
  }
};

// The answer and the file it is about are read together, the board having finished with both
document.getElementById("check").onclick = async function () {
  banner("Asking the board...", "hold");
  await new Promise(function (settle) { setTimeout(settle, 350); });
  try {
    var about = await (await drive.fileHandle.getFile()).text();
    var said = await readErrors();
    if (said === false) throw {name: "NotReadable"};
    if (said === CHECKING) {
      banner("The board has not read the file yet. Eject the FX drive, or press " +
             "Boot once.", "hold");
      return;
    }
    if (said) banner("The board wasn't happy with some of it:", true, said);
    else banner("All good. The board read the file and found nothing wrong.");
    takeAnswer(said, about);
  } catch (e) {
    banner("Couldn't look: " + e.name + ". Is the drive showing?", true);
  }
};

document.getElementById("open").onclick = function () { openDrive(false); };

// What an opening string says of a program: a name where it gives one, what it does, and the
// arguments it names, or null where it names none
function programSaid(docstring) {
  var lines = (docstring || "").split("\n").filter(function (line) { return line.trim(); });
  var said = {name: null, does: "", args: null};
  lines.forEach(function (line) {
    var named = line.match(/^Program:\s*(.+)$/);
    var takes = line.match(/^Args:\s*(.+)$/);
    if (named) said.name = named[1].trim();
    else if (takes) said.args = takes[1].split(",").map(function (arg) { return arg.trim(); });
    else if (!said.does) said.does = line.trim();
  });
  return said;
}

function programNamed(path) {
  var mine = DRIVE_PROGRAMS.filter(function (one) { return one[0] === path; })[0];
  if (mine) return Object.assign({path: path, onDrive: true}, programSaid(mine[1]));
  var example = BOARD_EXAMPLES.filter(function (one) { return one.path === path; })[0];
  return example ? {path: path, onDrive: false, name: null, does: example.does, args: null,
                    needs: example.needs}
                 : null;
}

// A program's arguments as the file takes them, each one quoted where a space or a colon would
// otherwise divide it, and an empty one left out. A pipe divides them, so none can carry one
function argsWritten(path) {
  var given = (boardSet.args[path] || []).map(function (arg) {
    return arg.replace(/[|"]/g, "").trim();
  }).filter(Boolean);
  return given.map(function (arg) { return /[\s:]/.test(arg) ? '"' + arg + '"' : arg; })
              .join("|");
}

// Whether each of the others means anything, a program keeping the board busy while it runs
function savingMeansSomething() { return !boardSet.program; }
function driveMeansSomething() { return !boardSet.program; }

var oneSettingsBoardLine = boardLine;

boardLine = function () {
  var line = oneSettingsBoardLine();
  var tokens = [];
  if (boardSet.program) {
    tokens.push("program=" + boardSet.program);
    var args = argsWritten(boardSet.program);
    if (args) tokens.push("args=" + args);
  }
  if (boardSet.driveHidden) tokens.push("drive=manual");
  if (boardSet.reload) tokens.push("reload=auto");
  if (!tokens.length) return line;
  var rest = line.replace(/^board: ?/, "");
  return "board: " + tokens.join(" ") + (rest ? " " + rest : "");
};

// Whether the settings carry what the board runs, which a page choosing between an effects page
// and a program page does not
var boardRowsRun = true;

// The three settings, locked where the page only lets the board change while editing it
function boardRows(locked) {
  var rows = document.createElement("div");
  rows.className = "boardrows";
  var runs = segment([["effects", "the effects", locked], ["program", "a program", locked]],
                     boardSet.program ? "program" : "effects", function (value) {
                       if (value === "effects") {
                         boardSet.program = null;
                       } else if (!boardSet.program) {
                         boardSet.program = boardSet.lastProgram || DRIVE_PROGRAMS[0][0];
                       }
                     });
  if (boardRowsRun) rows.appendChild(boardRow("Runs", runs));

  var busy = !savingMeansSomething();
  var saving = segment([["auto", "plays without an eject", locked || busy],
                        ["manual", "waits for an eject", locked || busy]],
                       boardSet.reload ? "auto" : "manual",
                       function (value) { boardSet.reload = value === "auto"; });
  rows.appendChild(boardRow("Saving", saving,
    busy ? "a program keeps the board busy, so press its Reset button to play a change"
         : boardSet.reload ? "the board has to be running a file that says so, so the save " +
                             "that first turns this on still needs an eject"
                           : "eject the drive, or press Boot once, to play a save"));

  var shown = !driveMeansSomething();
  var driveChoice = segment([["shown", "shown at start", locked || shown],
                             ["hidden", "hidden until asked", locked || shown]],
                            boardSet.driveHidden ? "hidden" : "shown",
                            function (value) { boardSet.driveHidden = value === "hidden"; });
  rows.appendChild(boardRow("The drive", driveChoice,
    shown ? "shown anyway while a program runs, so it can always be changed back"
          : boardSet.driveHidden ? "double-press Boot to bring it back" : ""));
  if (boardSet.program && boardRowsRun) rows.appendChild(programChooser(locked));
  return rows;
}

// Where a program comes from and what it does, in a line
function programRow(path, locked) {
  var program = programNamed(path);
  var row = document.createElement("button");
  row.type = "button";
  row.className = "progrow" + (boardSet.program === path ? " on" : "");
  row.disabled = !!locked;
  var file = path.split("/").pop();
  row.innerHTML = "<b>" + escapeHtml(program.name || file) + "</b>" +
                  (program.name ? "<em>" + escapeHtml(file) + "</em>" : "") +
                  (program.needs ? "<em>needs " + escapeHtml(program.needs) + "</em>" : "") +
                  "<small>" + escapeHtml(program.does || "says nothing about itself") + "</small>";
  row.onclick = function () {
    boardSet.program = path;
    boardSet.lastProgram = path;
    draw();
  };
  return row;
}

// The picked program's arguments: a box for each it names, or plain ones to add to
function argsFor(path, locked) {
  var program = programNamed(path);
  var given = boardSet.args[path] || (boardSet.args[path] = []);
  var box = document.createElement("div");
  box.className = "progargs";
  var names = program.args || given.map(function (arg, at) { return "Argument " + (at + 1); });
  names.forEach(function (name, at) {
    var label = document.createElement("label");
    label.textContent = name;
    var field = document.createElement("input");
    field.value = given[at] || "";
    field.disabled = !!locked;
    field.oninput = function () {
      given[at] = field.value;
      renderPreview();
    };
    field.onchange = function () { draw(); };
    label.appendChild(field);
    box.appendChild(label);
  });
  if (!program.args) {
    var more = document.createElement("button");
    more.type = "button";
    more.className = "progmore";
    more.textContent = "+ an argument";
    more.disabled = !!locked;
    more.title = "Something to pass the program, which it reads from sys.argv";
    more.onclick = function () {
      given.push("");
      draw();
    };
    box.appendChild(more);
  }
  return box;
}

// Programs on the drive first, then the examples that come with the board by folder, the
// picked one's arguments under it. A drawing is a screen's picture, so it is not listed
function programChooser(locked) {
  var box = document.createElement("div");
  box.className = "chooser";
  function heading(words) {
    var said = document.createElement("div");
    said.className = "progheading";
    said.textContent = words;
    box.appendChild(said);
  }
  function listed(path, into) {
    into.appendChild(programRow(path, locked));
    if (boardSet.program === path) into.appendChild(argsFor(path, locked));
  }
  heading("On the drive");
  DRIVE_PROGRAMS.forEach(function (one) { listed(one[0], box); });
  heading("Come with the board");
  // A folder of folders, such as screens, opens onto its own, so the list starts short
  function fold(name, within, into) {
    var mine = BOARD_EXAMPLES.filter(function (one) {
      return one.folder === within || one.folder.indexOf(within + "/") === 0;
    });
    var node = document.createElement("details");
    node.className = "progfolder";
    node.open = mine.some(function (one) { return one.path === boardSet.program; }) ||
                !!openFolders[within];
    node.addEventListener("toggle", function () { openFolders[within] = node.open; });
    var summary = document.createElement("summary");
    summary.innerHTML = escapeHtml(name) + " <small>" + mine.length +
                        (mine.length === 1 ? " program" : " programs") + "</small>";
    node.appendChild(summary);
    mine.filter(function (one) { return one.folder === within; })
        .forEach(function (one) { listed(one.path, node); });
    foldersIn(within).forEach(function (inner) {
      fold(inner.split("/").pop(), inner, node);
    });
    into.appendChild(node);
  }
  foldersIn("").forEach(function (top) { fold(top, top, box); });
  return box;
}

// The folders directly inside one, the examples' own top folders for none
function foldersIn(within) {
  var found = [];
  BOARD_EXAMPLES.forEach(function (one) {
    var rest = within ? one.folder.slice(within.length + 1) : one.folder;
    if (within && one.folder.indexOf(within + "/") !== 0) return;
    var next = rest.split("/")[0];
    var path = within ? within + "/" + next : next;
    if (next && found.indexOf(path) < 0) found.push(path);
  });
  return found;
}

    " in place of the effects. They are kept, and play if it is missing or stops, when " +
    "errors.txt says why."));
}

  if (state.at < 0 && state.scenes.length) {

  if (!row || state.at < 0) return;

  var words = row.querySelectorAll(":scope > span");
  if (words[0]) words[0].className = "snamed";
  if (words[1]) words[1].className = "sunit";
  var ticked = row.querySelector("label");
  if (!ticked) return;
  row.replaceChild(toggle("&#8630;", "Restart", scene.restart,
                          function (on) { scene.restart = on; },
                          "Its effects begin again every time the scene comes round, " +
                          "instead of carrying on where they left off"),

};

function featureNamed(key) {
  return FEATURES.filter(function (one) { return one[0] === key; })[0];
}

function featureIcon(key) {
  var feature = featureNamed(key);
  var icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  icon.setAttribute("viewBox", "0 0 16 16");
  icon.setAttribute("class", "featureicon");
  icon.setAttribute("aria-hidden", "true");
  icon.innerHTML = feature[2];
  return icon;
}

// What a program uses, from its source for an example and from its opening string on the drive
function usesOf(path) {
  if (DRIVE_USES[path]) return DRIVE_USES[path];
  var example = BOARD_EXAMPLES.filter(function (one) { return one.path === path; })[0];
  return example ? example.uses : [];
}

var ASSETS = "../../../examples/mighty_fx/examples/assets/";

// Frames captured off a board running each example, composed to what its panel showed and scaled
// to the thumbnail's size. Where one exists it is the thumbnail, the drawn one standing in only for
// what has not been captured
var SHOTS = "../../bench/thumbs/";
var CAPTURED = ["acrylic_lixie", "animated_gif_recoloured", "billboard_cased", "bouncing_logo",
                "bus_departures", "carpets_paired", "color_wheel", "crt_terminal", "departure_board",
                "departures_list", "flip_dot_sign", "isometric_flight", "kaleidoscope",
                "lane_control_gantry", "led_matrix", "nixie_tube", "roadworks_sign",
                "scrolling_billboard", "skyline", "split_flap_clock", "split_flap_departures",
                "starfield", "starfield_wall", "status_panel", "traces_scroll", "traces_wall",
                "tram_stop_sign", "trivision_billboard"];

function offeredAt(path) {
  for (var g = 0; g < OFFERED.length; g++) {
    for (var i = 0; i < OFFERED[g][1].length; i++) {
      if ("examples/" + OFFERED[g][1][i][0] === path) return OFFERED[g][1][i];
    }
  }
  return null;
}

// Words a file name spells for the code, said as a reader would
var TITLE_WORDS = {crt: "CRT", led: "LED", color: "colour"};

// A program's name to show: its own where it gives one, else its file's, in words
function programTitle(path) {
  var program = programNamed(path);
  if (program && program.name) return program.name;
  var words = path.split("/").pop().replace(/\.py$/, "").split("_").map(function (word) {
    return TITLE_WORDS[word] || word;
  }).join(" ");
  return words.charAt(0).toUpperCase() + words.slice(1);
}

// ---- thumbnails ----------------------------------------------------------------------------------
// A screen's shape at a fifth of a 2.8" panel's pixels, drawn blocky on purpose, which is also what
// a captured frame scaled down this far would look like

var THUMB_W = 64, THUMB_H = 48;
var thumbImages = {};

function thumbCanvas(kind, seed) {
  var canvas = document.createElement("canvas");
  canvas.width = THUMB_W;
  canvas.height = THUMB_H;
  canvas.className = "progthumb";
  paintThumb(canvas.getContext("2d"), kind, seed || 1, canvas);
  return canvas;
}

// A repeatable scatter, so a thumbnail is the same every time it is drawn
function scatter(seed) {
  var state = seed * 9301 + 49297;
  return function () {
    state = (state * 9301 + 49297) % 233280;
    return state / 233280;
  };
}

function paintThumb(g, kind, seed, canvas) {
  var W = THUMB_W, H = THUMB_H, x, y, i;
  var chance = scatter(seed);
  function fill(ink) { g.fillStyle = ink; g.fillRect(0, 0, W, H); }
  function dotRow(ink, top, count, size, gap) {
    g.fillStyle = ink;
    for (i = 0; i < count; i++) g.fillRect(3 + i * (size + gap), top, size, size);
  }
  if (kind.indexOf("asset:") === 0 || kind.indexOf("shot:") === 0) {
    fill("#111");
    var src = kind.indexOf("shot:") === 0 ? SHOTS + kind.slice(5) + ".png" : ASSETS + kind.slice(6);
    var image = thumbImages[src];
    if (!image) {
      image = thumbImages[src] = new Image();
      image.src = src;
    }
    var drawn = function () {
      var scale = Math.max(W / image.width, H / image.height);
      g.imageSmoothingEnabled = true;
      g.drawImage(image, (W - image.width * scale) / 2, (H - image.height * scale) / 2,
                  image.width * scale, image.height * scale);
    };
    if (image.complete && image.width) drawn();
    else image.addEventListener("load", drawn);
    return;
  }
  if (kind.indexOf("lamps:") === 0) {
    // What the outputs do, as seven lamps on the board's dark
    fill("#1c1f22");
    var inks = {rainbow: ["#ff2d1a", "#ff9022", "#ffd21f", "#22c65a", "#28e0e0", "#2b5cff", "#9a46ff"],
                warm: ["#ffb060", "#ffc27a", "#ff9022", "#ffb060", "#ffc27a", "#ff9022", "#ffb060"],
                mono: ["#ffd9a0", "#3a3f44", "#ffd9a0", "#ffd9a0", "#3a3f44", "#ffd9a0", "#3a3f44"],
                pulse: ["#ffd9a0", "#c9aa7c", "#8a765a", "#4d4336", "#8a765a", "#c9aa7c", "#ffd9a0"],
                dusk: ["#ffe6b0", "#ffe6b0", "#ffe6b0", "#c9aa7c", "#8a765a", "#4d4336", "#3a3f44"],
                level: ["#3a3f44", "#3a3f44", "#22c65a", "#22c65a", "#3a3f44", "#3a3f44", "#3a3f44"],
                bar: ["#2b5cff", "#28e0e0", "#22c65a", "#ffd21f", "#3a3f44", "#3a3f44", "#3a3f44"],
                melody: ["#9a46ff", "#3a3f44", "#ff36c8", "#9a46ff", "#3a3f44", "#2b5cff", "#ff36c8"],
                countdown: ["#ff2d1a", "#ff2d1a", "#ff2d1a", "#22c65a", "#3a3f44", "#3a3f44", "#3a3f44"]};
    var row = inks[kind.slice(6)] || inks.mono;
    for (i = 0; i < 7; i++) {
      g.fillStyle = row[i];
      g.beginPath();
      g.arc(6 + i * 8.6, H / 2, 3.2, 0, Math.PI * 2);
      g.fill();
    }
    return;
  }
  switch (kind) {
  case "flipdot":
    fill("#101010");
    for (y = 0; y < 7; y++) for (x = 0; x < 20; x++) {
      g.fillStyle = chance() < 0.42 ? "#f5d400" : "#262626";
      g.fillRect(2 + x * 3, 13 + y * 3, 2, 2);
    }
    break;
  case "flap":
    fill("#161616");
    for (i = 0; i < 4; i++) {
      g.fillStyle = "#2c2c2c";
      g.fillRect(4 + i * 14 + (i > 1 ? 4 : 0), 12, 12, 24);
      g.fillStyle = "#0c0c0c";
      g.fillRect(4 + i * 14 + (i > 1 ? 4 : 0), 23, 12, 1);
      g.fillStyle = "#eee";
      g.font = "bold 16px monospace";
      g.fillText("1942".charAt(i), 6 + i * 14 + (i > 1 ? 4 : 0), 30);
    }
    break;
  case "flapboard":
    fill("#161616");
    for (y = 0; y < 5; y++) for (x = 0; x < 9; x++) {
      g.fillStyle = "#2a2a2a";
      g.fillRect(2 + x * 6.8, 5 + y * 8, 6, 7);
      g.fillStyle = chance() < 0.7 ? "#e8e8e8" : "#f5c400";
      g.fillRect(3.5 + x * 6.8, 7 + y * 8, 3, 3);
    }
    break;
  case "nixie":
  case "lixie":
    fill(kind === "nixie" ? "#140a06" : "#06080f");
    g.font = "bold 30px serif";
    g.shadowColor = kind === "nixie" ? "#ff7a1a" : "#6ab0ff";
    g.shadowBlur = 8;
    g.fillStyle = kind === "nixie" ? "#ffb060" : "#bfe0ff";
    g.fillText("7", 23, 36);
    g.shadowBlur = 0;
    break;
  case "board":
  case "bus":
    fill(kind === "bus" ? "#0b1a33" : "#0a0a0a");
    for (y = 0; y < 5; y++) {
      g.fillStyle = kind === "bus" ? "#ffffff" : "#ffb000";
      g.fillRect(4, 6 + y * 8, 8 + chance() * 10, 3);
      g.fillRect(28, 6 + y * 8, 14 + chance() * 12, 3);
      g.fillStyle = kind === "bus" ? "#ffd21f" : "#ffb000";
      g.fillRect(W - 12, 6 + y * 8, 8, 3);
    }
    break;
  case "amber":
  case "roadworks":
    fill("#0d0c0a");
    for (y = 0; y < 8; y++) for (x = 0; x < 21; x++) {
      var on = kind === "roadworks" ? (y === 3 || y === 4 || (x > 8 && x < 12))
                                    : chance() < 0.3;
      g.fillStyle = on ? "#ffa51a" : "#2a2218";
      g.fillRect(2 + x * 3, 12 + y * 3, 2, 2);
    }
    break;
  case "gantry":
    fill("#0a0a0a");
    for (i = 0; i < 3; i++) {
      g.fillStyle = "#1e1e1e";
      g.fillRect(3 + i * 21, 10, 18, 28);
      g.strokeStyle = i === 0 ? "#ff2d1a" : "#ffffff";
      g.lineWidth = 2;
      g.beginPath();
      if (i === 0) {
        g.moveTo(7, 16); g.lineTo(17, 32); g.moveTo(17, 16); g.lineTo(7, 32);
      } else {
        g.moveTo(12 + i * 21 - 9, 14); g.lineTo(12 + i * 21 - 9, 33);
        g.moveTo(12 + i * 21 - 14, 28); g.lineTo(12 + i * 21 - 9, 34);
        g.lineTo(12 + i * 21 - 4, 28);
      }
      g.stroke();
    }
    break;
  case "crt":
    fill("#031a06");
    g.fillStyle = "#39ff6a";
    for (y = 0; y < 6; y++) g.fillRect(4, 5 + y * 7, 10 + chance() * 40, 3);
    g.fillRect(4 + 22, 5 + 6 * 7 - 7, 3, 4);
    break;
  case "trivision":
    fill("#222");
    for (i = 0; i < 10; i++) {
      g.fillStyle = ["#ff5a36", "#ffd21f", "#2b5cff"][i % 3 === 0 ? 0 : i < 5 ? 1 : 2];
      g.fillRect(i * 6.4, 4, 5.6, 40);
    }
    break;
  case "iso":
    fill("#8fd0ff");
    for (y = 0; y < 6; y++) for (x = 0; x < 6; x++) {
      g.fillStyle = (x + y) % 3 ? "#4caf50" : "#2e7d32";
      g.beginPath();
      var cx = 32 + (x - y) * 6, cy = 8 + (x + y) * 3.4;
      g.moveTo(cx, cy); g.lineTo(cx + 6, cy + 3.4); g.lineTo(cx, cy + 6.8); g.lineTo(cx - 6, cy + 3.4);
      g.fill();
    }
    break;
  case "stars":
    fill("#02030a");
    for (i = 0; i < 60; i++) {
      var far = chance();
      g.fillStyle = far < 0.8 ? "#8a93b8" : "#ffffff";
      g.fillRect(Math.floor(chance() * W), Math.floor(chance() * H), far < 0.9 ? 1 : 2, 1);
    }
    break;
  case "wheel":
    fill("#000");
    for (i = 0; i < 24; i++) {
      g.fillStyle = "hsl(" + i * 15 + ",100%,55%)";
      g.beginPath();
      g.moveTo(32, 24);
      g.arc(32, 24, 19, i / 24 * Math.PI * 2, (i + 1) / 24 * Math.PI * 2 + 0.02);
      g.fill();
    }
    break;
  case "matrix":
    fill("#080808");
    for (y = 0; y < 10; y++) for (x = 0; x < 14; x++) {
      var lit = Math.hypot(x - 6.5, (y - 4.5) * 1.3) < 4.2;
      g.fillStyle = lit ? "#ff3a2a" : "#2a0d0a";
      g.beginPath();
      g.arc(5 + x * 4.2, 5 + y * 4.2, 1.5, 0, Math.PI * 2);
      g.fill();
    }
    break;
  case "kaleido":
    fill("#10061a");
    for (i = 0; i < 12; i++) {
      g.fillStyle = ["#ff36c8", "#28e0e0", "#ffd21f", "#9a46ff"][i % 4];
      g.beginPath();
      g.moveTo(32, 24);
      g.arc(32, 24, 21, i / 12 * Math.PI * 2, (i + 0.55) / 12 * Math.PI * 2);
      g.fill();
    }
    break;
  case "logo":
    fill("#15233a");
    g.fillStyle = "#ff36c8";
    g.fillRect(34, 10, 20, 12);
    g.fillStyle = "#15233a";
    g.fillRect(38, 13, 12, 6);
    break;
  case "carpet":
    fill("#6b1f2a");
    for (y = 0; y < 6; y++) for (x = 0; x < 8; x++) {
      g.fillStyle = (x + y) % 2 ? "#d9a441" : "#1f4d6b";
      g.beginPath();
      g.arc(4 + x * 8, 4 + y * 8, 2.4, 0, Math.PI * 2);
      g.fill();
    }
    break;
  case "flame":
    fill("#120804");
    for (i = 0; i < 40; i++) {
      var across = 18 + chance() * 28, up = 44 - chance() * (26 - Math.abs(across - 32));
      g.fillStyle = chance() < 0.5 ? "#ff7a1a" : "#ffc27a";
      g.fillRect(across, up, 2, 44 - up);
    }
    break;
  case "servo":
  case "motor":
    fill("#e9e6e0");
    g.strokeStyle = "#56708f";
    g.fillStyle = "#56708f";
    g.lineWidth = 3;
    if (kind === "servo") {
      g.fillRect(18, 22, 28, 16);
      g.beginPath(); g.moveTo(32, 22); g.lineTo(44, 8); g.stroke();
    } else {
      g.beginPath(); g.arc(32, 24, 13, 0, Math.PI * 2); g.stroke();
      for (i = 0; i < 6; i++) {
        g.beginPath(); g.moveTo(32, 24);
        g.lineTo(32 + Math.cos(i) * 13, 24 + Math.sin(i) * 13); g.stroke();
      }
    }
    break;
  default:
    fill("#ddd");
  }
}

function programThumb(path) {
  var offered = offeredAt(path);
  var file = path.split("/").pop().replace(/\.py$/, "");
  var kind = offered && CAPTURED.indexOf(file) >= 0 ? "shot:" + file
           : offered ? offered[1] : DRIVE_THUMBS[path] || "flame";
  return thumbCanvas(kind, path.length);
}

// ---- the program page ------------------------------------------------------------------------

var programView = null;

// A program as a card, as the looks are, its thumbnail over its name, and what it uses as a row
// of small drawings along the foot of the thumbnail
function programCard(path) {
  var card = document.createElement("button");
  card.type = "button";
  card.className = "progcard" + (boardSet.program === path ? " picked" : "");
  card.dataset.path = path;
  card.appendChild(programThumb(path));
  var uses = usesOf(path);
  if (uses.length) {
    var row = document.createElement("span");
    row.className = "proguses";
    uses.forEach(function (key) { row.appendChild(featureIcon(key)); });
    card.appendChild(row);
  }
  var name = document.createElement("span");
  name.className = "progname";
  name.textContent = programTitle(path);
  card.appendChild(name);
  card.title = ((programNamed(path) || {}).does || "") + (uses.length ? "\nUses " +
    uses.map(function (key) { return featureNamed(key)[1]; }).join(", ") : "");
  card.onclick = function () {
    boardSet.program = path;
    boardSet.lastProgram = path;
    draw();
  };
  return card;
}

// The picked program large, with what it does, what it needs and what it takes
function programHero(path) {
  var hero = document.createElement("div");
  hero.className = "proghero";
  var big = programThumb(path);
  big.classList.add("big");
  hero.appendChild(big);
  var words = document.createElement("div");
  words.className = "progwords";
  var program = programNamed(path) || {};
  words.innerHTML = "<h3>" + escapeHtml(programTitle(path)) + "</h3>" +
                    "<p>" + escapeHtml(program.does || "Says nothing about itself.") + "</p>" +
                    "<p class='progwhere'>" + escapeHtml(path) +
                    (program.onDrive ? ", on the drive" : ", comes with the board") + "</p>";
  // What it uses, each drawn and named, as the filter below names them
  var uses = document.createElement("div");
  uses.className = "herouses";
  usesOf(path).forEach(function (key) {
    var one = document.createElement("span");
    one.appendChild(featureIcon(key));
    one.appendChild(document.createTextNode(featureNamed(key)[1]));
    uses.appendChild(one);
  });
  if (uses.children.length) words.appendChild(uses);
  words.appendChild(argsFor(path, false));
  hero.appendChild(words);
  return hero;
}

function renderProgramView() {
  programView.textContent = "";
  if (!boardSet.program) return;
  var note = document.createElement("div");
  note.className = "programnote";
  note.appendChild(boardIcon());
  note.appendChild(document.createTextNode(
    "The board runs " + boardSet.program.split("/").pop() + " in place of the effects. They " +
    "are kept, and play if it is missing or stops, when errors.txt says why."));
  programView.appendChild(note);
  programView.appendChild(programHero(boardSet.program));
  programView.appendChild(featureFilter());
  var shown = 0;
  function group(title, paths) {
    var kept = paths.filter(passesFilter);
    if (!kept.length) return;
    shown += kept.length;
    var heading = document.createElement("h4");
    heading.className = "proggroup";
    heading.textContent = title;
    programView.appendChild(heading);
    var grid = document.createElement("div");
    grid.className = "proggrid";
    kept.forEach(function (path) { grid.appendChild(programCard(path)); });
    programView.appendChild(grid);
  }
  group("On the drive", DRIVE_PROGRAMS.map(function (one) { return one[0]; }));
  OFFERED.forEach(function (set) {
    group(set[0], set[1].map(function (entry) { return "examples/" + entry[0]; }));
  });
  if (!shown) {
    var none = document.createElement("p");
    none.className = "prognone";
    none.textContent = "Every program here needs something not ticked.";
    programView.appendChild(none);
  }
}

// ---- choosing by what is to hand ----------------------------------------------------------------
// A chip for each thing an offered program can use, all on to begin with. A chip turned off is
// something not to hand, so every program needing it goes, and a program stays only while all it
// uses is on. One screen or two is had with either a screen or two, so it has no chip of its own

var unhad = [];

function had(key) { return unhad.indexOf(key) < 0; }

function passesFilter(path) {
  return usesOf(path).every(function (key) {
    return key === "either" ? had("screen") || had("pair") : had(key);
  });
}

function offeredPaths() {
  var offered = DRIVE_PROGRAMS.map(function (one) { return one[0]; });
  OFFERED.forEach(function (set) {
    set[1].forEach(function (entry) { offered.push("examples/" + entry[0]); });
  });
  return offered;
}

function featureFilter() {
  var row = document.createElement("div");
  row.className = "featurefilter";
  var said = document.createElement("span");
  said.textContent = "I have";
  row.appendChild(said);
  var offered = offeredPaths();
  FEATURES.forEach(function (feature) {
    if (feature[0] === "either") return;
    var used = offered.some(function (path) { return usesOf(path).indexOf(feature[0]) >= 0; });
    if (!used) return;
    var chip = document.createElement("button");
    chip.type = "button";
    chip.className = "featurechip" + (had(feature[0]) ? " on" : "");
    chip.dataset.feature = feature[0];
    chip.title = had(feature[0]) ? "Showing programs that use " + feature[1]
                                 : "Hiding programs that need " + feature[1];
    chip.appendChild(featureIcon(feature[0]));
    chip.appendChild(document.createTextNode(feature[1]));
    chip.onclick = function () {
      var at = unhad.indexOf(feature[0]);
      if (at >= 0) unhad.splice(at, 1);
      else unhad.push(feature[0]);
      draw();
    };
    row.appendChild(chip);
  });
  if (unhad.length) {
    var all = document.createElement("button");
    all.type = "button";
    all.className = "featureclear";
    all.textContent = "all of them";
    all.onclick = function () {
      unhad = [];
      draw();
    };
    row.appendChild(all);
  }
  return row;
}

                 ["headseg", "Header: one control"], ["headtabs", "Header: tabs off its foot"],

var TAB_WAYS = ["headtabs", "headsplit"];
var pageWay = (location.search.match(/way=(\w+)/) || [])[1] || "covers";

  var style = getComputedStyle(header);
  var inner = header.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  var gap = rem;

  var name = document.querySelector("header h1").scrollWidth;
  // The group's width as it sits, first shown to last, so a button joined to another counts once.

                            shown[0].getBoundingClientRect().left : 0;

  // its bottom border counts, and the tabs reach from the buttons' top to that edge. The tabs

  var above = parseFloat(style.paddingTop);

// ---- the figure beside each slider --------------------------------------------------------
// Each slider can show beside it the value the file writes, with its unit, in a box that takes
// one typed in. Typed within the slider's reach, the slider moves to it; typed past an end,
// the slider sits at that end and the value is kept as typed, so the file writes exactly it.
// The figures are in a drawer at the right of the sliders, shut until opened, one for the
// whole panel, and a viewer's page remembers which way they left it.
//
// Every figure rises as its slider goes right, as the setting does. So a speed set as
// an interval between steps is shown as how many times a second, and a signal's as how fast
// it runs against a real one. A slider moving several settings shows the first of its keys it
// changes, the rest following it. A wave's speed is shown without its sign, which way it runs
// being Reverse's to say.

document.body.classList.add("figures");

// The settings a slider may be shown by, in the order they are looked for
var FIGURE_KEYS = {
  pace: ["speed", "interval", "green_interval", "bright_max"],
  mood: ["length", "sat", "steps", "dimness", "duty", "flashes", "ease", "fade"]
};

// A real signal's green interval, which a signal's speed is shown against
var SIGNAL_GREEN = {"Traffic light": 12, "Pelican crossing": 20};

// How a setting's value is shown, the figure rising as the slider does, and taken back
function figureWay(key, look) {
  var times = {unit: "/s", show: function (v) { return 1 / v; },
               take: function (f) { return 1 / f; }};
  var same = function (unit) {
    return {unit: unit, show: function (v) { return v; }, take: function (f) { return f; }};
  };
  var percent = {unit: "%", show: function (v) { return v * 100; },
                 take: function (f) { return f / 100; }};
  if (key === "speed") return same("/s");
  if (key === "interval" || key === "bright_max") return times;
  if (key === "green_interval") {
    var real = SIGNAL_GREEN[look.name] || 12;
    return {unit: "\u00d7", show: function (v) { return real / v; },
            take: function (f) { return real / f; }};
  }
  if (key === "length") return same("lights");
  if (key === "ease" || key === "fade") return same("s");
  if (["sat", "dimness", "duty"].indexOf(key) >= 0) return percent;
  return same("");
}

// Whether the drawer is open, which a viewer's page keeps between visits
var FIGURES_KEPT = "fx-picker-figures-open";
var figuresOpen = false;
try {
  figuresOpen = window.localStorage.getItem(FIGURES_KEPT) === "1";
} catch (e) {
  figuresOpen = false;
}

// The typed values of the stretch whose lines are being written, which linesFor applies
var exactNow = null;

var oneExactLines = linesFor;

linesFor = function (look, target, pace, mood, colour) {
  var lines = oneExactLines(look, target, pace, mood, colour);
  if (!exactNow) return lines;
  Object.keys(exactNow).forEach(function (slider) {
    var typed = exactNow[slider];
    if (!typed) return;
    // A trail is the fall of a split fade, so a typed one replaces the part after its bar
    if (typed.key === "fade") {
      lines = lines.map(function (line) {
        return line.replace(/(\sfade=[\d.]+\|)[\d.]+/, "$1" + typed.value);
      });
      return;
    }
    var setting = new RegExp("(^|\\s)" + typed.key + "=(-?)[\\d.]+");
    lines = lines.map(function (line) {
      return line.replace(setting, function (all, space, sign) {
        return space + typed.key + "=" + sign + typed.value;
      });
    });
  });
  return lines;
};

// Both ways a stretch's lines are asked for carry its typed values: the file and the preview
function withExact(exact, write) {
  var had = exactNow;
  exactNow = exact || null;
  try {
    return write();
  } finally {
    exactNow = had;
  }
}

var oneExactSection = sectionLines;

sectionLines = function (run, section, look) {
  return withExact(section.exact, function () { return oneExactSection(run, section, look); });
};

var oneExactPlay = livePlay;

livePlay = function (look, holder, t, slot, count, sim) {
  var exact = holder && holder !== MIDDLING ? holder.exact : null;
  return withExact(exact, function () { return oneExactPlay(look, holder, t, slot, count, sim); });
};

// A setting's value in a stretch's lines, without its sign, or null where none names it. A
// fade is read as its fall, the part after its bar, which is what a trail is
function settingIn(lines, key) {
  var setting = new RegExp("(^|\\s)" + key + "=(?:[\\d.]+\\|)?(-?[\\d.]+)");
  for (var at = 0; at < lines.length; at++) {
    var found = lines[at].match(setting);
    if (found) return Math.abs(Number(found[2]));
  }
  return null;
}

// The stretch's lines with one slider at a value and nothing typed
function linesAt(run, section, look, slider, value) {
  var at = Object.assign({}, section, {exact: null});
  at[slider] = value;
  return sectionLines(run, at, look);
}

// The setting a slider moves, the first of its keys whose value it changes
function figureKey(run, section, look, slider) {
  var low = linesAt(run, section, look, slider, 0);
  var high = linesAt(run, section, look, slider, 1);
  return FIGURE_KEYS[slider].filter(function (key) {
    return settingIn(low, key) !== null && settingIn(low, key) !== settingIn(high, key);
  })[0] || null;
}

function figureSaid(value) {
  return String(Math.round(value * 100) / 100);
}

// The slider's place that writes nearest a value, looked for along its whole reach. Past its
// reach the slider sits at the nearer end, not at the first place that rounds to it
function placeFor(run, section, look, slider, key, value) {
  var best = 0, nearest = Infinity;
  for (var step = 0; step <= 200; step++) {
    var place = step / 200;
    var gives = settingIn(linesAt(run, section, look, slider, place), key);
    if (gives !== null && Math.abs(gives - value) < nearest) {
      nearest = Math.abs(gives - value);
      best = place;
    }
  }
  if (nearest > 1e-6) {
    var low = settingIn(linesAt(run, section, look, slider, 0), key);
    var high = settingIn(linesAt(run, section, look, slider, 1), key);
    best = Math.abs(low - value) < Math.abs(high - value) ? 0 : 1;
  }
  return {place: best, off: nearest};
}

// A palette's colours, a swatch for each its lines name, drawn afresh as its slider moves
function paintPalette(swatches, lines) {
  swatches.textContent = "";
  (lines.join(" ").match(/colour=[^\s:]+/g) || []).forEach(function (said) {
    var chip = document.createElement("span");
    chip.className = "repeatchip";
    chip.style.background = inkOf(said.slice(7));
    chip.title = said.slice(7);
    swatches.appendChild(chip);
  });
}

// The box a figure is typed in and its unit, each a cell of the sliders' grid
function figureCells(said, unit, title, take) {
  var box = document.createElement("input");
  box.type = "text";
  box.inputMode = "decimal";
  box.className = "figurebox";
  box.value = said;
  box.title = title;
  box.onchange = function () {
    var typed = parseFloat(box.value.replace(",", "."));
    if (!(typed > 0)) {
      box.value = said;
      return;
    }
    take(typed);
    draw();
  };
  var units = document.createElement("span");
  units.className = "figureunit";
  units.textContent = unit;
  return [box, units];
}

var oneFigureChosen = renderChosen;

renderChosen = function (where, run) {
  oneFigureChosen(where, run);
  var box = document.getElementById(where);
  var section = run && run.sections[run.picked];
  var look = section && lookNamed(section.look);
  var tuning = box && box.querySelector(".chosen .tuning");
  if (!tuning || !look) return;
  function live() { return run.sections[run.picked]; }
  tuning.classList.toggle("figuresopen", figuresOpen);

  var ranges = Array.prototype.slice.call(tuning.querySelectorAll("input[type=range]"));
  var boxes = [];
  ranges.forEach(function (range) {
    var slider = (range.dataset.focus || "").split("-").pop();
    var cells, way = null, key = null, widest = 3;
    var timing = range.dataset.timing;
    if (timing) {
      // A signal's timing is its seconds already, typed past the slider's ends as it is
      widest = Math.max(String(range.min).length, String(range.max).length) + 2;
      cells = figureCells(figureSaid(Number(range.value)), "s",
                          "seconds, typed exactly, past the slider's ends too", function (typed) {
        var mine = live();
        mine.timings = Object.assign({}, mine.timings);
        mine.timings[timing] = Math.round(typed * 100) / 100;
      });
    } else if (slider === "mood" && look.mood === "Palette") {
      // A palette is its colours, not a number, so its slot shows them
      var swatches = document.createElement("span");
      swatches.className = "figurebox paletteswatches";
      paintPalette(swatches, sectionLines(run, section, look));
      // Across the box and unit columns, from where the boxes start, being wider than a box
      swatches.style.gridColumn = "span 2";
      cells = [swatches, null];
    } else if (slider === "level") {
      var bright = section.level === undefined ? 1 : section.level;
      cells = figureCells(String(Math.round(bright * 100)), "%",
                          "how bright, typed as a percentage", function (typed) {
        live().level = Math.max(0.01, Math.min(1, typed / 100));
      });
    } else if (slider === "pace" || slider === "mood") {
      key = figureKey(run, section, look, slider);
      if (key) {
        way = figureWay(key, look);
        // As wide as the widest figure the slider can reach, so dragging it never resizes its
        // column and with it the slider
        [0, 0.5, 1].forEach(function (place) {
          var reach = figureSaid(way.show(settingIn(linesAt(run, section, look, slider, place),
                                                   key)));
          widest = Math.max(widest, reach.length);
        });
        var typedHere = section.exact && section.exact[slider];
        var value = typedHere ? typedHere.value : settingIn(sectionLines(run, section, look), key);
        cells = figureCells(figureSaid(way.show(value)), way.unit,
                            "the file's " + key + ", typed exactly, past the slider's ends too",
                            function (typed) {
          var wanted = way.take(typed);
          var mine = live();
          var found = placeFor(run, mine, look, slider, key, wanted);
          mine[slider] = found.place;
          mine.exact = Object.assign({}, mine.exact);
          if (found.off > 1e-6) {
            mine.exact[slider] = {key: key, value: Math.round(wanted * 1000) / 1000};
          } else {
            delete mine.exact[slider];
          }
        });
      }
    } else {
      return;
    }
    // A slider with no one figure keeps its row's cells, empty, so the columns stay whole
    if (!cells) {
      cells = [document.createElement("span"), document.createElement("span")];
      cells[0].className = "figurebox";
      cells[1].className = "figureunit";
    }
    // A figure typed past the slider's end, wider than any it reaches, widens it to fit
    if (cells[0].tagName === "INPUT") {
      boxes.push({box: cells[0], chars: Math.max(widest, String(cells[0].value || "").length)});
    }
    if (cells[1]) range.parentNode.insertBefore(cells[1], range.nextSibling);
    range.parentNode.insertBefore(cells[0], range.nextSibling);

    // Moved, the slider is the setting again, and its figure follows it
    var moved = range.oninput;
    range.oninput = function () {
      var mine = live();
      if (mine.exact && mine.exact[slider]) {
        mine.exact = Object.assign({}, mine.exact);
        delete mine.exact[slider];
      }
      if (moved) moved.call(range);
      if (cells[0].classList.contains("paletteswatches")) {
        paintPalette(cells[0], sectionLines(run, mine, look));
        return;
      }
      if (cells[0].tagName !== "INPUT") return;
      if (timing) cells[0].value = figureSaid(Number(range.value));
      else if (slider === "level") cells[0].value = String(Math.round(Number(range.value) * 100));
      else cells[0].value = figureSaid(way.show(settingIn(sectionLines(run, mine, look), key)));
    };
  });

  // Every box in the panel as wide as the widest, so they line up and none moves as it changes
  var chars = boxes.reduce(function (most, one) { return Math.max(most, one.chars); }, 3);
  boxes.forEach(function (one) { one.box.style.width = (chars + 0.5) + "ch"; });

  // The drawer's handle, down the right of the sliders, which opens and shuts every figure
  var handle = document.createElement("button");
  handle.type = "button";
  handle.className = "figurehandle";
  handle.textContent = figuresOpen ? "\u203a" : "\u2039";
  handle.title = figuresOpen ? "hide the figures" : "show each setting's figure, to type one in";
  handle.setAttribute("aria-expanded", figuresOpen ? "true" : "false");
  handle.style.gridRow = "1 / span " + ranges.length;
  handle.onclick = function () {
    figuresOpen = !figuresOpen;
    try {
      window.localStorage.setItem(FIGURES_KEPT, figuresOpen ? "1" : "0");
    } catch (e) {
      // Kept only for this visit where the page may not keep anything
    }
    draw();
  };
  tuning.appendChild(handle);
};

// ---- the drive's files ---------------------------------------------------------------------------
// The effects page as it goes onto an FX drive: no Screen Hub until one is set up, and the pictures
// and sounds the drive holds, each picture and wav read off the drive.

var scanBusy = false;

async function scanMedia(dir) {
  // What the drive holds that a screen can show: gifs and stills, PNG or JPEG,
  // and folders of them, which play as a slideshow. One walk at a time, built
  // aside and landed whole, so a redraw mid-scan never sees half a drive and two
  // walks can never lace their findings together
  if (scanBusy) return;
  scanBusy = true;
  var media = [];
  var sounds = [];
  try {
    for await (var pair of dir.entries()) {
      var name = pair[0], handle = pair[1];
      if (handle.kind === "file") {
        if (/\.gif$/i.test(name)) media.push({ name: name, kind: "gif", handle: handle });
        else if (/\.(png|jpe?g)$/i.test(name)) media.push({ name: name, kind: "image", handle: handle });
        else if (/\.wav$/i.test(name)) {
          sounds.push(name);
          profileSound(name, handle);
        }
      } else if (name !== "System Volume Information") {
        for await (var inner of handle.entries()) {
          if (inner[1].kind === "file" && /\.(gif|png|jpe?g)$/i.test(inner[0])) {
            media.push({ name: name, kind: "folder", thumbHandle: inner[1] });
            break;
          }
        }
      }
    }
  } finally {
    scanBusy = false;
  }
  sounds.sort();
  media.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
  state.media = media;
  state.sounds = sounds;
  state.scanned = true;
}

async function profileSound(name, handle) {
  if (state.soundInfo[name] !== undefined) return;
  state.soundInfo[name] = null;
  try {
    var file = await handle.getFile();
    var head = new DataView(await file.slice(0, 8192).arrayBuffer());
    if (head.getUint32(0) !== 0x52494646 || head.getUint32(8) !== 0x57415645)
      throw new Error("not a wav");
    var at = 12;
    var byteRate = 0;
    var bits = 16;
    var dataAt = 0;
    var dataSize = 0;
    while (at + 8 <= head.byteLength) {
      var id = head.getUint32(at);
      var size = head.getUint32(at + 4, true);
      if (id === 0x666d7420) {                       // "fmt "
        byteRate = head.getUint32(at + 16, true);
        bits = head.getUint16(at + 22, true);
      } else if (id === 0x64617461) {                // "data"
        dataAt = at + 8;
        dataSize = Math.min(size, file.size - dataAt);
        break;
      }
      at += 8 + size + (size % 2);
    }
    if (!byteRate || !dataSize) throw new Error("no sound in it");

    var bars = [];
    for (var b = 0; b < 26; b++) {
      var from = dataAt + Math.floor(dataSize * b / 26);
      var take = Math.min(2048, dataAt + dataSize - from);
      var slice = await file.slice(from, from + take).arrayBuffer();
      var peak = 0;
      if (bits === 16) {
        var wide = new Int16Array(slice, 0, Math.floor(slice.byteLength / 2));
        for (var i = 0; i < wide.length; i++) peak = Math.max(peak, Math.abs(wide[i]));
        peak /= 32768;
      } else {
        var thin = new Uint8Array(slice);
        for (var j = 0; j < thin.length; j++) peak = Math.max(peak, Math.abs(thin[j] - 128));
        peak /= 128;
      }
      bars.push(peak);
    }
    state.soundInfo[name] = {seconds: Math.max(1, Math.round(dataSize / byteRate)),
                             bars: bars};
    renderSound();
  } catch (e) {
    state.soundInfo[name] = null;
  }
}

function mediaArt(name) {
  var held = state.art[name];
  if (held) return held.ratio ? held : null;
  var media = mediaNamed(name);
  var handle = media && (media.kind === "folder" ? media.thumbHandle : media.handle);
  if (!handle) return null;
  state.art[name] = {url: null, ratio: 0};
  handle.getFile().then(function (file) {
    var url = URL.createObjectURL(file);
    var probe = new Image();
    probe.onload = function () {
      state.art[name] = {url: url, w: probe.naturalWidth, h: probe.naturalHeight,
                         ratio: probe.naturalWidth / probe.naturalHeight};
      draw();
    };
    probe.src = url;
  }).catch(function () { delete state.art[name]; });
  return null;
}

async function rescanMedia() {
  if (!state.dirHandle || scanBusy) return;
  var was = JSON.stringify([state.media.map(function (m) { return m.name + m.kind; }),
                            state.sounds]);
  try {
    await scanMedia(state.dirHandle);
  } catch (e) {
    return;
  }
  var now = JSON.stringify([state.media.map(function (m) { return m.name + m.kind; }),
                            state.sounds]);
  if (now !== was) draw();
}

}

function binButton(name, kind) {

async function addFiles(kinds, what, takes) {
  var picked;
  try {
    picked = await window.showOpenFilePicker({multiple: true, types: [kinds],
                                              excludeAcceptAllOption: true});
  } catch (e) {
    return;                       // the dialog was dismissed
  }
  var landed = 0;
  var refused = [];
  for (var i = 0; i < picked.length; i++) {
    var file;
    try {
      // The dialog filters, and this holds where a platform's does not: a kind
      // the board cannot play never reaches the drive
      if (!takes.test(picked[i].name)) {
        refused.push(picked[i].name + " (not a kind the board plays)");
        continue;
      }
      file = await picked[i].getFile();
      var existing = null;
      try { existing = await state.dirHandle.getFileHandle(file.name); } catch (e) {}
      if (existing && !confirm(file.name + " is already on the drive. Replace it?"))
        continue;
      var handle = await state.dirHandle.getFileHandle(file.name, {create: true});
      var writable = await handle.createWritable();
      await writable.write(file);
      await writable.close();
      landed++;
    } catch (e) {
      refused.push(file ? file.name : "a file");
      if (e.name === "QuotaExceededError") {
        refused = refused.concat(picked.slice(i + 1).map(function (p) { return p.name; }));
        banner("The FX drive filled up: " + landed + " " + what + " copied, no room for " +
               refused.join(", ") + ". Delete something from it and try again.", true);
        break;
      }
    }
  }
  if (landed && !refused.length)
    banner(landed + " " + what + " copied to the drive.");
  else if (refused.length && landed)
    banner(landed + " copied; these did not arrive: " + refused.join(", "), true);
  else if (refused.length)
    banner("Nothing arrived: " + refused.join(", "), true);
  try { await scanMedia(state.dirHandle); } catch (e) {}
  draw();
}

async function removeFromDrive(name, kind) {
  var said = kind === "folder"
    ? "Delete the folder " + name + " and every picture in it from the FX drive?"
    : "Delete " + name + " from the FX drive?";
  if (!confirm(said)) return;
  try {
    await state.dirHandle.removeEntry(name, {recursive: kind === "folder"});
  } catch (e) {
    banner("Could not delete " + name + ": " + e.name + ". Is the drive showing?", true);
    return;
  }
  store();
  allBodies().forEach(function (body) {
    SCREENS.forEach(function (letter) {
      if (body.screens[letter].shows === name) body.screens[letter].shows = null;
    });
  });
  apply(slotAt(state.at).body);
  allBodies().forEach(function (body) {
    if (body.sound === name) {
      body.sound = null;
      body.soundLoop = false;
    }
  });
  apply(slotAt(state.at).body);
  delete state.soundInfo[name];
  delete state.art[name];
  try { await scanMedia(state.dirHandle); } catch (e) {}
  draw();
}

// ---- pictures, read off the drive in turn ------------------------------------------------------
// The drive is slow to read, so pictures come off it one at a time, those a screen or hub position
// shows in any scene first and the rest of the gallery after them

var pictureQueue = [];
var pictureReading = null;

// The pictures any scene puts on a screen or a hub position, worked out once a draw
var shownThisDraw = null;

var onePicturesDraw = draw;

draw = function () {
  shownThisDraw = null;
  onePicturesDraw();
};

function picturesShown() {
  if (shownThisDraw) return shownThisDraw;
  var shown = shownThisDraw = [];
  var bodies = [capture(), state.always.body].concat(state.scenes.map(function (scene) {
    return scene.body;
  }));
  bodies.forEach(function (body) {
    if (!body) return;
    Object.keys(body.screens || {}).forEach(function (letter) {
      if (body.screens[letter].shows) shown.push(body.screens[letter].shows);
    });
    Object.keys(body.places || {}).forEach(function (place) {
      if (body.places[place].shows) shown.push(body.places[place].shows);
    });
  });
  return shown;
}

function readNextPicture() {
  if (pictureReading || !pictureQueue.length) return;
  shownThisDraw = null;
  var shown = picturesShown();
  pictureQueue.sort(function (a, b) {
    return (shown.indexOf(b.name) >= 0) - (shown.indexOf(a.name) >= 0);
  });
  var next = pictureReading = pictureQueue.shift();
  next.handle.getFile().then(function (file) {
    return new Promise(function (settle) {
      var url = URL.createObjectURL(file);
      var probe = new Image();
      probe.onload = function () {
        state.art[next.name] = {url: url, w: probe.naturalWidth, h: probe.naturalHeight,
                                ratio: probe.naturalWidth / probe.naturalHeight};
        settle();
      };
      // One that will not load stays held empty, so it is not asked for again
      probe.onerror = function () { settle(); };
      probe.src = url;
    });
  }, function () {}).then(function () {
    pictureReading = null;
    draw();
    readNextPicture();
  });
}

mediaArt = function (name) {
  var held = state.art[name];
  if (held) return held.ratio ? held : null;
  var media = mediaNamed(name);
  var handle = media && (media.kind === "folder" ? media.thumbHandle : media.handle);
  if (!handle) return null;
  // Held empty while it waits, so each is asked for once
  state.art[name] = {url: null, ratio: 0};
  pictureQueue.push({name: name, handle: handle});
  setTimeout(readNextPicture, 0);
  return null;
};

// ---- hearing a sound --------------------------------------------------------------------------
// Each sound on the drive has a play button in its tile's corner, so it can be heard as well as
// seen. One plays at a time, and pressing it again, or playing another, stops it

var soundHandles = {};
var hearing = {name: null, audio: null, url: null};

function stopHearing() {
  if (hearing.audio) hearing.audio.pause();
  if (hearing.url) URL.revokeObjectURL(hearing.url);
  hearing = {name: null, audio: null, url: null};
}

async function hear(name) {
  var wasHearing = hearing.name;
  stopHearing();
  if (wasHearing === name || !soundHandles[name]) {
    draw();
    return;
  }
  try {
    var url = URL.createObjectURL(await soundHandles[name].getFile());
    var audio = new Audio(url);
    hearing = {name: name, audio: audio, url: url};
    audio.onended = function () {
      if (hearing.audio === audio) stopHearing();
      draw();
    };
    draw();
    await audio.play();
  } catch (e) {
    stopHearing();
    banner("Could not play " + name + ": " + e.name + ".", true);
    draw();
  }
}
