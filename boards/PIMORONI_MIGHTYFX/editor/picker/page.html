<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>__BOARD_NAME__ Picker</title>
<script src="catalogue.js"></script>
<style>

:root{
 --bg:#f5f3ef; --panel:#fff; --ink:#26221e; --dim:#8a8378; --line:#e2ddd4;
 --accent:#00857d; --accent-ink:#fff; --strip:#1f6feb; --mono:#c2570f; --dark:#191b1d;
}
*{box-sizing:border-box}
body{font:16px/1.5 system-ui,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.4rem;background:var(--panel);
 border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0 auto 0 0}
button{font:inherit;padding:.4rem .75rem;border:1px solid var(--line);border-radius:8px;
 background:var(--panel);cursor:pointer;font-size:.85rem}
button:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
main{max-width:60rem;margin:1.4rem auto;padding:0 1.4rem}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
 padding:1.1rem 1.4rem;margin:1.2rem 0}
.panel h2{font-size:1rem;margin:0 0 .7rem;display:flex;align-items:baseline;gap:.6rem}
.panel>summary{font:600 1rem system-ui,sans-serif;color:var(--ink);cursor:pointer;
 display:flex;align-items:baseline;gap:.6rem;list-style:none;margin:0}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary::before{content:"";width:.42rem;height:.42rem;flex-shrink:0;
 border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
 transform:rotate(45deg) translate(-1px,-1px);transition:transform .12s}
.panel[open]>summary::before{transform:rotate(-135deg) translate(-2px,-2px)}
.panel>summary:hover::before{border-color:var(--accent)}
.panel[open]>summary{margin-bottom:.7rem}
.says{font-weight:400;font-size:.85rem;color:var(--dim)}

.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .55rem;
 border-radius:9px;color:#fff;font:600 .85rem system-ui,sans-serif}
.chip.strip{background:var(--strip)}
.chip.mono{background:var(--mono)}
.chip input[type=number]{width:4.2rem;padding:.1rem .3rem;text-align:center;
 border:1px solid rgba(255,255,255,.55);border-radius:6px;
 background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:400}
.chip small{font-weight:400;opacity:.85}
.chip select{border:1px solid rgba(255,255,255,.55);border-radius:6px;
 background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:400;padding:.1rem .25rem}
.chip select option{color:var(--ink)}
.chip .drop{background:transparent;border:0;color:#fff;font-size:1.1rem;line-height:1;
 padding:0 .1rem;opacity:.8}
.chip .drop:hover{opacity:1}
/* A strip not fitted keeps its chip where it was and the panel its height, the offer to add it
   standing in the middle of the room the strip took */
.panel.strip{position:relative}
/* As tall as while editing, when it holds the length and order to change, so the strip below
   stays put as the board is edited */
.panel.strip .leds .chip{box-sizing:border-box;min-height:33px}
.panel.stripout > :not(summary):not(.leds){visibility:hidden}
.panel.stripout .addstrip{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%)}
.head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.2rem}
.head .gap{flex:1}
/* The row of settings that belongs to the bar, which the run above it is cut into. As tall as
   the step buttons, so a side without them starts its bar level with one that has them */
.head.cutting{margin-top:.9rem;min-height:1.75rem}
.head.cutting .what{font-size:.82rem;color:var(--dim)}

/* Zoomed in, the bar is wider than the room it has and scrolls inside it. The padding
   and the pull back up leave the labels above a cut somewhere to be drawn */
.scroller{overflow-x:auto;overflow-y:hidden;padding-top:1.2rem;margin-top:-1.2rem}
.scroller::-webkit-scrollbar{height:9px}
.scroller::-webkit-scrollbar-thumb{background:#cfc9bf;border-radius:99px}
.scroller::-webkit-scrollbar-track{background:#f0eeea;border-radius:99px}
.howfar{font-size:.78rem;color:var(--dim);min-width:2.8rem;text-align:center;
 font-variant-numeric:tabular-nums}
/* The things that are done rather than said: a magnifier and two arrows, drawn so the
   tools row reads as a row of buttons rather than a sentence */
button.round{width:1.9rem;height:1.75rem;padding:0;display:inline-flex;
 align-items:center;justify-content:center;color:var(--ink)}
button.round:hover:enabled{border-color:var(--accent);color:var(--accent)}
button.round svg{display:block}

/* ---- the row of cells, which is where the cutting happens ---- */
/* Every light is a cell. Cells joined together are one section, and a section is one
   entry in the file. The bar is the editing surface; the drawing under it is the truth */
.bar{display:flex;gap:2px;align-items:stretch;user-select:none;margin-top:1.1rem}
/* Not clipped, so a cut can say what it is above the bar rather than inside it */
.sec{position:relative;min-width:0;border:2px solid var(--line);border-radius:8px;
 background:var(--panel);cursor:pointer;padding:0}
.sec.picked{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,133,125,.16)}
/* What the stretch was given, as one of the look's own colours held still. The run
   below is the one that moves, so this is not the same picture twice */
.sec .lit{display:block;height:1.5rem;border-radius:6px 6px 0 0}
.sec .lit.nothing{background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 6px,
 #e4e0d9 6px,#e4e0d9 12px)}
/* Cutting happens in the coloured band only. The name below it is always plain
   section, so a stretch cut every light still has somewhere to be clicked and picked */
.sec .cuts{position:absolute;top:0;left:0;right:0;height:1.5rem;pointer-events:none}
.sec .cut{position:absolute;top:0;bottom:0;transform:translateX(-50%);
 pointer-events:auto;cursor:col-resize}
/* Hovering the stretch shows every place it could be cut, which is what someone
   deciding where to cut is asking to be shown. The band behind it is whatever the
   stretch plays, so the line carries a pale halo and reads against a dark colour on
   the halo and against a bright one on the line itself */
.sec .cut::before{content:"";position:absolute;top:2px;bottom:2px;left:50%;width:1px;
 margin-left:-0.5px;background:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.85);
 opacity:0;transition:opacity .1s}
/* Near enough solid, since opacity dims the halo along with the line and it is the halo
   that carries a bright band */
.sec:hover .cut::before{opacity:.85}
.sec .cut:hover::before{opacity:1;width:2px;margin-left:-1px;background:var(--accent)}
/* Which two lights this cut would fall between, said where it is being aimed */
.sec .cut::after{content:attr(data-says);position:absolute;bottom:100%;left:50%;
 transform:translateX(-50%);margin-bottom:4px;padding:.05rem .35rem;border-radius:5px;
 background:var(--ink);color:#fff;font:600 .62rem/1.6 system-ui,sans-serif;
 white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;z-index:3}
.sec .cut:hover::after{opacity:1}
.sec .says{display:block;font:600 .68rem/1.5 system-ui,sans-serif;color:var(--ink);
 padding:0 .3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 text-align:center}
.sec .says em{font-style:normal;font-weight:400;color:var(--dim)}
.sec.narrow .says{font-size:.6rem}

/* A cut that is already there: dragged to move it along the run, or taken out by the
   cross under it, which joins the two stretches either side. Two acts, two targets,
   since a drag that also meant a click was never going to be told apart reliably */
.edge{flex:0 0 6px;cursor:col-resize;border-radius:3px;background:transparent;
 align-self:stretch;margin:0 -4px;z-index:2;position:relative}
.edge:hover,.edge.holding{background:var(--accent)}
.edge .drop{position:absolute;top:100%;left:50%;transform:translateX(-50%);
 margin-top:3px;width:1.05rem;height:1.05rem;border-radius:50%;border:1px solid var(--line);
 background:var(--panel);color:var(--dim);cursor:pointer;padding:0;
 font:600 .7rem/1 system-ui,sans-serif;display:flex;align-items:center;
 justify-content:center;opacity:0;transition:opacity .1s}
.edge:hover .drop,.edge .drop:hover{opacity:1}
.edge .drop:hover{border-color:var(--warn);color:var(--warn)}
/* Room under the bar for the crosses to sit in */
.bar{padding-bottom:1.4rem}

/* How many lights are in a run, ticked off under it while there are few enough to see */
.ticks{display:flex;gap:2px;margin-bottom:.15rem}
.ticks span{flex:1;text-align:center;font:400 .6rem/1.4 system-ui,sans-serif;
 color:var(--dim);min-width:0;overflow:hidden}

.tools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.8rem 0 0;
 font-size:.85rem;color:var(--dim)}
.tools input[type=number]{width:3.4rem;padding:.25rem .3rem;border:1px solid var(--line);
 border-radius:7px;font:inherit;font-size:.85rem;text-align:center}
.tools .gap{flex:1}

/* The run itself, under the bar it is cut by */
.run{background:var(--panel);border:1px solid var(--line);border-radius:10px;
 padding:.8rem .7rem;margin-top:.7rem}
.run svg{display:block;width:100%;height:auto}
.run svg .ringed{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:.9;
 pointer-events:none}
/* The whole span a stretch covers takes the click, not only the lights along it */
.run svg .span{fill:transparent;cursor:pointer}
.run svg .span:hover{fill:rgba(0,133,125,.07)}
.lamps{display:flex;gap:.4rem;justify-content:flex-start;flex-wrap:wrap}
.lamp{padding:.25rem .25rem .1rem;border:1px solid var(--line);border-radius:8px;
 background:var(--panel);line-height:1;cursor:grab}
.lamp{cursor:pointer}
/* The stretch being edited, ringed on the preview so it and the bar agree */
.lamp.ringed{box-shadow:0 0 0 2px var(--accent)}
.lamp.carried{opacity:.35}
.lamp.landing{border-color:var(--accent);box-shadow:-2px 0 0 var(--accent)}
.lamp i{display:block;width:1.5rem;height:1.5rem;border-radius:50%;
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.lamp b{display:block;font:400 .66rem/1.6 system-ui,sans-serif;color:var(--dim);
 text-align:center}

/* What the picked section is playing */
.chosen{margin-top:.9rem;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem}
.chosen .who{font-size:.82rem;color:var(--dim);margin-bottom:.45rem}
.chosen .who b{color:var(--ink);font-size:.92rem}
/* The gallery. A card shows what a look actually does, and is tapped onto the stretch being
   worked on */
.gallery-head{display:flex;align-items:baseline;gap:.6rem;margin:1.5rem 0 .5rem;
 font:600 1.02rem system-ui,sans-serif}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.4rem,1fr));
 gap:.7rem;margin:0 0 .3rem}
.card{border:2px solid var(--line);border-radius:11px;overflow:hidden;cursor:grab;
 background:var(--panel);transition:transform .08s,border-color .12s}
.card:hover{transform:translateY(-2px)}
.card:active{cursor:grabbing}
.card.picked{border-color:var(--accent)}
.card .face{height:2.9rem;display:flex;background:var(--dark)}
.card .face span{flex:1}
.card.nothing .face{background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 7px,
 #e4e0d9 7px,#e4e0d9 14px)}
.card .name{padding:.42rem .65rem .52rem;font:600 .85rem system-ui,sans-serif;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.picked .name{color:var(--accent)}
.card.dragged{opacity:.45}

/* While a look is being carried, every stretch that could take it says so */
body.carrying .sec{outline:2px dashed rgba(0,133,125,.4);outline-offset:-3px}
.sec.landing{outline:2px solid var(--accent);outline-offset:-3px}
.run svg .span.landing{fill:rgba(0,133,125,.22)}
.tuning{display:grid;grid-template-columns:auto 1fr;gap:.25rem .7rem;align-items:center}
.tuning label{font-size:.8rem;color:var(--dim);white-space:nowrap}
.tuning input[type=range]{width:100%;accent-color:var(--accent)}
.tuning input[type=color]{width:2.8rem;height:1.4rem;padding:1px;border:1px solid var(--line);
 border-radius:6px;background:var(--panel);cursor:pointer;justify-self:start}

pre.file{font:.85rem/1.5 ui-monospace,Consolas,monospace;background:var(--panel);
 border:1px solid var(--line);border-radius:10px;padding:1rem;white-space:pre-wrap}
.s-target{color:#1f6feb}
.s-effect{color:#0a7f78;font-weight:600}
.s-value{color:#a8500a}
.s-name{color:var(--ink)}
.s-punc{color:#5d656e}
.s-colon{color:var(--ink);font-weight:700}
.s-comment{color:#8a8378;font-style:italic}
details{margin:1.2rem 0}
summary{cursor:pointer;color:var(--dim);font-size:.9rem}
.note{background:#e7f2f1;border-radius:10px;padding:.7rem 1.1rem;margin:1rem 0 0;
 font-size:.85rem}
footer{max-width:60rem;margin:0 auto 2rem;padding:0 1.4rem;font-size:.8rem;color:var(--dim)}




/* ---- lamps and runs ---- */

/* An output's lamp says which of the two things it is. A colour one is one lens; a
   broken one is three, and the three keep the output's own outline around them so the
   connector they share is still readable */
.lamp.colourlamp i{background:#2a2d30}
.lamp.chan b{font-size:.6rem}

/* A broken-out lamp says which of its output's three channels drives it, cut into the
   corner. Which output that is has no mark of its own: pointing at one of the three is
   what shows them, and a tint per output was more colour than anyone could hold */
.lamp.chan{position:relative;overflow:hidden}
.lamp.chan::before{content:"";position:absolute;top:0;left:0;width:0;height:0;
 border-width:.4rem;border-style:solid;
 border-color:var(--chan) transparent transparent var(--chan)}

/* Pointing at one channel lights the edges of all three of its output, each in the
   colour of the channel it is driven from. An outline rather than a border, so nothing
   moves as it comes and goes, and inset so it reads as the edge thickening */
.lamp.chan.kin{outline:2px solid var(--chan);outline-offset:-1px}
.outgroup.kin .cross{display:inline-flex}
/* The run is one block of lamps. An output is a space in it, not a box around it: the
   lamps are close within an output and further apart between them, which is what says
   where one connector ends and the next begins */
.outgroup{display:flex;align-items:stretch;gap:.15rem;position:relative;
 margin-right:.5rem}
.lamps{gap:0}
/* A lamp is what is picked up and placed, so a box only means that these lamps happen
   to sit next to each other and share a connector */
.lamp{cursor:grab}
.lamp:active{cursor:grabbing}
.lamp.carried{opacity:.35}
.lamp.landing{box-shadow:-3px 0 0 var(--accent)}
.lamp.landing.after{box-shadow:3px 0 0 var(--accent)}

/* One set of looks, drawn for the kind being worked on. A tab per kind, and a kind the
   board has none of is offered but not taken: it says what breaking an output out would
   give rather than leaving a gap where a choice used to be */
.tabs{display:flex;align-items:baseline;gap:.4rem;margin:1.4rem 0 .5rem}
.tabs .of{font:600 1.02rem system-ui,sans-serif;margin-right:.3rem}
.tabs button{font-size:.82rem;padding:.3rem .7rem;border-radius:9px}
.tabs button.on{border-color:var(--accent);color:var(--accent);font-weight:600;
 background:#f0faf9}
.tabs .says{margin-left:auto}

/* Sided, the two tabs sit over the sides they are for and on the edge of the cards they
   change, so which lights a tab means is read from where it is and what it changes from
   what it is joined to */
/* Inset by more than the box's corner radius, so its rounded corners stay whole either
   side of the tab rather than being squared off by it */
.tabs.sides{justify-content:space-between;gap:0;margin-bottom:0;padding:0 .9rem}
.tabs.sides button{border-radius:10px 10px 0 0;border-bottom-color:transparent;
 position:relative;top:1px;background:var(--bg)}
.tabs.sides button.on{background:var(--panel);border-color:var(--line);
 border-bottom-color:var(--panel);color:var(--accent);font-weight:600}
.tabs.sides button:disabled{opacity:.5}
.shelf{border:1px solid var(--line);border-radius:12px;background:var(--panel);
 padding:.7rem .9rem .9rem;margin:0 0 1rem}
.shelf.bare{border:none;background:none;padding:0;margin:1.2rem 0 1rem}
.shelf .says{display:block;margin:0 0 .6rem}
/* A look this kind of lamp cannot play stays in the set, so the set never changes
   length under the pointer and nobody wonders where a card went */
.card.cannot{opacity:.35;cursor:default}
.card.cannot:hover{transform:none}

/* The two kinds side by side in one panel: the colour outputs pack to the left, the mono
   lamps to the right, and the gap between them is what an output crosses. Each side is
   as wide as what it holds, so the divide moves as outputs are broken out and put back */
.sides{display:flex;align-items:flex-start;gap:1rem}
/* A side is never narrower than the rows under it need: squeezed below this its counts
   wrap, and a wrapped count puts the two sides out of line with each other */
.side{min-width:8.5rem;display:flex;flex-direction:column}
/* A side holding nothing has nothing to cut and nothing to show, so it says so and
   stands aside */
.side.empty .run,.side.empty .head.cutting,.side.empty>div[id$="Bar"]{display:none}
.side .run{width:100%}
#sideA .lamps{justify-content:flex-start}
#sideB .lamps{justify-content:flex-end}
/* On the mono side every group is one output's three channels, each lamp saying which it
   is, so the run reads evenly and the wider gap between groups is not needed to tell one
   connector from the next */
#sideB .outgroup{margin-right:0;margin-left:.15rem}
#sideB .sidehead{flex-direction:row-reverse}

/* The right side's row mirrors the left, but the two step buttons keep their order:
   reversing the row would put redo before undo */
#sideB .head.cutting{justify-content:flex-end}
#sideB .head.cutting .gap{order:-1}
#sideB .head.cutting .what{order:3}
/* A count that wraps makes its side taller than the other, so it never wraps */
.head.cutting .what{white-space:nowrap}
.sidehead{display:flex;align-items:baseline;gap:.5rem;font:600 .82rem system-ui,sans-serif;
 margin:0 0 .35rem;flex-wrap:nowrap;white-space:nowrap;min-width:0;height:1.35rem}
.sidehead span{font-weight:400;font-size:.75rem;color:var(--dim);min-width:0;
 overflow:hidden;text-overflow:ellipsis}
.side.nothing{font-size:.8rem;color:var(--dim);padding:1.2rem .4rem;text-align:center;
 border:1px dashed var(--line);border-radius:11px;background:#fcfbf9}

/* The arrow an output crosses on. It sits on the output itself, pointing at the side it
   would move to */
.cross{position:absolute;top:-.45rem;width:1.2rem;height:1.2rem;padding:0;
 border-radius:50%;display:none;align-items:center;justify-content:center;z-index:2;
 color:var(--rgbout);border-color:#d9c8f5;background:var(--panel);
 box-shadow:0 1px 3px rgba(0,0,0,.12)}
.outgroup:hover .cross{display:inline-flex}
#sideA .cross{right:-.3rem}
#sideB .cross{left:-.3rem}
.cross:hover:enabled{border-color:var(--rgbout);background:#f6f1ff}
.cross svg{display:block}


/* Scenes take turns, so they are tabs: the bar is only drawn once there is more
   than the one everything starts in, and the plus is always there */
.tabbar{display:flex;flex-wrap:wrap;align-items:stretch;gap:.45rem;margin:.4rem 0 0}
.tab{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;
 gap:.3rem;width:8.2rem;padding:.4rem .55rem;border:1px solid var(--line);
 border-radius:9px 9px 0 0;border-bottom-color:var(--line);background:#f1efeb;
 cursor:pointer;text-align:left;margin-bottom:-1px;min-height:3.4rem;overflow:hidden}
.tab b,.tab small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{border-color:var(--dim)}
/* The one being edited joins the area below it, as a browser tab joins its page */
.tab.on{background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel);
 box-shadow:inset 0 3px 0 var(--accent)}
.tab.on b{color:var(--ink)}
.tabbar.wrapped{display:grid;gap:.45rem;margin-bottom:.5rem;
 grid-template-columns:repeat(auto-fill,minmax(8.4rem,1fr))}
.tabbar.wrapped .tab{width:auto;border-radius:9px;margin-bottom:0}
.tabbar.wrapped .plus{margin:0;width:100%;min-height:3.4rem;justify-content:center;
 border-style:dashed}
.tabbar.wrapped .tab.on{border-color:var(--accent);border-bottom-color:var(--accent)}
.scenebody.framed.loose{border-radius:12px}
.tab .look{display:flex;width:100%;height:.32rem;border-radius:2px;overflow:hidden;
 background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 3px,#e0dbd2 3px,#e0dbd2 6px)}
.tab .look span{flex:1}
.tab b{font:600 .78rem/1.3 system-ui,sans-serif;color:var(--ink)}
.tab small{font-size:.68rem;color:var(--dim)}
.tab .shut{float:right;border:0;background:none;color:var(--dim);cursor:pointer;
 font-size:.85rem;line-height:1;padding:0 0 0 .3rem}
.tab .shut:hover{color:#b4443a}
.tab.carried{opacity:.4}
.tab.landing{box-shadow:-2px 0 0 var(--accent)}
.plus{margin-left:auto;align-self:center;display:flex;align-items:center;gap:.35rem;
 padding:.42rem .7rem;border:1px solid rgba(15,138,114,.4);border-radius:9px;
 background:rgba(15,138,114,.08);color:var(--accent);cursor:pointer;
 font:600 .78rem system-ui,sans-serif}
.plus:hover{background:rgba(15,138,114,.16);border-color:var(--accent)}
.plus svg{display:block}

/* Everything inside the frame belongs to the tab above it */
.scenebody{border:1px solid transparent;border-radius:0 12px 12px 12px;padding:0}
.scenebody.framed{border-color:var(--line);background:var(--panel);
 padding:.9rem 1rem 1.1rem;margin-bottom:1rem}
.scenebody.framed .panel{background:#faf9f7}

/* What one scene is called, and how long it holds */
.sceneset{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;
 margin:0 0 .9rem;font-size:.82rem;color:var(--dim)}
.sceneset input{border:1px solid var(--line);border-radius:7px;background:#fff;
 padding:.32rem .5rem;font:inherit;color:var(--ink)}
.sceneset input:focus{outline:2px solid rgba(15,138,114,.35);outline-offset:1px;
 border-color:var(--accent)}
.sceneset input[type=text]{width:10rem;font-weight:600}
.sceneset input[type=number]{width:4.2rem;text-align:center}
.sceneset label{display:flex;align-items:center;gap:.35rem;cursor:pointer;
 padding:.3rem .55rem;border:1px solid var(--line);border-radius:7px;
 background:var(--panel)}
.sceneset label:hover{border-color:var(--dim)}





/* ---- choosing a colour ---- */

.way{background:var(--panel);border:1px solid var(--line);border-radius:14px;
 padding:1.1rem 1.4rem;margin:1.2rem 0}
.way>h2{font-size:1rem;margin:0 0 .25rem;display:flex;align-items:baseline;gap:.6rem}
.way>p{margin:0 0 .9rem;font-size:.85rem;color:var(--dim);max-width:54rem}

/* The lamps a choice is judged on: the effect gives the level, the choice the colour */
.stage{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap;margin:.2rem 0 .9rem}
.bulbs{display:flex;gap:.3rem;padding:.5rem .6rem;border-radius:11px;background:var(--dark)}
.bulbs i{display:block;width:1.6rem;height:1.6rem;border-radius:50%;
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.playing{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--dim)}
.playing select{font:inherit;font-size:.8rem;padding:.15rem .3rem;border-radius:6px;
 border:1px solid var(--line);background:var(--panel);color:inherit}

/* The controls each way offers, laid out the same so only the colour part differs */
.controls{display:grid;grid-template-columns:auto 1fr;gap:.45rem .8rem;align-items:center;
 max-width:34rem}
.controls label{font-size:.82rem;color:var(--dim);white-space:nowrap}
.controls input[type=range]{width:100%;accent-color:var(--accent)}
.controls input[type=color]{width:3rem;height:1.5rem;padding:1px;border-radius:6px;
 border:1px solid var(--line);background:var(--panel)}

/* The ten the file names, as a row to pick from */
.swatches{display:flex;gap:.35rem;flex-wrap:wrap}
.swatch{width:2.1rem;height:2.1rem;padding:0;border-radius:9px;border:2px solid var(--line);
 cursor:pointer;position:relative}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,133,125,.2)}
.swatch b{position:absolute;left:0;right:0;top:calc(100% + 2px);font:400 .6rem/1 system-ui,
 sans-serif;color:var(--dim);text-align:center}
.swatchrow{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1.1rem}

/* A hue strip: one slider through the hues, with the named ones marked along it */
.hue{position:relative;width:100%;max-width:30rem}
.hue .huebar{position:relative}
/* The strip itself is what is dragged: the slider lies over it, invisible, so there is
   one control and not a bar with a track beneath it */
.hue input[type=range]{position:absolute;left:0;top:0;width:100%;height:1.2rem;margin:0;
 opacity:0;cursor:pointer}
.huebar{height:1.1rem;border-radius:7px;border:1px solid var(--line);
 background:linear-gradient(to right,#f00 0%,#ff0 16.7%,#0f0 33.3%,#0ff 50%,
 #00f 66.7%,#f0f 83.3%,#f00 100%)}
.huestops{position:relative;height:1rem;font:400 .6rem/1 system-ui,sans-serif;
 color:var(--dim)}
.huestops span{position:absolute;transform:translateX(-50%);top:.15rem}
.huemark{position:absolute;top:-1px;width:3px;height:calc(1.1rem + 2px);border-radius:2px;
 background:var(--ink);box-shadow:0 0 0 1px #fff;transform:translateX(-50%);
 pointer-events:none}

/* Ramps, for the effects that want a sequence rather than one colour */
.ramps{display:flex;gap:.5rem;flex-wrap:wrap}
.ramp{padding:0;border:2px solid var(--line);border-radius:10px;cursor:pointer;
 overflow:hidden;width:7.5rem}
.ramp.on{border-color:var(--accent)}
.ramp .strip{display:flex;height:1.5rem}
.ramp .strip span{flex:1}
.ramp .name{padding:.22rem .4rem .3rem;font:600 .74rem system-ui,sans-serif}

.wrote{background:var(--dark);color:#e8e4dc;border-radius:10px;padding:.5rem .8rem;
 font:.76rem/1.5 ui-monospace,Menlo,Consolas,monospace;margin:.9rem 0 0;
 white-space:pre-wrap;overflow-x:auto}
.wrote .s-target{color:#7fd4ff}
.wrote .s-effect{color:#ffd479}
.wrote .s-name{color:#b7e3a0}
.wrote .s-value{color:#f2b8c6}
.wrote .s-punc,.wrote .s-colon{color:#8a8378}

/* The custom swatch, and the field it opens. Hue runs across and saturation down, at one
   value throughout: how bright it burns is the setting below, never the field */
.swatch.custom{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.swatch.custom::after{content:"";position:absolute;inset:25%;border-radius:50%;
 background:var(--panel)}
.swatch.custom b{color:var(--ink)}
.field{position:relative;width:15rem;height:9rem;border-radius:10px;
 border:1px solid var(--line);margin:0 0 1.1rem;cursor:crosshair;touch-action:none;
 background:linear-gradient(to bottom,rgba(255,255,255,0),#fff),
 linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.field .at{position:absolute;width:.85rem;height:.85rem;border-radius:50%;
 border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translate(-50%,-50%);
 pointer-events:none}
/* The field opens beside the swatches rather than under them, so the picker is one thing
   to the right and the brightness below is plainly not part of it */
.sets{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin:0 0 .8rem}
.sets label{font-size:.82rem;color:var(--dim);margin-right:.2rem}
.sets button{font-size:.78rem;padding:.28rem .6rem;border-radius:8px}
.sets button.on{border-color:var(--accent);color:var(--accent);font-weight:600;
 background:#f0faf9}
/* The one settled on, so the page says which of the sets is the answer */
.sets button.settled::after{content:" \2713";font-weight:600}
.pickrow{display:flex;align-items:flex-start;gap:1.1rem;flex-wrap:wrap}
.shiprow{flex-wrap:nowrap;gap:.22rem;margin-bottom:.9rem}
.hexline{display:flex;align-items:center;gap:.6rem;margin:0 0 1.1rem}
.hexline label{font-size:.82rem;color:var(--dim)}
.hexline input{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;
 font-size:.82rem;width:6.5rem;padding:.25rem .45rem;border-radius:7px;
 border:1px solid var(--line);background:var(--panel);color:inherit}

.note{margin-top:.9rem;padding:.6rem .8rem;border-radius:10px;background:#eef6f5;
 font-size:.82rem;color:#2c5c58}
.note b{font-weight:600}
table{border-collapse:collapse;font-size:.82rem;margin:.4rem 0 0;width:100%}
th,td{text-align:left;padding:.3rem .5rem;border-bottom:1px solid var(--line);
 vertical-align:top}
th{font-weight:600;color:var(--dim);font-size:.76rem}


/* ---- what this page adds ---- */

/* The scenes' frame is padded once there are scenes, so it is pulled out by that padding
   and nothing inside it moves when the first scene is added. Its border is there, unseen,
   before */
.scenebody.framed{margin-left:-1rem;margin-right:-1rem}
.tabbar{margin-left:-1rem;margin-right:-1rem}
.s-scene{color:#7b3fb8;font-weight:600}

/* Which way a stretch runs, at the end of the line naming it, greyed where its look is the
   same from either end */
.chosen .who.withway{display:flex;align-items:center;gap:.6rem}
/* It is the screens' toggle, its rules repeated for the pages that have no screens */
.chosen .direction{margin-left:auto;border:1.5px solid var(--line);border-radius:8px;
 background:var(--panel);padding:.22rem .55rem;font:600 .76rem system-ui,sans-serif;
 color:var(--ink);display:inline-flex;align-items:center;gap:.35rem;cursor:pointer}
.chosen .direction.on{border-color:var(--accent);color:var(--accent);
 background:color-mix(in srgb,var(--accent) 8%,transparent)}
.chosen .direction svg path{fill:none;stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}
.chosen .direction:disabled{color:var(--dim);opacity:.4;cursor:default}

/* A stand-in says what it stands in for, under the stretch playing it */
.chosen .standin{margin-top:.5rem;font-size:.85rem;color:var(--dim)}

/* A card whose look takes a colour carries a mark at the end of its name's row, as far
   from the card's right edge as from the row's top and bottom */
.card{position:relative}
:root{--mark:20px;--namerow:2.1rem}
.card .tint{position:absolute;right:calc((var(--namerow) - var(--mark)) / 2);
 bottom:calc((var(--namerow) - var(--mark)) / 2);width:var(--mark);height:var(--mark);
 display:block;color:#b5aea3}

/* One colour picker for a stretch's colour and a screen's background: one row of swatches
   spanning the section, each as wide as "magenta" and no wider, spread to keep both ends
   flush and named under them once the section has room; custom last as a rainbow ring whose
   middle is the custom colour, Nothing's stripes until there is one; the field under the row
   with the hex beside it over the colour itself */
.chosen .colourpick{margin-top:.6rem}
.groundpick{container-type:inline-size}
.sswatches{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,2.1rem);
 justify-content:space-between;gap:.25rem;margin-top:.45rem}
.sswatches button{width:auto;height:auto;aspect-ratio:1;padding:0;border:2px solid var(--line);
 border-radius:5px;cursor:pointer;position:relative}
.sswatches button b{display:none;position:absolute;left:50%;right:auto;top:calc(100% + 2px);
 transform:translateX(-50%);font:400 .6rem/1 system-ui,sans-serif;color:var(--dim);
 white-space:nowrap;pointer-events:none}
@container (min-width:34rem){
 .sswatches{margin-bottom:.9rem}
 .sswatches button b{display:block}
}
.sswatches button.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(15,138,114,.25)}
.sswatches button.custom{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.sswatches button.custom::after{content:"";position:absolute;inset:24%;border-radius:50%;
 background:var(--picked,#fff);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sswatches button.custom:not([style*="--picked"])::after{box-shadow:0 0 0 1px rgba(0,0,0,.25);
 background:repeating-linear-gradient(45deg,#f4f1ec,#f4f1ec 2px,#a9a194 2px,#a9a194 3.5px)}
.scustom{display:flex;align-items:flex-start;gap:.8rem;margin-top:.55rem}
.scustom .field{flex:1;width:auto;height:6.5rem;margin:0}
.scustom .hexline{display:flex;align-items:center;gap:.4rem;margin:0;font-size:.8rem;
 color:var(--dim)}
.scustom .hexline input{width:5.2rem}
.scustomside{display:flex;flex-direction:column;gap:.4rem;align-self:stretch}
.scustompreview{flex:1;border-radius:8px;border:1px solid var(--line);min-height:3rem}
/* The sliders follow the colour where a stretch has one */
.chosen .colourpick + .tuning{margin-top:.6rem}
/* The looks in groups, a heading over each row */
.groupedlooks .gallery-head,.programview .gallery-head{margin:1rem 0 .4rem;font-size:.92rem}
.groupedlooks .gallery-head:first-child{margin-top:0}
.groupedlooks .gallery-head .says,.programview .gallery-head .says{font:400 .8rem system-ui,sans-serif;
 color:var(--dim)}
/* Nothing, and a sound's silence, as a card made small at the end of a line: the cards' own
   corners, border and face, the face beside the name */
.card.nothing.small{margin-left:auto;align-self:center;display:flex;align-items:stretch;
 border-radius:9px;cursor:pointer}
.card.nothing.small .face{width:2.4rem;height:auto;min-height:1.7rem}
.card.nothing.small .name{padding:.3rem .65rem;font-size:.8rem;align-self:center}
/* The sound's Loop and silence on one line above its tiles */
.soundhead{display:flex;align-items:center;margin:0 0 .7rem}
/* Always on's note stands where a scene's settings do, as tall, so nothing moves between them */
.sceneset{min-height:2rem}
.sceneset.alwaysnote{display:block;line-height:2rem;font-size:.84rem;color:var(--dim);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The tools under a run, in the screens' button style. Split and Repeat are each one outlined
   group read as a sentence, words then number then the buttons that act, divided as the
   screens' segmented choices are. The screens' rules are repeated for the pages with none */
.stretchtools{gap:.5rem .8rem}
.stretchtools .stoggle{border:1.5px solid var(--line);border-radius:8px;background:var(--panel);
 padding:.28rem .55rem;font:600 .76rem system-ui,sans-serif;color:var(--ink);display:inline-flex;
 align-items:center;gap:.35rem;cursor:pointer}
.stretchtools .stoggle:disabled{opacity:.4;cursor:default}
.stretchtools .toolset{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);
 border-radius:8px;overflow:hidden;background:var(--panel);font:600 .76rem system-ui,sans-serif}
.stretchtools .toolsays{display:inline-flex;align-items:center;gap:.35rem;padding:0 .45rem 0 .55rem;
 color:var(--dim)}
.stretchtools .toolset input[type=number]{width:2.6rem;margin:.18rem .3rem .18rem 0;padding:.1rem .2rem;
 font:inherit;border:1px solid var(--line);border-radius:6px;text-align:center}
.stretchtools .toolact{border:0;border-left:1px solid var(--line);border-radius:0;
 background:var(--panel);padding:.28rem .55rem;font:inherit;color:var(--accent);cursor:pointer}
.stretchtools .toolact:hover:enabled{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.stretchtools .toolact:disabled{color:var(--dim);opacity:.5;cursor:default}
/* What Repeat copies, a swatch a stretch, and on the bar while it is pointed at */
.repeatchips{display:inline-flex;align-items:center;gap:2px;padding-right:.45rem}
.repeatchip{width:1.1rem;height:.9rem;border-radius:3px;border:1px solid var(--line)}
.repeatchip.nothing{background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 2px,#d8d2c8 2px,
 #d8d2c8 3.5px)}
/* A cut's cross sits above the bar, in the room already kept there for where a new cut would
   fall, the two never showing at once: one is pointed at on a cut, the other inside a
   stretch. So the room under the bar the cross had goes */
.edge .drop{top:auto;bottom:100%;margin-top:0;margin-bottom:3px}
.bar{padding-bottom:0}
/* A zoomed bar scrolls, and a little room keeps its stretches off the scrollbar */
.scroller.zoomed .bar{padding-bottom:.4rem}
/* A cut's label near either end of a bar is turned inward, so it never overhangs the bar */
.sec .cut.nearstart::after{left:0;transform:none}
.sec .cut.nearend::after{left:auto;right:0;transform:none}
/* A panel in the tabs' grid may be narrower than its content, which a grid item is not by
   default: a bar of a hundred labelled stretches otherwise widened the page to fit them all,
   and the strip drawn above it grew with it, the bar being what scrolls */
#tabStack > *{min-width:0}
.bar > .sec.repeatfrom{outline:2px dashed var(--accent);outline-offset:-2px}
.bar > .sec.repeatover{opacity:.35}
/* A setting's icon before its name, a line drawing in the name's grey */
.chosen .tuning label.withicon{display:inline-flex;align-items:center;gap:.4rem}
.settingicon{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;
 stroke-linecap:round;stroke-linejoin:round}
.settingicon .filled{fill:currentColor;stroke:none}
/* A signal's timings named by the state each holds, drawn as the signal shows it, a flashing
   lamp pulsing as it would */
.chosen .tuning label.signalstate{display:inline-flex;align-items:center;gap:.4rem}
.signalface{display:block;flex:none}
.signalface .flashing{animation:signalflash 1s steps(2,jump-none) infinite}
@keyframes signalflash{from{opacity:1}to{opacity:.2}}
/* The figure beside each slider, on the page that tries it: a box the file's value is typed
   in and its unit, each a column of the sliders' grid sized to this panel's own, and the
   drawer's handle down the right. Shut, the two columns are gone */
body.figures .chosen .tuning{grid-template-columns:auto 1fr auto}
body.figures .chosen .tuning.figuresopen{grid-template-columns:auto 1fr auto auto auto}
.chosen .tuning:not(.figuresopen) .figurebox,
.chosen .tuning:not(.figuresopen) .figureunit{display:none}
/* No taller than the row's own label, so opening the drawer moves no slider */
.figurebox{box-sizing:content-box;justify-self:end;padding:0 .35rem;height:calc(1.2rem - 2px);
 line-height:calc(1.2rem - 2px);
 border:1px solid var(--line);border-radius:6px;font:600 .76rem system-ui,sans-serif;
 text-align:right;font-variant-numeric:tabular-nums}
span.figurebox{border:0}
.figurebox.paletteswatches{display:inline-flex;gap:2px;padding:0;justify-self:start}
.chosen .tuning:not(.figuresopen) .paletteswatches{display:none}
.figureunit{font-size:.74rem;color:var(--dim)}
.figurehandle{grid-column:-2;align-self:stretch;width:1.5rem;padding:0;border:1px solid var(--line);
 border-radius:6px;background:var(--panel);color:var(--dim);font:600 1.35rem/1 system-ui,sans-serif;
 cursor:pointer}
.figurehandle:hover{color:var(--ink);border-color:var(--dim)}
/* A scene's and a sound's toggles in the page's own colour */
.sceneset,#sound{--hub:var(--accent)}
/* No tab row over the gallery on the pages built on the tabs page, and no gap left for one */
body[data-pageway] #looks>.tabs:empty{display:none}
body[data-pageway] #looks>.shelf.bare{margin-top:0}
/* Blink's colours, each a chip the picker under them changes while it is ringed */
.blinklist{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem;margin-bottom:.1rem;
 font-size:.82rem;color:var(--dim)}
.blinksay{margin-right:.2rem}
.blinkchip{width:1.6rem;height:1.6rem;padding:0;border:2px solid var(--line);border-radius:5px;
 background:var(--chip);cursor:pointer}
.blinkchip.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(15,138,114,.25)}
.blinkdrop{border:none;background:none;padding:0 .3rem 0 0;margin-left:-.2rem;color:var(--dim);
 cursor:pointer;font-size:.9rem;line-height:1}
.blinkmore{margin-left:.3rem;padding:.15rem .5rem;border:1px dashed var(--line);border-radius:5px;
 background:none;color:var(--ink);font-size:.78rem;cursor:pointer}

/* A strip is a run like the outputs, drawn as wire and beads. The wire runs between the
   lights as well as around the turns, so where it begins and ends is readable */
.striprun{overflow-x:auto;padding:.2rem 0 .1rem}
.striprun svg{display:block}
.strip .head{margin-bottom:.3rem}
.strip .lamps{gap:.18rem}

/* How many lights are on a strip, which is a fact about the board and not the scene */
.leds{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--dim);
 margin:0 0 .7rem}
.leds input{font:inherit;font-size:.8rem;width:4.5rem;padding:.24rem .4rem;
 border-radius:7px;border:1px solid var(--line);background:var(--bg);color:inherit}
.leds .says{margin-left:.2rem}

/* Lines read from the board's file that no setting here stands for, carried as written */
.keptlines{margin:.6rem 0;padding:.5rem .7rem;border:1px dashed var(--line);border-radius:8px;
 font-size:.8rem;color:var(--dim)}
.keptlines .keptsay{margin-bottom:.3rem}
.keptlines .keptrow{display:flex;align-items:flex-start;gap:.4rem;margin:.15rem 0}
.keptlines code{white-space:pre-wrap;color:var(--ink);flex:1}
.keptlines .keptdrop{border:0;background:none;color:var(--dim);cursor:pointer;font-size:1rem;
 line-height:1;padding:0 .2rem}
.keptlines .keptdrop:hover{color:var(--ink)}
/* A sound's play button, in its tile's corner away from its cross */
.sound .hear{position:absolute;right:4px;bottom:4px;z-index:2;width:1.3rem;height:1.3rem;
 border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;
 background:var(--bg);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.sound .hear:hover{color:var(--ink);border-color:var(--ink)}
.sound .hear.playing{background:var(--accent);border-color:var(--accent);color:#fff}
/* A light a kept line plays, taken until that line goes */
.lamp.keptlamp, .sec.keptlamp{outline:2px dashed var(--dim);outline-offset:2px}
/* One set of pictures, each able to go to A, to B, or to both */
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.2rem,1fr));gap:.7rem}
.asset{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;
 background:var(--panel);padding:0}
.asset.onA{border-color:#1f6feb}
.asset.onB{border-color:#a44ad0}
.asset.onAB{border-color:var(--accent)}
.asset .face{position:relative;height:3.6rem;display:flex;align-items:center;
 justify-content:center;overflow:hidden;
 font-size:.7rem;color:var(--dim);background:linear-gradient(135deg,#efece6,#e3dfd6)}
.asset .face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.asset .kind{position:absolute;top:2px;left:2px;font-size:.6rem;
 background:rgba(20,20,22,.7);color:#fff;border-radius:4px;padding:0 .3rem;z-index:1}
/* The file name is only wanted when you go looking for it, so it lies over the
   picture on hover or on keyboard focus rather than taking a row of its own */
.asset .label{position:absolute;left:0;right:0;bottom:0;font-size:.7rem;
 padding:.25rem .4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 background:rgba(20,20,22,.82);color:#fff;opacity:0;transition:opacity .12s;
 pointer-events:none;z-index:1}
.asset:hover .label,.asset:focus-within .label{opacity:1}
.asset .pick{display:flex;border-top:1px solid var(--line)}
.asset .pick button{flex:1;border:0;border-radius:0;padding:.2rem;font-size:.75rem;
 font-weight:700;color:var(--dim);background:var(--panel)}
.asset .pick button:first-child{border-right:1px solid var(--line)}
.asset .pick button.lit{background:#1f6feb;color:#fff}
.asset .pick button.lit.b{background:#a44ad0}
/* Files come to the drive without leaving the page: a dashed tile at the end of
   each collection, in the plus's own manner */
.adder{border:1px dashed rgba(15,138,114,.5);border-radius:10px;background:rgba(15,138,114,.06);
 color:var(--accent);cursor:pointer;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:.25rem;
 font:600 .74rem system-ui,sans-serif;min-height:5.2rem}
.adder:hover{background:rgba(15,138,114,.14);border-color:var(--accent)}
.adder svg{display:block}
.sounds .adder{width:8.4rem}

/* Deleting is offered where the file is, quiet until the pointer arrives */
.bin{position:absolute;top:2px;right:2px;z-index:2;width:1.2rem;height:1.2rem;
 border-radius:5px;background:rgba(20,20,22,.7);color:#fff;line-height:1.2rem;
 text-align:center;font-size:.8rem;cursor:pointer;opacity:0;transition:opacity .12s}
.asset:hover .bin,.asset:focus-within .bin,.sound:hover .bin{opacity:1}
.bin:hover{background:#b4443a}
.sound{position:relative}

.screens-head{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-bottom:1rem}
.screen-box{border:2px solid var(--line);border-radius:10px;overflow:hidden}
.screen-box.a{border-color:#1f6feb}
.screen-box.b{border-color:#a44ad0}
.screen-box h3{font-size:.9rem;margin:0;padding:.4rem .9rem;color:#fff;background:var(--dim);
 display:flex;align-items:center;gap:.4rem}
/* The panel's size is a fact about the board, not about a scene, so it rides in
   the coloured band with the port's name instead of among the settings */
.screen-box h3 select.inband{margin-left:.4rem;border:1px solid rgba(255,255,255,.55);
 border-radius:6px;background:rgba(255,255,255,.15);color:#fff;font:inherit;
 font-size:.78rem;padding:.1rem .25rem}
.screen-box h3 select.inband option{color:var(--ink)}
.screen-box h3 .drop{margin-left:auto;background:transparent;border:0;color:#fff;font-size:1.1rem;
 line-height:1;padding:0 .2rem;opacity:.8}
.screen-box h3 .drop:hover{opacity:1}
.screen-box .body.adding{justify-content:center;padding:1.4rem .9rem}
.keep{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;
 width:calc(100% - 1.8rem);margin:0 .9rem .8rem;text-align:left;padding:.35rem .55rem;
 border:2px solid var(--line);border-radius:8px;background:var(--panel);font-size:.78rem}
.keep.picked{border-color:var(--accent)}
.keep b{flex-shrink:0}
/* The entry says itself in full: a truncated one is the half a reader cannot check */
.keep code{color:var(--dim);font-size:.72rem;line-height:1.45;word-break:break-word;
 flex:1 1 100%}
.screen-box.a h3{background:#1f6feb}
.screen-box.b h3{background:#a44ad0}
.screen-box .body{padding:.7rem .9rem;display:flex;flex-direction:column;gap:.7rem;
 align-items:center}
.screen-box .settings{width:100%;display:grid;grid-template-columns:1fr 1fr;
 gap:.4rem .8rem;align-items:center}
.screen-box .settings .showing{margin:0}
.screen-box .row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.holder{flex-shrink:0;line-height:0}
select{font:inherit;font-size:.85rem;padding:.25rem .3rem;border:1px solid var(--line);border-radius:6px}
.showing{font-size:.85rem;color:var(--dim);margin-top:.4rem}
.showing b{color:var(--ink)}
/* One sound plays at a time, so these behave as a gallery of one choice, each
   showing its shape and how long it runs */
.sounds{display:flex;flex-wrap:wrap;gap:.7rem}
.sound{width:8.4rem;padding:.45rem .5rem .4rem;border:2px solid var(--line);
 border-radius:10px;background:var(--panel);text-align:left;cursor:pointer}
.sound:hover{border-color:var(--dim)}
.sound.picked{border-color:var(--accent)}
.sound svg{display:block;width:100%;height:1.8rem}
.sound b{display:block;font:600 .74rem/1.5 system-ui,sans-serif;color:var(--ink);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sound small{color:var(--dim);font-size:.68rem}
.sound.quiet svg{opacity:.6}

/* Whether it starts again as it ends */
.again{align-self:center;padding:.3rem .6rem;border:1px solid var(--line);
 border-radius:7px;background:var(--panel);font:400 .78rem system-ui,sans-serif;
 color:var(--dim);cursor:pointer}
.again:hover:enabled{border-color:var(--dim);color:var(--ink)}
.again:disabled{opacity:.45;cursor:default}
.again.on{border-color:var(--accent);color:var(--accent);font-weight:600}
#status{font-size:.85rem;color:var(--dim)}
.banner{padding:.8rem 1.1rem;border-radius:10px;margin:1rem 0;background:#e7f2f1}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.hold{background:#fdf3e0;color:#8a6415}
.banner pre{margin:.4rem 0 0;white-space:pre-wrap;font-size:.85rem}
/* The seven outputs as the board lights them while a save is written */
.spots{display:inline-flex;gap:.3rem;margin-left:.7rem;vertical-align:middle}
.spots i{display:block;width:.85rem;height:.85rem;border-radius:3px;border:1px solid rgba(138,100,21,.45);
 background:rgba(138,100,21,.12)}
.spots i.lit{background:#fff;border-color:#8a6415;box-shadow:0 0 6px 1px rgba(255,255,255,.9)}
/* ---- where the board is set up ---- */

/* The board's own colour, which only its facts and the setup controls wear */
:root{--board:#56708f}

/* A board fact as it reads in place */
.facts{margin:.1rem 0 .7rem}

/* The board's chip, the same on every fact, so one is learnt and the rest are recognised */
.boardicon{color:var(--board);flex:0 0 auto}
/* The chip drawn larger than the room it takes, so nothing it sits in grows */
.boardicon{width:16px;height:16px;margin:-1.5px}

/* Drawn as the board boxes it opens are, their chip and their shape: outlined to set up,
   filled while setting up */
.setupbutton{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .6rem;
 border-radius:9px;border:1.5px solid var(--boardOuts);background:none;
 color:var(--boardOuts);font:600 .8rem system-ui,sans-serif;cursor:pointer}
.setupbutton:hover{background:#eef2f7}
.setupbutton .boardicon{color:currentColor}
.setupbutton.on{background:var(--boardOuts);color:#fff}
.setupbutton.on:hover{background:#34505f}

/* Saving in the header, the next thing to do filled in the page's colour */
:root{--warn:#b33;--warn-bg:#fbeaea}
header #status{margin-left:auto}
header button{font:inherit;font-size:.88rem;padding:.42rem .85rem;border:1px solid var(--line);
 border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
header button.primary{background:var(--accent);color:#fff;border-color:var(--accent);
 font-weight:600}
header button:disabled{opacity:.4;cursor:default}

/* A line the board named, marked in the file where the page still writes it as the board read
   it, the board's words after it */
.file .s-problem{background:var(--warn-bg);box-shadow:0 0 0 2px var(--warn-bg);
 border-radius:2px}
.file .s-said{color:var(--warn);font-style:italic}
.previewnote{margin:.2rem 0 .5rem;font-size:.8rem;color:var(--dim)}

/* The board's own settings: a row each, its name, its choice and a line under it, in the
   board's colour where a choice is made */
.boardrows{display:grid;gap:0}
.boardrow{display:grid;grid-template-columns:6rem 1fr;align-items:center;gap:.25rem .7rem;
 padding:.45rem 0;border-top:1px solid #dfe5ec}
.boardrow:first-child{border-top:0}
.boardrowname{font-size:.85rem;color:var(--dim)}
.boardrow small{grid-column:2;font-size:.76rem;color:var(--dim)}
.boardrow .sseg{justify-self:start}
.boardrows .sseg button.on{background:var(--board);color:#fff}
.boardrows .sseg button:disabled{cursor:default}
.boardrows .sseg button:disabled:not(.on){color:var(--dim)}
.boardrows .sseg button.on:disabled{background:#a9b6c6}

/* Choosing a program: those on the drive, then the examples by folder, the picked one's
   arguments under it */
.chooser{border-top:1px solid #dfe5ec;padding-top:.5rem}
.progheading{font:700 .72rem system-ui,sans-serif;color:var(--dim);text-transform:uppercase;
 letter-spacing:.04em;margin:.5rem 0 .3rem}
.progrow{display:grid;grid-template-columns:auto auto 1fr;gap:.05rem .5rem;align-items:baseline;
 width:100%;text-align:left;padding:.4rem .6rem;margin:0 0 .3rem;border:1.5px solid var(--line);
 border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:.86rem;cursor:pointer}
.progrow:hover:not(:disabled){border-color:var(--board)}
.progrow.on{border-color:var(--board);background:#eef2f7}
.progrow:disabled{cursor:default}
.progrow em{font-style:normal;font-size:.74rem;color:var(--dim)}
.progrow small{grid-column:1/4;font-size:.78rem;color:var(--dim)}
.progargs{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin:-.1rem 0 .5rem .8rem;
 font-size:.82rem;color:var(--dim)}
.progargs label{display:flex;align-items:center;gap:.4rem}
.progargs input,.progargs select{font:inherit;font-size:.82rem;width:9rem;padding:.22rem .4rem;
 border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff}
.progargs select{width:auto}
/* The cross taking away an argument added by hand */
.progless{font:inherit;font-size:.9rem;line-height:1;padding:.15rem .4rem;border:1px solid var(--line);
 border-radius:6px;background:#fff;color:var(--dim);cursor:pointer}
.progless:hover{border-color:var(--warn);color:var(--warn)}
.progmore{font:inherit;font-size:.8rem;padding:.2rem .55rem;border:1px dashed var(--board);
 border-radius:7px;background:none;color:var(--board);cursor:pointer}
.progfolder{margin:0 0 .25rem}
.progfolder summary{font-size:.86rem;cursor:pointer;padding:.15rem 0}
.progfolder summary small{color:var(--dim)}
.progfolder[open]{padding-left:.6rem}
.progfolder .progrow,.progfolder .progargs{margin-left:.6rem;width:calc(100% - .6rem)}

/* While a program runs in their place the effects stand back, a note above them saying why */
.programnote{display:flex;align-items:flex-start;gap:.45rem;margin:.4rem 0 .8rem;
 padding:.55rem .75rem;border:1.5px dashed var(--board);border-radius:10px;background:#eef2f7;
 color:var(--board);font-size:.85rem}
.programnote .boardicon{margin-top:.2rem}
.programnote[hidden]{display:none}
body.programmed #looks,body.programmed #tabs,body.programmed #sceneSettings,
body.programmed #tabStack>.panel:not(#boardPanel){opacity:.3}

/* A. The save button's menu, and what the board runs above the gallery */
header{position:relative}
header .savearrow{padding:.42rem .45rem;margin-left:-.7rem;border-top-left-radius:0;
 border-bottom-left-radius:0}
.savemenu{position:absolute;right:1rem;top:100%;z-index:6;width:19rem;background:#fff;
 border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.12);
 padding:.5rem .7rem}
.savechoice{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem 0;font-size:.86rem}
.savechoice small{display:block;font-size:.76rem;color:var(--dim)}
.savechoice.refused{color:var(--dim)}
.runsrow{margin:0 0 .8rem}
.runsline{display:flex;align-items:center;gap:.6rem;font-size:.86rem;color:var(--dim)}
.runsrow .sseg button.on{background:var(--board);color:#fff}
.runsrow .chooser{margin-top:.5rem;border-top:0;padding:.4rem .8rem .5rem;
 border:1.5px solid var(--board);border-radius:12px;background:#fff}

/* B. The board's box, laid over the gallery that Edit board greys, as tall as it needs, and
   its chip in the header */
.looksstack{display:grid}
.looksstack>#looks,.looksstack>.boardbox{grid-area:1/1}
.boardbox{align-self:start;z-index:2;background:#f7f9fb;border:1.5px solid var(--board);
 border-radius:12px;padding:.6rem .9rem .7rem;box-shadow:0 6px 20px rgba(40,60,80,.14)}
.boardbox[hidden]{display:none}
.boardband{display:flex;align-items:center;gap:.45rem;color:var(--board);
 font:700 .92rem system-ui,sans-serif;margin-bottom:.3rem}
.boardband small{font-weight:400;font-size:.78rem;color:var(--dim)}
header .boardchip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .6rem;
 border:1.5px solid var(--board);border-radius:9px;background:#eef2f7;color:var(--board);
 font:600 .8rem system-ui,sans-serif}
header .boardchip.on{background:var(--board);color:#fff}
header .boardchip .boardicon{color:currentColor}

/* C. The Board tab, in the board's colour */
.ledtab.boardtab.on{border-bottom-color:var(--board)}
.ledtab.boardtab{color:var(--board)}
.ledtab .accswatch.boardswatch{display:none}
.boardsays{margin:0 0 .5rem;font-size:.85rem;color:var(--dim)}

/* An effects page or a program page. The program page takes the effects view's place whole */
.programview{display:none}
body.programpage .programview{display:block}
body.programpage #tabs,body.programpage #sceneBody,body.programpage #programNote{display:none}
canvas.progthumb{display:block;image-rendering:pixelated;background:#222}
/* The chosen program, or the space it will take, the same size either way so choosing one moves
   nothing on the page. What the board runs is said along its top */
.proghero{display:flex;flex-direction:column;margin:.8rem 0 1.1rem;background:#fff;
 border:1.5px solid var(--board);border-radius:14px;overflow:hidden}
.proghero.unchosen{border-style:dashed}
/* Two lines' room, so a note that wraps takes no more than one that does not */
.proghero .programnote{margin:0;border:0;border-bottom:1.5px dashed var(--board);border-radius:0;
 align-items:center;box-sizing:border-box;min-height:calc(2 * 1.5 * .85rem + 1.1rem)}
.proghero .programnote span{flex:1}
.progchoosenone{flex:none;font:inherit;font-size:.8rem;padding:.2rem .6rem;border:1px solid var(--board);
 border-radius:7px;background:#fff;color:var(--board);cursor:pointer}
.herobody{display:flex;gap:1.1rem;align-items:flex-start;padding:.8rem}
.progpicture{flex:none;width:16rem;height:210px;display:flex;align-items:center;
 justify-content:center}
.proghero .progthumb.big{width:16rem;height:12rem;border-radius:8px;flex:none}
/* A pair's two panels side by side, each drawn at six tenths so both fit the picture's place */
.twopanels{display:flex;gap:.3rem;align-items:center}
.twopanels .holder{zoom:.6}
.progwords{min-width:0}
.progwords h3{margin:.1rem 0 .3rem;font-size:1.15rem}
.progwords p{margin:0 0 .45rem;font-size:.9rem}
.progwords .progwhere{font-size:.8rem;color:var(--dim)}
.progwords .progargs{margin:.6rem 0 0}
.proggrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.6rem}
.progcard{position:relative;display:block;padding:0;border:2px solid var(--line);
 border-radius:10px;overflow:hidden;background:#fff;text-align:left;cursor:pointer;font:inherit;
 color:var(--ink)}
.progcard:hover{border-color:#b9c4d2}
.progcard .progthumb{width:100%;height:auto;aspect-ratio:4/3}
.progcard.picked{border-color:var(--board);box-shadow:0 0 0 2px var(--board)}
.progname{display:block;padding:.35rem .55rem;font-size:.85rem;font-weight:600;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* What a program uses: a row of small drawings along the foot of its thumbnail, named beside the
   picked one, and as chips choosing which are shown. Drawn at 18px wherever they appear, so a
   chip reads the same as a card */
.featureicon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}
.featureicon .f{fill:currentColor;stroke:none}
.featureicon .fs{fill:currentColor}
.proguses{position:absolute;right:4px;top:calc(100% - 2.1rem - 26px);display:flex;gap:2px}
.proguses .featureicon{width:22px;height:22px;padding:2px;border-radius:4px;color:#fff;
 background:rgba(20,20,22,.7)}
.herouses{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin:.1rem 0 .4rem;font-size:.84rem}
.herouses span{display:inline-flex;align-items:center;gap:.35rem;color:var(--board)}
.featurefilter{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem;margin:.2rem 0 .2rem;
 font-size:.8rem;color:var(--dim)}
.featurefilter>span{margin-right:.2rem}
.featurechip{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .45rem .15rem .3rem;
 border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);
 font:inherit;font-size:.78rem;cursor:pointer}
.featurechip:hover{border-color:var(--board)}
.featurechip.on{background:var(--board);border-color:var(--board);color:#fff}
.featureclear{border:0;background:none;color:var(--board);font:inherit;font-size:.78rem;
 text-decoration:underline;cursor:pointer}
.prognone{font-size:.86rem;color:var(--dim)}
.effectsface{display:flex;align-items:center;justify-content:center;background:#1c1f22;
 padding:0 .45rem;border-radius:8px}
.effectsface .accswatch{width:100%;height:.8rem;margin:0}

/* Two covers: what runs, each showing what it would run */
.cover{display:flex;align-items:center;gap:.9rem;padding:.55rem .8rem;border:2px solid var(--line);
 border-radius:14px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:var(--ink);
 opacity:.7}
.cover:hover{opacity:1}
.cover.on{opacity:1;border-color:var(--accent);box-shadow:0 3px 12px rgba(0,0,0,.08)}
.cover[data-page=program].on{border-color:var(--board)}
.cover .coverface{width:5.6rem;height:4.2rem;flex:none;border-radius:8px}
.cover b{display:block;font-size:1rem}
.cover small{display:block;font-size:.8rem;color:var(--dim)}

/* The covers in the header, in place of the page's strapline, small enough to keep the header
   its height. Where the header grows too narrow for them they take a slim line of their own
   under it, each half its width */
body[data-pageway^=head] header .says{display:none}
.headswitch{display:flex;gap:.45rem;margin-right:auto}
header h1+.headswitch{margin-left:.6rem}
body[data-pageway^=head] header h1{margin-right:0}
.headswitch:empty{display:none}
@media (max-width:1180px){
 header .headswitch{order:10;flex:1 0 100%;margin:0}
 header h1+.headswitch{margin-left:0}
 header .headswitch .cover{flex:1;padding:.2rem .6rem .2rem .25rem}
 header .headswitch .cover .coverface{width:2.1rem;height:1.55rem}
 body[data-pageway^=head] header h1{margin-right:auto}
}

/* Tabs off the header's foot: each hangs from its lower edge, the chosen one open onto the page */
.headswitch.headtabs{align-self:flex-end;margin-bottom:-1px;gap:.25rem}
.headswitch.headtabs .cover{border:1.5px solid var(--line);border-bottom:0;
 border-radius:10px 10px 0 0;background:#ece8e1;opacity:1;color:var(--dim);
 padding:.3rem .8rem .35rem .35rem}
/* The chosen tab, and the chosen scene, carry one mark: a band painted in the background from
   the outer edge, under a top border made clear, running the width of the top. Every tab keeps
   the same border, so nothing in a tab moves when it is chosen */
.headswitch.headtabs .cover.on{color:var(--ink);border-top-color:transparent;--band:var(--accent);
 background:linear-gradient(var(--band),var(--band)) 0 0 / 100% 3px no-repeat border-box,
            var(--bg)}
.headswitch.headtabs .cover[data-page=program].on{--band:var(--board)}
/* The way into another scene is the grid's last tile, stretched to the cards' height as they
   are, the pill it is drawn from centring itself instead */
body[data-pageway] #tabs.tabbar.wrapped .plus{align-self:stretch}
/* A scene card's inset shadow curls into its corners, so it is taken off */
body[data-pageway] #tabs.tabbar.wrapped .tab.on{border-color:var(--line);
 border-top-color:transparent;box-shadow:none;
 background:linear-gradient(var(--accent),var(--accent)) 0 0 / 100% 3px no-repeat border-box,
            var(--panel)}
.headswitch.headtabs .cover[data-page=program].on b{color:var(--board)}
@media (max-width:1180px){
 .headswitch.headtabs{margin-top:.5rem}
}

/* Tabs split under it: the same tabs, a line of their own under the header's first, split evenly
   across the page's own column so they stand over what they open */
/* The row is always the header's whole width, so it never fits beside the title and rejoins its
   line on a wide window, and its padding narrows the tabs to the column */
.headswitch.headsplit{order:10;flex:1 0 100%;margin:0 0 -1px;align-self:auto;
 box-sizing:border-box;padding:0 max(0px, calc((100% - 57.2rem) / 2))}
body[data-pageway=headsplit] header{flex-wrap:wrap;padding-bottom:0}
body[data-pageway=headsplit] header h1{margin-right:auto}
/* The tab's right edge is as close as its left, so the scenes' button sits as far in from it
   as the picture does from the other side */
.headswitch.headsplit .cover{flex:1;padding-right:.35rem}
/* A narrow window shrinks the other header covers, but these tabs keep their size, so they are
   one height at every width */
@media (max-width:1180px){
 header .headswitch.headsplit{margin:0 0 -1px}
 header .headswitch.headsplit .cover{padding:.3rem .35rem .35rem .35rem}
 header .headswitch.headsplit .cover .coverface{width:2.6rem;height:1.95rem}
}
/* What follows the page's name, as one group at the header's right */
.headactions{display:flex;align-items:center;gap:.8rem;margin-left:auto;flex-wrap:wrap;
 justify-content:flex-end}
/* A window wide enough for all three: the name, the tabs over the column and the group share one
   line, the name and group sitting down on the tabs' line */
header.oneline{flex-wrap:nowrap;align-items:flex-end}
/* The buttons keep the header's own top padding above and below them, and the tabs run from the
   buttons' top edge to the header's foot, so the tabs' height follows from the buttons'. Both
   figures are measured and set by the page, --headgap below the buttons and --tabheight */
header.oneline h1{flex:1 1 0;margin:0 0 var(--headgap,.8rem);white-space:nowrap;
 line-height:var(--buttonheight,2.3rem)}
header.oneline .headactions{flex:1 1 0;margin:0 0 var(--headgap,.8rem);flex-wrap:nowrap}
.headactions button{white-space:nowrap}
header.oneline .headswitch.headsplit{order:0;flex:0 0 57.2rem;padding:0;margin:0 0 -1px}
header .headswitch.headsplit .cover{height:var(--tabheight,3.1rem);padding-top:0;
 padding-bottom:0}
/* Filling the tab: the picture its height less an inset, at a screen's shape, the label a size
   up, and a program's name beside its label so the label never moves when one is picked */
header .headswitch.headsplit .cover .coverface{height:calc(var(--tabheight,3.1rem) - .6rem);
 width:calc((var(--tabheight,3.1rem) - .6rem) * 4 / 3)}
.headswitch.headsplit .cover>span{display:flex;align-items:baseline;gap:.55rem;min-width:0}
.headswitch.headsplit .cover b{font-size:.95rem}
.headswitch.headsplit .cover small{font-size:.8rem;max-width:none;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}

/* The way into scenes, at the end of the effects tab while there are none, the row it had above
   the gallery gone */
body.scenesintab #tabs{display:none}
/* With nothing above it the gallery comes up under the tabs, the kind tabs' empty row taken out */
body.scenesintab #looks>.tabs.sides:empty{display:none}
body.scenesintab #looks>.shelf{margin-top:0}
/* Drawn as the scenes' button is, placed at the tab's end */
.headswitch .cover .plus{margin-left:auto;flex:none;opacity:1}
.headswitch .cover:not(.on) .plus{display:none}

.headswitch .cover{gap:.5rem;padding:.25rem .6rem .25rem .3rem;border-radius:10px;
 box-shadow:none}
.headswitch .cover .coverface{width:2.6rem;height:1.95rem;border-radius:5px}
.headswitch .cover b{font-size:.84rem;line-height:1.15}
.headswitch .cover small{font-size:.72rem;line-height:1.2;max-width:8.5rem;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.headswitch .cover b{white-space:nowrap}
.headswitch .effectsface{padding:0 .25rem}
.headswitch .effectsface .accswatch{height:.5rem}

/* The header's spacer, which holds the drive buttons at the right */
.setuphead{margin-left:auto}

/* A coloured box is a board setting, each section's in its own colour. The chip icon sits
   inside the box, never around it */
:root{--boardOuts:#3f5a6b;--stripL:#c2570f;--stripR:#8a1f6d;--screenA:#1f6feb}
.chip.boardchip{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .55rem;
 border-radius:9px;color:#fff;font:600 .82rem system-ui,sans-serif}
.boardchip .boardicon{color:#fff;opacity:.9}
.boardchip small{font-weight:400;opacity:.85}
.boardchip.outs{background:var(--boardOuts)}
.boardchip.stripl{background:var(--stripL)}
.boardchip.stripr{background:var(--stripR)}
.boardchip select{border:1px solid rgba(255,255,255,.55);border-radius:6px;
 background:rgba(255,255,255,.15);color:#fff;font:inherit;font-weight:400;
 font-size:.78rem;padding:.1rem .25rem}
.boardchip select option{color:var(--ink)}
.cross.boardarrow{color:var(--boardOuts);border-color:var(--boardOuts)}
.facts .hint{font-size:.76rem;color:var(--dim);margin-left:.6rem}
/* The outputs' setup hint stays on the line of their box, so setting up moves no lamp, and
   is cut short where the page is too narrow, its whole saying in its tooltip */
#outFacts{display:flex;align-items:center;margin-top:0}
#outFacts .chip{flex:0 0 auto;white-space:nowrap}
/* With the sides unnamed the lamps sit under the board's box at a strip's spacing, their
   own margin being for the heading and adding to the box's inside the sides */
#sides.unnamed .run{margin-top:0}
#outFacts .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
 flex:1 1 0;width:0}

/* The board being set up from a section: the scenes, the looks and every run's cutting
   stand back, and every section's board settings open at once */
body.setupall #tabs,body.setupall #sceneSettings,
body.setupall #looks,body.setupall [id$=Cut],body.setupall [id$=Bar],
body.setupall [id$=Tools],body.setupall [id$=Chosen]{opacity:.35;pointer-events:none}
/* On the Screens tab, what each scene shows stands back: the pictures, which one is
   showing and which way up it is drawn. The bands, the screens' own boxes, stay */
body.setupall #assets,body.setupall #screensSays,
body.setupall .screen-box .settings{opacity:.35;pointer-events:none}
/* Nothing about the sound is the board's, so on the Sound tab all of it stands back */
body.setupall #soundPanel{opacity:.35;pointer-events:none}

/* The Sound tab's swatch: the shape of the sound playing, or silence */
.accswatch.soundswatch{align-items:center;gap:1px;box-shadow:none;height:.9rem;width:3.2rem}
.soundswatch span{flex:1;background:var(--accent);border-radius:1px;min-height:2px}
.soundswatch.silent{height:.2rem;background:#c9c3b9;border-radius:1px}
.soundsays{margin:0 0 .8rem}

/* ---- the wiring, while the board is set up ----
   The board's seven connectors under both sides of the outputs, a faint line from every
   pin to its lamp, never none, brought forward by pointing at the lamp or the connector */
#outPanel.wired{position:relative}
#outPanel.wired .sides{position:relative;z-index:1}
/* The cutting is the scene's and waits while the board is set up, so it steps out of the
   way, and the connectors sit straight under the lamps they feed */
#outPanel.wired #outCut,#outPanel.wired #outBar,#outPanel.wired #monoCut,
#outPanel.wired #monoBar{display:none}
/* The seven sit in one strip, the board's edge, and a connector is its pins and its
   number with nothing round it. Drawn as a box it read as a thing to pick up: someone went
   to drag one next to the lamps it feeds to uncross the wires */
.wireconnectors{display:flex;justify-content:space-between;gap:.5rem;margin:2.8rem 0 0;
 position:relative;z-index:1;background:#2b3036;border-radius:6px;
 padding:.35rem .45rem .2rem}
.wireconnector{padding:0 .3rem;cursor:default}
.wirepins{display:flex;gap:.35rem;justify-content:center}
.wirepin{display:block;width:.8rem;height:.45rem;border-radius:2px}
/* A colour output is one lamp, so one pin */
.wirepin.whole{width:2.9rem;background:#cfc8bc}
.wireconnector b{display:block;text-align:center;color:#a7a197;
 font:600 .66rem/1.4 system-ui,sans-serif}
.wireconnector:hover b{color:#fff}
/* Over the side boxes, so a line runs all the way up to its lamp. A line ends at the foot
   of its lamp and only runs down from there, so it never crosses a lamp */
svg.wirelines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
 overflow:visible;z-index:2}
svg.wirelines path{fill:none;stroke-width:1.6;opacity:.16}
svg.wirelines path.wirehot{opacity:1;stroke-width:2.4}
#outPanel .lamp.wirehot{outline:2px solid var(--ink);outline-offset:1px}
.wirepin.wirehot{outline:2px solid #fff;outline-offset:1px}
.wiresay{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}
.wiresay b{color:var(--ink)}
/* Out of the order they are wired in: bold, there being colours enough on a lamp */
body.setupall #outPanel .lamp.astray b{font-weight:700;color:var(--ink)}
#outPanel .lamp.moving{z-index:3;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.18)}

/* ---- setting up in build order: one row of every lamp, the sides giving way ---- */
#outPanel.buildorder #sides{display:none}
#buildHolder{position:relative;z-index:1}
#buildHolder .buildhead{font:600 .9rem system-ui,sans-serif;display:flex;
 align-items:baseline;gap:.6rem;margin:.2rem 0 .5rem}
#buildRun{border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;
 background:var(--panel)}
#buildRun .lamps{justify-content:center}
/* An output's own mark, to expand it into three or contract three back, over its corner */
#buildRun .outgroup .cross{right:-.3rem;left:auto}

/* ---- the LED sections as an accordion: a closed one says in a swatch what it plays ---- */
.accswatch{display:inline-flex;width:8rem;height:.55rem;border-radius:3px;overflow:hidden;
 align-self:center;margin-left:.2rem;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.accswatch span{display:block;height:100%}
.accswatch .nothing{background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 3px,
 #e0dbd2 3px,#e0dbd2 6px)}
details[open]>summary .accswatch{display:none}

/* ---- the LED sections as tabs: a row of names under the gallery, a line under the one
   chosen, each with its swatch, so they read as parts of one board and not as scenes ---- */
.ledtabs{display:flex;gap:1.6rem;border-bottom:1px solid var(--line);margin:1.4rem 0 1rem}
.ledtab{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;border:0;
 border-bottom:2px solid transparent;border-radius:0;background:none;
 padding:.45rem .1rem .5rem;margin-bottom:-1px;cursor:pointer;color:var(--dim)}
.ledtab b{font:600 .92rem system-ui,sans-serif}
.ledtab:hover{color:var(--ink)}
.ledtab.on{color:var(--ink);border-bottom-color:var(--accent)}
.ledtab .accswatch{margin:0}
/* On a narrow page the LED tabs' swatches give way, so the row keeps Set up inside it */
.ledtabs .ledtab{flex:0 1 auto;min-width:0}
.ledtab b{white-space:nowrap}
.ledtab .accswatch:not(.screenswatch):not(.soundswatch){max-width:100%}
/* A section shown as a tab is not folded away, so its header has no fold mark */
/* Every tab's section in one grid cell, laid out whether seen or not, so the cell is as
   tall as the tallest and choosing a tab moves nothing below it */
/* The browser holds some element in view still as a page changes, and choosing a tab hides
   the one it held, so it picks another and scrolls to hold that: the page jumped though
   nothing changed height. Nothing above the tabs moves, so the page holds itself */
html{overflow-anchor:none}
.tabstack{display:grid}
.tabstack>.panel{grid-area:1/1;margin:0;align-self:start}
.tabstack>.tabhidden{visibility:hidden;pointer-events:none}
/* The chosen tab names the section, so the section has no heading of its own */
.panel.tabbed>summary{display:none}
/* A live swatch: a small copy of the section's lamps, the cells running into one another
   with no line between, which on a long strip left more line than lamp */
.accswatch.liveswatch{gap:0;box-shadow:none;height:.55rem;
 background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 3px,#e0dbd2 3px,#e0dbd2 6px)}
.liveswatch span{flex:1;border-radius:0}
/* The Screens tab's swatch: its two screens side by side, each showing its picture, in the
   screen's own colour */
.accswatch.screenswatch{gap:.2rem;box-shadow:none;height:.9rem;width:3.2rem}
.screencell{flex:1;border-radius:2px;background:#2a2f33 center/cover no-repeat;
 box-shadow:inset 0 0 0 1.5px var(--cell)}
/* The Screens tab has room across, so its screens sit beside its name at the tab's full
   height, large enough to see what each shows, and the tab is no taller than the rest */
.ledtab[data-panel=screensPanel],.ledtab[data-panel=soundPanel]{flex-direction:row;
 align-items:flex-start;gap:.55rem}
.ledtab[data-panel=screensPanel] .screenswatch{height:2.15rem;width:auto;gap:.3rem}
.ledtab[data-panel=screensPanel] .screencell{flex:0 0 2.15rem;border-radius:3px;
 box-shadow:none}
/* Under the Screens and Sound tabs' names, where the others have their swatch, a word on
   what they hold. It takes no width of its own, so a tab stays its name's width whatever it
   says, the longest running a few pixels into the gap before the preview */
.ledtab .tabunder{display:block;font:.68rem/.55rem system-ui,sans-serif;color:var(--dim);
 white-space:nowrap;width:0;overflow:visible}
.ledtab .tabname{display:flex;flex-direction:column;gap:.35rem}
/* The Sound tab's preview, the sound playing drawn at the screens' size on a white tile,
   and stripes for silence as a lamp playing nothing has */
.ledtab[data-panel=soundPanel] .soundswatch{position:relative;height:2.15rem;width:4.3rem;
 background:#fff;border-radius:3px;padding:0;box-sizing:border-box;overflow:hidden;
 box-shadow:inset 0 0 0 1px var(--line)}
.ledtab .soundoutline{display:block;width:100%;height:100%}
.ledtab[data-panel=soundPanel] .soundswatch.silent{height:2.15rem;border-radius:3px;
 background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 3px,#e0dbd2 3px,#e0dbd2 6px)}
/* On repeat, a loop in the corner on a white spot, so it reads over the outline */
.ledtab .soundswatch .repeatmark{position:absolute;right:2px;bottom:2px;width:.8rem;
 height:.8rem;padding:1px;box-sizing:border-box;color:var(--dim);background:#fff;
 border-radius:50%}
/* The Sound section's tiles are drawn as the pictures' are, their sound filling a face the
   pictures' height edge to edge, over its name and length */
/* Three across, a sound being long and a picture near square, so the outline has room */
.sounds{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.sound{padding:0;overflow:hidden;width:auto}
/* The tile adding sounds is the size of a sound's */
.sounds .adder{width:auto;align-self:stretch}
.sound svg{height:3.6rem;border-bottom:1px solid var(--line)}
.sound .nothingface{display:block;height:3.6rem;border-bottom:1px solid var(--line);
 background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 7px,#e4e0d9 7px,#e4e0d9 14px)}
.sound b{padding:.3rem .5rem 0}
.sound small{display:block;padding:0 .5rem .35rem}
/* A screen fitted with no picture chosen is a white tile, as an empty sound is, so it
   reads apart from one not fitted, which is striped */
.ledtab[data-panel=screensPanel] .screencell.blank{background:#fff;
 box-shadow:inset 0 0 0 1px var(--line)}
.screencell.a{--cell:#1f6feb}
.screencell.b{--cell:#a44ad0}
.screencell.absent{background:repeating-linear-gradient(45deg,#f0eeea,#f0eeea 3px,
 #e0dbd2 3px,#e0dbd2 6px);box-shadow:none}
.screenssays{margin:0 0 .8rem}
.screen-box h3 .boardicon{color:#fff;opacity:.9}
.screen-box select:disabled,.screen-box button:disabled{opacity:.75;cursor:default}
/* A Screen Hub: two screens or a hub is a board fact, always shown and changed while editing
   the board. The hub is one box across both connectors, in the colour of the one its screens
   come through, its six positions in a row under its band */
.hubswitch{display:inline-flex;align-items:stretch;border-radius:9px;overflow:hidden;
 background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--screenA);
 font:600 .82rem system-ui,sans-serif}
/* The chip leads the first choice, so it wears that choice's fill when it is the one made */
.hublead{display:flex;align-items:center;padding:0 .1rem 0 .55rem}
.hublead .boardicon{color:var(--screenA)}
.hublead.on{background:var(--screenA)}
.hublead.on .boardicon{color:#fff}
.hubswitch button{border:0;border-radius:0;background:transparent;color:var(--screenA);
 font:inherit;line-height:1.3;padding:.3rem .55rem;cursor:pointer}
.hubswitch button.on{background:#1f6feb;color:#fff}
.hubswitch:not(.locked) button:not(.on):hover{background:rgba(31,111,235,.1)}
/* Locked, the choice made reads as a fact, a filled chip like the other tabs' boxes, and the
   other is only a grey mention with no outline of its own to press */
.hubswitch.locked{box-shadow:inset 0 0 0 1px var(--line)}
.hubswitch.locked button{cursor:default;color:var(--dim);opacity:.7}
.hubswitch.locked button.on{color:#fff;opacity:1}
.hubswitch.locked .hublead:not(.on) .boardicon{color:var(--dim);opacity:.7}
.hubbox{grid-column:1/-1;--hub:#1f6feb;--hubwash:rgba(31,111,235,.06)}
.hubbox.b{--hub:#a44ad0;--hubwash:rgba(164,74,208,.06)}
.hubbox h3 .hubcount{font-weight:400;opacity:.85;margin-left:.3rem}
.places{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem;width:100%}
.place{position:relative;display:flex;flex-direction:column;align-items:center;gap:.25rem;
 border:2px solid transparent;border-radius:9px;padding:.3rem .2rem .35rem;cursor:pointer}
.place:hover{background:var(--hubwash)}
.place.picked{border-color:var(--hub)}
.place .holder{zoom:.55}
/* The letter sits in the position's corner, as on the silk, and its panel size in the middle */
.placetop{display:flex;align-items:center;justify-content:center;min-height:1.5rem;
 width:100%}
