builtins = [
    # micropython
    "micropython",
    "const",
    "ptr8",
    "ptr32",
]

# Include:
# F = Pyflakes
# Q = Quotes
# E/W = pycodestyle (Whitespace, Line lengths etc)
# B - flake8-bugbear = Unused loop variables, sloppy code
# COM - flake8-commas
# BLE - flake8-blind-except
# C4  - flake8-comprehensions
# ISC - flake8-implicit-str-concat = Implicit string concat, eg: `"hello" "world"` on one line
# ICN - flake8-import-conventions = Import conventions
# PIE - flake8-pie = Misc silliness, catches range with a 0 start argument
# RET - flake8-return = Enforces straight-forward code around return statements
# SLF - flake8-self
# ARG - flake8-unused-arguments

lint.select = [
    "F",
    "Q",
    "W",
    "E",
    "B",
    "COM",
    "BLE",
    "C4",
    "ISC",
    "ICN",
    "PIE",
    "RSE",
    "RET",
    "SLF",
    "ARG"
]

# Ignore:
# E501 - "line too long". How narrow is your screen!?
# E402 - "module level import not at top of file". Needs must!
# COM812 - "Add trailing comma". These are a little obnoxious and weird.
# ICN001 - "numpy should be imported as np". No. No it should not.
# B905 - "zip() without strict=". MicroPython's zip has no such parameter.

# Sloppy, we should probably fix at some point:
# RET503 - "add explicit `return` statement". Yolo.
# RET505 - "unnecessary `else` after `return` statement". Yolo.
# SLF001 - "private member accessed".

lint.ignore = [
    "E501",
    "E402",
    "B905",
    "COM812",
    "RET503",
    "RET505",
    "SLF001"
]

# Per file:
# E702 - the RGB444 viper reference kernel writes each 3-byte background pixel pair
#        on one line.
# F401 - a package's __init__.py imports the names the package is used through, so
#        every one of them is unused where it is written.

lint.per-file-ignores = { "**/reference/st7789_viper_rgb444.py" = ["E702"], "**/screens/__init__.py" = ["F401"] }